划：想清动机、目标、时间和精力","马上开始学","买课程","找同伴"],"answer":0,"why":"以终为始，先规划。"}],"task":"在你的项目文档开头写四行：动机、目标、每周可投入时间、当前精力状态（1–5 分）。","taskHint":"如果时间少、精力低，就把项目再切小一点。10 分钟。","ep":"第 37 集"},"zs13":{"id":"zs13","title":"关键词堆起来，不是体系","courseLabel":"知识体系训练营 · 加餐2 如何形成知识体系","scenes":[{"place":"周六","who":"旁白","line":"燕美在笔记里建了很多标签：发票、税务、付款、银行、Excel……"},{"place":"10:00","who":"燕美（心里）","line":"关键词这么多，好像有体系了？"},{"place":"周一","who":"新会计","line":"燕美姐，一笔预付款开了发票还没到货，账要怎么处理？"},{"place":"10:10","who":"旁白","line":"燕美翻遍标签，找不到一个能直接回答问题的地方。"}],"cliff":"关键词分得很细，为什么还是答不上问题？","teacher":["分类有两种逻辑：按知识本身的属性分，和按要解决的问题分。","用终极三问搭框架：是什么、为什么、怎么做。老师用经济学、历史学示范过：每个学科都可以用这三问串起来。","体系背后串起来的是问题，不是关键词。关键词只是索引，问题才是骨架。","PBL 也有边界：不是所有知识都适合用项目来学，基础通识有时就要系统地读。"],"source":"知识体系训练营 · 加餐2 如何形成知识体系（按课程要点改写）","after":[{"place":"10:20","who":"燕美","line":"我应该建一个“业务问题清单”：预付款、退款、跨月发票……每个问题下面写怎么做。"},{"place":"10:40","who":"旁白","line":"她把“预付款开票未到货”作为第一个问题，写下处理方法和依据。"}],"quiz":[{"q":"知识体系背后真正串起来的是？","options":["问题","关键词","标签数量","笔记字数"],"answer":0,"why":"串起体系的是问题，关键词只是索引。"},{"q":"终极三问是？","options":["谁、何时、何地","是什么、为什么、怎么做","多少、多久、多贵","对不对、好不好、行不行"],"answer":1,"why":"用三问搭框架。"}],"task":"写下 3 个你工作中最常被问到的问题，每个问题下面写一句“怎么做”。","taskHint":"这就是你的第一张“问题清单”。10 分钟。","ep":"第 38 集"},"wn01":{"id":"wn01","title":"脑子里装了太多事","courseLabel":"外脑系统训练营 · 01 外脑系统的理念","scenes":[{"place":"周一 8:50","who":"旁白","line":"燕美一边开机，一边在脑子里过：工行回单、贷后资料、工资表、承兑到期、孩子家长会……"},{"place":"9:30","who":"燕美（心里）","line":"还有什么来着？我总觉得忘了一件事。"},{"place":"14:00","who":"银行客户经理","line":"燕美姐，上周说好的补充材料呢？"},{"place":"14:01","who":"燕美","line":"……就是这件。"}],"cliff":"脑子总在记事，为什么还是会忘？","teacher":["外脑就是用信息化工具替大脑记东西。","它能解决四个问题：遗忘、信息乱堆、脑力被占用、缺少创造的素材。","谷歌效应：人知道信息存在哪里以后，就不会费劲去记它，脑力就能留给思考。","大脑用来想事情，外脑用来记事情。"],"source":"外脑系统训练营 · 01 外脑系统的理念（按课程要点改写）","after":[{"place":"14:10","who":"燕美","line":"我不该用脑子当备忘录。"},{"place":"14:15","who":"旁白","line":"她在手机笔记里建了一个“收集箱”，把脑子里想到的所有事都倒了进去。"}],"quiz":[{"q":"外脑的核心作用是？","options":["让人更聪明","替大脑记东西，让脑力留给思考","代替工作","存照片"],"answer":1,"why":"外脑记、内脑想。"},{"q":"“知道信息存在哪就不会费劲去记”，这叫？","options":["马太效应","蝴蝶效应","谷歌效应","鲶鱼效应"],"answer":2,"why":"谷歌效应：知道去哪找，大脑就会放手。"}],"task":"建一个“收集箱”（手机笔记的一页就行），把脑子里所有待办和想法倒进去，至少 10 条。","taskHint":"不分类、不整理，先倒出来。10 分钟。","ep":"第 39 集"},"wn02":{"id":"wn02","title":"该用哪个笔记软件","courseLabel":"外脑系统训练营 · 02 外脑载体的选择","scenes":[{"place":"周二","who":"旁白","line":"燕美想建外脑，先搜了“最好用的笔记软件”。"},{"place":"21:00","who":"旁白","line":"印象笔记、有道、Notion、Obsidian、思源……每个都有人说好。"},{"place":"22:30","who":"燕美（心里）","line":"比了一晚上，还没开始记一条笔记。"},{"place":"22:40","who":"燕美","line":"我是不是又掉进工具坑了？"}],"cliff":"工具那么多，怎么选才不被工具绑架？","teacher":["电子笔记胜过纸质：能搜、能同步、能链接。","公有云笔记（各类在线笔记）容易上手；私有云或本地笔记（如 Obsidian、思源）可定制，数据在自己手里。","推荐“中枢 + 分支”组合：一个主力笔记当中枢，其他工具按场景当分支，比如表格、网盘。","最重要的一句：别陷进工具癖。选一个够用的，先用起来。"],"source":"外脑系统训练营 · 02 外脑载体的选择（按课程要点改写）","after":[{"place":"22:50","who":"燕美","line":"我已经在用思源了，就把它当中枢。微信收藏和表格当分支。"},{"place":"23:00","who":"旁白","line":"她关掉了对比软件的网页，在思源里记下第一条正式笔记。"}],"quiz":[{"q":"课程推荐的外脑组合方式是？","options":["只用纸质本子","每个软件都用一遍","中枢 + 分支","只用微信收藏"],"answer":2,"why":"一个中枢，多个分支。"},{"q":"选工具时最该警惕的是？","options":["工具太少","软件太便宜","界面太简单","陷入工具癖，迟迟不开始用"],"answer":3,"why":"工具够用就行，先用起来。"}],"task":"定下你的外脑中枢（一个软件），写下 1–2 个分支工具和各自管什么。","taskHint":"例：中枢——思源；分支——表格管账户清单、网盘管扫描件。10 分钟。","ep":"第 40 集"},"wn03":{"id":"wn03","title":"文件夹建了一百个","courseLabel":"外脑系统训练营 · 03 安装外脑操作系统","scenes":[{"place":"周三","who":"旁白","line":"燕美在笔记软件里建文件夹：工作、银行、工行、建行、贷款、学习、常青课……"},{"place":"21:00","who":"燕美（心里）","line":"“建行贷款资料”放“建行”还是放“贷款”？"},{"place":"21:30","who":"旁白","line":"文件夹越建越多，有的交叉，有的只有一条笔记。"},{"place":"21:40","who":"燕美","line":"这结构好像比没有还乱。"}],"cliff":"外脑的“根目录”怎么搭，才不会越建越乱？","teacher":["根目录要覆盖你生活工作的全部场景，并且一次定好，不要经常改。","要避免三种问题：交叉（一条笔记可以放两个地方）、割裂（相关的东西被分散）、过多（一般 5–9 个为宜）。","可以借用 GTD 的几个区：收集箱（先放进来）、等待处理、将来可能、归档。","结构定好以后，日常只往里放，不要随手新建顶层文件夹。"],"source":"外脑系统训练营 · 03 安装外脑操作系统（按课程要点改写）","after":[{"place":"21:50","who":"燕美","line":"顶层只留七个：收集箱、工作、学习、生活、项目、素材、归档。"},{"place":"22:10","who":"旁白","line":"她把“工行”“建行”这些挪进“工作”下面，删掉了一堆空文件夹。"}],"quiz":[{"q":"根目录的数量，课程建议一般是？","options":["2–3 个","20 个以上","越多越好","5–9 个"],"answer":3,"why":"5–9 个为宜，太多就乱。"},{"q":"“一条笔记既能放 A 也能放 B”，说明结构有什么问题？","options":["交叉","割裂","过多","太少"],"answer":0,"why":"交叉会让人每次都犹豫放哪里。"},{"q":"借用 GTD，下面哪个不是推荐的区？","options":["收集箱","每日心情","等待处理","将来可能"],"answer":1,"why":"收集箱、等待处理、将来可能、归档。"}],"task":"写下你外脑的顶层目录（5–9 个），检查有没有交叉，并建好“收集箱”。","taskHint":"先写在纸上，确认了再去软件里改。10 分钟。","ep":"第 41 集"},"wn04":{"id":"wn04","title":"收藏了一千篇文章","courseLabel":"外脑系统训练营 · 04 输入的逻辑","scenes":[{"place":"周四","who":"旁白","line":"燕美的微信收藏里有一千多篇文章：财务技巧、育儿、理财、自律……"},{"place":"21:00","who":"燕美（心里）","line":"收藏的时候觉得都有用，可一篇都没再打开过。"},{"place":"21:10","who":"旁白","line":"她又顺手收藏了三篇。"},{"place":"21:20","who":"燕美","line":"我是在收藏，还是在囤积？"}],"cliff":"看到好内容就收藏，为什么收藏越多越没用？","teacher":["用收集箱中转：先进收集箱，再定期整理。输入和整理要分开，别边看边整理。","只收“触点”：真正能改变你认知或行为的内容，不是“看着有用”的内容。","提炼精华，不要全文复制：用一两句话记下触动你的点和出处。","收集箱要定期清空，不然它就成了另一个垃圾堆。"],"source":"外脑系统训练营 · 04 输入的逻辑（按课程要点改写）","after":[{"place":"21:30","who":"燕美","line":"以后只收触点，而且写一句为什么收。"},{"place":"21:40","who":"旁白","line":"她从一千篇里挑了 5 篇真正改变过她做法的，各写了一句话。"}],"quiz":[{"q":"输入外脑的内容应该是？","options":["能改变认知或行为的触点","所有看着有用的","越多越好","全文复制"],"answer":0,"why":"只收触点。"},{"q":"输入和整理的关系，课程建议？","options":["边看边整理","分开：先进收集箱，再定期整理","只输入不整理","只整理不输入"],"answer":1,"why":"输入和整理分开，效率更高。"}],"task":"翻你的收藏夹，挑出 5 条真正改变过你做法的，每条用一句话写下触点。","taskHint":"其他的不用删，先别管。10 分钟。","ep":"第 42 集"},"wn05":{"id":"wn05","title":"笔记记了，却从来不看","courseLabel":"外脑系统训练营 · 05 加工的逻辑","scenes":[{"place":"周五","who":"旁白","line":"燕美的收集箱里已经有一百多条笔记。"},{"place":"21:00","who":"燕美（心里）","line":"记是记了，可它们还是一堆零散的句子。"},{"place":"21:10","who":"旁白","line":"她想找“上次银行说的贷后要求”，翻了半天才找到一句没头没尾的话。"},{"place":"21:20","who":"燕美","line":"信息记下来，还不等于变成了知识。"}],"cliff":"信息记下来了，怎么加工成真正能用的知识？","teacher":["信息要经过加工才变成知识：数据 → 信息 → 知识 → 智慧，这叫 DIKW 模型。","推荐卢曼卡片笔记法：一张卡片只写一个知识点，用自己的话写清楚。","按价值分级加工：重要的精加工，一般的粗加工，不重要的不加工。","经验类内容可以用 ORID 记录：事实（Objective）、感受（Reflective）、理解（Interpretive）、行动（Decisional）。"],"source":"外脑系统训练营 · 05 加工的逻辑（按课程要点改写）","after":[{"place":"21:30","who":"燕美","line":"把“贷后要求”写成一张卡片：哪家银行、要哪些资料、截止时间、怎么准备。"},{"place":"21:50","who":"旁白","line":"她又用 ORID 记了这次被催资料的经历，最后一行写：下次收到要求当天就建卡。"}],"quiz":[{"q":"DIKW 模型的顺序是？","options":["知识 → 信息 → 数据 → 智慧","数据 → 信息 → 知识 → 智慧","信息 → 数据 → 智慧 → 知识","智慧 → 知识 → 信息 → 数据"],"answer":1,"why":"信息经过加工才成为知识。"},{"q":"卢曼卡片笔记法的核心原则是？","options":["一张卡片越多越好","只记原文","一张卡片一个知识点","不写出处"],"answer":2,"why":"一卡一点，方便组合和调用。"},{"q":"ORID 里的 D 指的是？","options":["数据","讨论","描述","决定 / 行动"],"answer":3,"why":"Decisional：下一步怎么做。"}],"task":"从收集箱里挑 3 条最重要的，各写成一张“一卡一点”的卡片；再用 ORID 记一次最近的工作经历。","taskHint":"ORID：事实、感受、理解、行动，各写一句。10 分钟。","ep":"第 43 集"},"wn06":{"id":"wn06","title":"卡片很多，怎么串起来","courseLabel":"外脑系统训练营 · 06 体系化管理的逻辑","scenes":[{"place":"两周后","who":"旁白","line":"燕美攒了五十张卡片：对账、贷款、发票、RPA……"},{"place":"21:00","who":"燕美（心里）","line":"每张都清楚，可它们之间是什么关系？"},{"place":"21:10","who":"旁白","line":"她想写一份“多账户流水管理手册”，却不知道从哪张卡开始。"},{"place":"21:20","who":"燕美","line":"卡片要能拼成东西才有用。"}],"cliff":"卡片攒多了，怎么整合成一套体系？","teacher":["以主题为导向：围绕一个你关心的主题，把相关卡片拉到一起。","以整合为手段：把卡片按逻辑排好，补上缺的部分，删掉重复的。","以流动为准则：卡片可以在不同主题间流动、复用，不必只属于一个地方。","以产品为结果：最后要产出一个东西，比如一份手册、一篇文章、一套流程。"],"source":"外脑系统训练营 · 06 体系化管理的逻辑（按课程要点改写）","after":[{"place":"21:30","who":"燕美","line":"主题：多账户流水管理。卡片按“导出 → 核对 → 归档”排。"},{"place":"22:00","who":"旁白","line":"她拼出了一份两页的手册初稿，还发现缺了“异常处理”这一块。"}],"quiz":[{"q":"体系化管理的最终结果应该是？","options":["卡片越来越多","整理得很漂亮","产出一个产品，比如手册或流程","不再用卡片"],"answer":2,"why":"以产品为结果。"},{"q":"卡片可以在不同主题间复用，这是哪一条？","options":["以主题为导向","以整合为手段","以产品为结果","以流动为准则"],"answer":3,"why":"以流动为准则。"}],"task":"选一个主题，从你的笔记里拉出 5 张相关卡片，按逻辑排好，写成一页小手册的目录。","taskHint":"目录里缺的部分标“待补”。10 分钟。","ep":"第 44 集"},"wn07":{"id":"wn07","title":"素材这么零碎，不好分类","courseLabel":"外脑系统训练营 · 07 非体系管理的逻辑","scenes":[{"place":"周日","who":"旁白","line":"燕美收集了很多零散的东西：好的话术、别人的案例、一张漂亮的报表样式。"},{"place":"15:00","who":"燕美（心里）","line":"这些放进哪个体系都不合适。"},{"place":"15:10","who":"旁白","line":"她纠结了半天，最后全丢在了收集箱里。"},{"place":"15:20","who":"燕美","line":"是不是所有东西都要分类？"}],"cliff":"不属于任何体系的零碎素材，怎么管？","teacher":["素材库（表达素材、案例、模板）不用强行分类。","粗分类就够：比如“话术”“案例”“模板”三个大类。","再加标签和双链，让它们在需要时被找到、自然聚到一起。","非体系的内容，重点是“找得到”，而不是“放得对”。"],"source":"外脑系统训练营 · 07 非体系管理的逻辑（按课程要点改写）","after":[{"place":"15:30","who":"燕美","line":"建一个“素材库”，只分话术、案例、模板，每条加两个标签。"},{"place":"15:50","who":"旁白","line":"她把催款话术打上了“#话术 #回款”的标签。"}],"quiz":[{"q":"素材库的管理原则是？","options":["必须精细分类","全部删掉","放进体系","粗分类 + 标签 + 双链，让它自然归纳"],"answer":3,"why":"非体系内容，粗分加标签即可。"},{"q":"管理零碎素材，最重要的是？","options":["找得到","放得对","分得细","记得多"],"answer":0,"why":"重点是需要时能找到。"}],"task":"建一个素材库，分 2–3 个粗类，放进 5 条零碎素材，每条加 1–2 个标签。","taskHint":"10 分钟。","ep":"第 45 集"},"wn08":{"id":"wn08","title":"明明存过，就是搜不到","courseLabel":"外脑系统训练营 · 08 索引之搜索系统","scenes":[{"place":"周一","who":"银行客户经理","line":"燕美姐，去年那份授信的补充说明，再发我一份？"},{"place":"10:00","who":"旁白","line":"燕美在电脑里搜“授信”，出来几十个文件：新建文档(3).docx、说明最终版.docx、说明最终版改.docx……"},{"place":"10:20","who":"燕美（心里）","line":"哪个才是？"},{"place":"10:40","who":"燕美","line":"每次都在找文件上浪费时间。"}],"cliff":"文件都存了，为什么搜不出来？","teacher":["搜索好不好用，取决于命名规范。名字乱，搜索再强也没用。","用命名万能公式，把关键信息写进名字：比如“类别_对象_内容_日期_版本”。","目标是：不打开文件，看名字就知道里面是什么。","统一用同一套规则，坚持下去，越往后越省时间。"],"source":"外脑系统训练营 · 08 索引之搜索系统（按课程要点改写）","after":[{"place":"10:50","who":"燕美","line":"以后按“银行_业务_内容_日期”命名，比如“建行_授信_补充说明_20261024”。"},{"place":"11:10","who":"旁白","line":"她先把最近常用的十个文件按新规则改了名。"}],"quiz":[{"q":"搜索好不好用，主要取决于？","options":["命名规范","电脑速度","硬盘大小","软件价格"],"answer":0,"why":"名字规范，搜索才有效。"},{"q":"好的命名，应该做到？","options":["越短越好","不打开文件就知道里面是什么","全用数字","全用拼音"],"answer":1,"why":"看名字就知道内容。"}],"task":"定一个你自己的命名公式，并把最近常用的 5 个文件按它改名。","taskHint":"例：银行_业务_内容_日期。10 分钟。","ep":"第 46 集"},"wn09":{"id":"wn09","title":"一个文件，到底放哪个文件夹","courseLabel":"外脑系统训练营 · 09 索引之标签系统","scenes":[{"place":"周二","who":"旁白","line":"一份“工行贷款合同扫描件”：放“工行”，还是放“贷款”，还是放“合同”？"},{"place":"10:00","who":"燕美（心里）","line":"放哪都对，放哪都会忘。"},{"place":"10:10","who":"旁白","line":"她复制了三份，分别放进三个文件夹。"},{"place":"一个月后","who":"旁白","line":"三份里有一份被改过，另外两份还是旧的。"}],"cliff":"一个东西属于多个分类时，怎么管？","teacher":["标签能补上两个短板：搜索只认关键词，文件夹只能放一个地方。","常用六类标签：主题、类别、状态、项目、任务、兴趣，另外可以加一个来源标签。","给每类标签统一前缀，比如“#主题/贷款”“#状态/待处理”，看到就知道是哪一类。","文件只放一个地方，其他归属用标签表示。"],"source":"外脑系统训练营 · 09 索引之标签系统（按课程要点改写）","after":[{"place":"10:30","who":"燕美","line":"合同放“工行”文件夹，加标签“#主题/贷款 #类别/合同”。"},{"place":"10:40","who":"旁白","line":"她删掉了两份副本，只留一份。"}],"quiz":[{"q":"标签主要解决什么问题？","options":["文件太大","文件只能放一处、搜索只认关键词","电脑太慢","没有网络"],"answer":1,"why":"标签补上文件夹和搜索的短板。"},{"q":"给标签加统一前缀，好处是？","options":["更好看","更长","一眼就知道属于哪一类标签","更难记"],"answer":2,"why":"前缀让标签分类清楚。"}],"task":"定下你最常用的 3 类标签（加前缀），给 5 条笔记或文件打上。","taskHint":"例：#主题/、#状态/、#项目/。10 分钟。","ep":"第 47 集"},"wn10":{"id":"wn10","title":"双链连了一大片，反而更乱","courseLabel":"外脑系统训练营 · 10 索引之双链系统","scenes":[{"place":"周三","who":"旁白","line":"燕美学会了双向链接，开始到处链：对账链到 RPA，RPA 链到学习，学习链到复盘……"},{"place":"21:00","who":"旁白","line":"关系图上一大团线，密密麻麻。"},{"place":"21:10","who":"燕美（心里）","line":"连得这么多，怎么反而看不清了？"},{"place":"21:20","who":"燕美","line":"链接是不是越多越好？"}],"cliff":"双链很强大，为什么用多了反而乱？","teacher":["双向链接和块引用很适合两件事：关联不同的知识点、随手复习。","但引用关系不等于逻辑关系：A 提到了 B，不代表 A 和 B 在体系里是上下级。","体系的主干仍然是树状结构，双链是在树之间搭桥。","链接要有理由：只在真正有关联、以后会顺着它去看的时候才链。"],"source":"外脑系统训练营 · 10 索引之双链系统（按课程要点改写）","after":[{"place":"21:30","who":"燕美","line":"树状目录是骨架，双链只是桥。"},{"place":"21:40","who":"旁白","line":"她删掉了一些“为了链而链”的链接，只留下真正会点开的。"}],"quiz":[{"q":"双链最适合用来？","options":["代替所有文件夹","越多越好","装饰关系图","关联知识点、随手复习"],"answer":3,"why":"双链用于关联和复习。"},{"q":"体系的主干应该是？","options":["树状结构","双链网","随机","标签"],"answer":0,"why":"树状是主干，双链是桥。"}],"task":"检查你最近的 5 条链接，删掉没有实际用处的，给剩下的每条写一句“为什么链”。","taskHint":"如果还没用过双链，就试着给两张真正相关的卡片连一次。10 分钟。","ep":"第 48 集"},"wn11":{"id":"wn11","title":"每天都要翻好几层才找到","courseLabel":"外脑系统训练营 · 11 索引之中控系统","scenes":[{"place":"每天早上","who":"旁白","line":"燕美要打开：账户清单、本周计划、复盘表、待付款清单。"},{"place":"8:50","who":"旁白","line":"每个都要点三四层文件夹才能找到。"},{"place":"9:00","who":"燕美（心里）","line":"光打开文件就要五分钟。"},{"place":"9:05","who":"燕美","line":"能不能把常用的放在一页里？"}],"cliff":"常用的内容分散在各处，怎么一打开就能用？","teacher":["中控台就是把常用内容聚到一页，少翻层级。","四种用法：常用工作台（每天要用的入口）、标签导航（按标签快速跳转）、主题汇总（一个主题的相关内容）、知识库导航（整个外脑的地图）。","先做一个最简单的“今日工作台”，放 5–8 个你每天都要点的链接。","中控台要常更新，用不上的就移走。"],"source":"外脑系统训练营 · 11 索引之中控系统（按课程要点改写）","after":[{"place":"9:10","who":"燕美","line":"建一页“今日工作台”：账户清单、周计划、复盘表、待付款、RPA 项目。"},{"place":"9:20","who":"旁白","line":"第二天早上，她点一下就打开了全部要用的东西。"}],"quiz":[{"q":"中控台的主要作用是？","options":["把常用内容聚到一页，少翻层级","存所有文件","代替搜索","装饰首页"],"answer":0,"why":"一页聚合常用入口。"},{"q":"下面哪一项不是中控台的四种用法？","options":["常用工作台","自动记账","标签导航","主题汇总"],"answer":1,"why":"四种：工作台、标签导航、主题汇总、知识库导航。"}],"task":"建一页“今日工作台”，放 5 个你每天都要打开的链接或文件。","taskHint":"10 分钟。","ep":"第 49 集"},"wn12":{"id":"wn12","title":"外脑建好了，三个月后又乱了","courseLabel":"外脑系统训练营 · 12 迭代的逻辑","scenes":[{"place":"三个月后","who":"旁白","line":"燕美的收集箱里堆了三百条没处理的东西。"},{"place":"21:00","who":"燕美（心里）","line":"刚建的时候多整齐啊……"},{"place":"21:10","who":"旁白","line":"有些笔记早就过时了，有些重复了，还有些她完全忘了写过。"},{"place":"21:20","who":"燕美","line":"外脑也需要维护。"}],"cliff":"外脑会自己变乱，怎么维护？","teacher":["外脑维护有四件事：清理、更新、回顾、挪移。","清理：每周清空一次收集箱，该归档的归档，该删的删。","更新：给笔记增加新内容，删掉过时的。","回顾：专题式回顾一个主题，或者随机漫步看看老笔记；按重要和紧急程度定回顾频率。挪移：把以前散在别处的历史资料，慢慢挪进外脑。"],"source":"外脑系统训练营 · 12 迭代的逻辑（按课程要点改写）","after":[{"place":"21:30","who":"燕美","line":"每周日晚上 20:00，清空收集箱，顺便做周计划。"},{"place":"21:40","who":"旁白","line":"她在日历上设了一个每周重复的提醒：“外脑大扫除 15 分钟”。"}],"quiz":[{"q":"收集箱多久清空一次比较合适？","options":["每年","每周","从不","有空再说"],"answer":1,"why":"每周清空，防止堆积。"},{"q":"下面哪个不是外脑维护的四件事？","options":["清理","更新","重装软件","回顾"],"answer":2,"why":"清理、更新、回顾、挪移。"}],"task":"在日历上设一个每周重复的“外脑大扫除”提醒，今天先清理收集箱里的 10 条。","taskHint":"10 分钟。","ep":"第 50 集"},"wn13":{"id":"wn13","title":"把人生项目也装进外脑","courseLabel":"外脑系统训练营 · 13 项目管理的逻辑","scenes":[{"place":"周日","who":"旁白","line":"燕美的外脑里有工作、学习、生活，可她的几个大目标散落在各处。"},{"place":"15:00","who":"燕美（心里）","line":"RPA 项目在一个地方，健身计划在另一个地方，读书清单又在手机里。"},{"place":"15:10","who":"旁白","line":"她不知道这一年的几个项目到底进展如何。"},{"place":"15:20","who":"燕美","line":"要是能在外脑里一眼看到就好了。"}],"cliff":"怎么用外脑管人生里的项目？","teacher":["用外脑管人生项目：以年为单位做规划。","每个项目一页：目标、关键结果、时间节点、进度。","用五维度（年、季、月、周、日）统筹，把项目的节点排进不同的时间层。","最后执行：每周看一次项目页，更新进度。"],"source":"外脑系统训练营 · 13 项目管理的逻辑（按课程要点改写）","after":[{"place":"15:30","who":"燕美","line":"建一个“2026 项目”页：RPA 自动导出、每天复盘、每周运动三次。"},{"place":"15:50","who":"旁白","line":"每个项目下面写了目标和这个季度的节点。"}],"quiz":[{"q":"用外脑管人生项目，规划的基本单位是？","options":["天","小时","年","十年"],"answer":2,"why":"以年为单位规划。"},{"q":"项目规划之后用什么方法统筹？","options":["番茄钟","四象限","随机","五维度（年季月周日）"],"answer":3,"why":"五维度统筹法。"}],"task":"在外脑里建一个“年度项目”页，写下你今年的 2–3 个项目，每个写一句目标和下一个节点。","taskHint":"10 分钟。","ep":"第 51 集"},"wn14":{"id":"wn14","title":"电脑桌面上全是文件","courseLabel":"外脑系统训练营 · 14 文件管理的逻辑","scenes":[{"place":"周一 9:00","who":"旁白","line":"燕美的电脑桌面上有一百多个图标：回单截图、新建 Excel、下载的流水。"},{"place":"9:10","who":"燕美（心里）","line":"我知道那个文件就在桌面上，可就是找不到。"},{"place":"9:20","who":"旁白","line":"她又把桌面的文件按名字排了一遍，还是找不到。"},{"place":"9:30","who":"燕美","line":"本地文件也得管起来。"}],"cliff":"电脑里的文件越存越多，怎么才能好存好找？","teacher":["本地文件管理只要解决两件事：存和找。","粗分类架构：几个大文件夹就够，比如“工作”“个人”“归档”。","桌面当中控台：只放正在用的几样东西，用完就归位。","标准化命名：项目名_版本_日期。照片、视频这类媒体文件，按要素命名，比如“时间_地点_事件”。"],"source":"外脑系统训练营 · 14 文件管理的逻辑（按课程要点改写）","after":[{"place":"9:40","who":"燕美","line":"桌面只留三个：今天要处理、本周项目、收件。"},{"place":"10:00","who":"旁白","line":"她把其他文件全拖进“待整理”，下班前花十五分钟按新命名规则归位。"}],"quiz":[{"q":"本地文件管理要解决的两件事是？","options":["删和改","复制和粘贴","上传和下载","存和找"],"answer":3,"why":"存得进、找得到。"},{"q":"电脑桌面最好的用法是？","options":["当中控台，只放正在用的","放所有文件","放壁纸","什么都不放"],"answer":0,"why":"桌面只放正在处理的东西。"}],"task":"把桌面整理到只剩 5 个以内的图标，其他的放进一个“待整理”文件夹。","taskHint":"10 分钟。","ep":"第 52 集"},"wn15":{"id":"wn15","title":"家里的琐事，也乱成一团","courseLabel":"外脑系统训练营 · 15 信息管理的逻辑","scenes":[{"place":"周六","who":"旁白","line":"孩子的疫苗本、家里的保险单、车险到期日、宽带账号……燕美全靠脑子记。"},{"place":"10:00","who":"燕美（心里）","line":"车险是哪天到期来着？"},{"place":"10:10","who":"旁白","line":"她翻了一上午抽屉，最后在旧手机的短信里找到。"},{"place":"10:20","who":"燕美","line":"生活信息也值得管起来。"}],"cliff":"生活里的琐碎信息，怎么管才不费劲？","teacher":["生活琐碎信息也有价值，丢了要花很多时间找。","能自动记的就自动记：比如账单自动导入、日历自动提醒。","集中记录：所有生活信息放在一个地方，不要散落。","静态信息（账号、证件）放粗分类文件夹加标签；动态信息（到期日、续费）用表格当中控台。循序渐进，别一下子贪多。"],"source":"外脑系统训练营 · 15 信息管理的逻辑（按课程要点改写）","after":[{"place":"10:30","who":"燕美","line":"先建一张“家庭到期表”：车险、保险、宽带、证件，每样写到期日。"},{"place":"10:50","who":"旁白","line":"她给车险到期日设了提前一个月的日历提醒。"}],"quiz":[{"q":"生活信息管理的原则，不包括？","options":["一次全部整理完","能自动记就自动记","集中记录","循序渐进"],"answer":0,"why":"循序渐进，别贪多。"},{"q":"到期日、续费这类动态信息，适合用？","options":["纸条","表格中控台","记在脑子里","不管"],"answer":1,"why":"动态信息用表格中控台。"}],"task":"建一张“家庭到期表”，写下 3 项有到期日的事，并给最近的一项设日历提醒。","taskHint":"10 分钟。","ep":"第 53 集"},"wn16":{"id":"wn16","title":"把外脑串成一套","courseLabel":"外脑系统训练营 · 16 外脑的大一统","scenes":[{"place":"周日","who":"旁白","line":"燕美学完外脑课程：收集箱、卡片、标签、双链、中控台、命名……"},{"place":"15:00","who":"燕美（心里）","line":"东西太多，怕学完又散了。"},{"place":"15:10","who":"旁白","line":"她还担心：笔记都在电脑里，哪天电脑坏了怎么办？"},{"place":"15:20","who":"燕美","line":"我需要一张总图，还有一个备份方案。"}],"cliff":"外脑的方法这么多，怎么串成一套、并保证数据安全？","teacher":["把外脑方法论串成一个流程：输入（收集箱）→ 加工（卡片）→ 管理（体系 + 素材库）→ 索引（搜索、标签、双链、中控）→ 迭代（清理、回顾）。","本地部署要解决同步和备份。3-2-1 备份法则：至少 3 份数据，存在 2 种介质上，其中 1 份放在异地或云端。","方法只有用起来才有效：不用追求完美，每周用一次、维护一次。"],"source":"外脑系统训练营 · 16 外脑的大一统（按课程要点改写）","after":[{"place":"15:40","who":"燕美","line":"笔记一份在电脑，一份在移动硬盘，一份在云盘。这就是 3-2-1。"},{"place":"15:50","who":"旁白","line":"她画了一张外脑总流程图，贴在笔记首页。"}],"quiz":[{"q":"3-2-1 备份法则指的是？","options":["3 个软件、2 台电脑、1 个账号","3 份数据、2 种介质、1 份异地","每 3 天备份 2 次","3 个文件夹"],"answer":1,"why":"3 份、2 种介质、1 份异地。"},{"q":"外脑流程的顺序是？","options":["加工 → 输入 → 迭代 → 管理","索引 → 输入 → 加工","输入 → 加工 → 管理 → 索引 → 迭代","迭代 → 索引 → 管理"],"answer":2,"why":"从输入到迭代，形成闭环。"}],"task":"检查你的外脑备份：写下现在有几份、在哪里，按 3-2-1 补上缺的那一份。","taskHint":"10 分钟。","ep":"第 54 集"},"zy01":{"id":"zy01","title":"干了十年出纳，下一步去哪","courseLabel":"职业规划系统 · 01 职业规划的理念","scenes":[{"place":"周日 · 家里","who":"旁白","line":"同学聚会上，有人当了财务经理，有人转行做了自媒体。"},{"place":"21:00","who":"燕美（心里）","line":"我在厂里十年，从出纳做到管全部账户。可以后呢？"},{"place":"21:10","who":"旁白","line":"她想不出答案，只觉得迷茫。"},{"place":"21:20","who":"燕美","line":"是我不够努力，还是一开始就没想过？"}],"cliff":"职场上的迷茫，到底从哪里来？","teacher":["很多人迷茫，源于一路按标准化的教育走过来：学校按年龄、按科目统一教，很少有人教你认识自己、选择职业。这套模式来自普鲁士式教育。","所以迷茫不全是你的错，而是没人教过你做职业规划。","职业规划三级火箭：探索期（找方向）→ 深耕期（在一个领域长期积累）→ 发展期（突破瓶颈、布局第二曲线）。","每个人的路径不同，每一阶段都不简单，但有了地图就不会乱走。"],"source":"职业规划系统 · 01 职业规划的理念（按课程要点改写）","after":[{"place":"21:30","who":"燕美","line":"我十年都在同一个领域，应该是在深耕期。下一步要想的是发展期。"},{"place":"21:40","who":"旁白","line":"她在本子上画了三级火箭，在“深耕期”那一格画了个点。"}],"quiz":[{"q":"职业规划三级火箭的顺序是？","options":["发展期 → 探索期 → 深耕期","探索期 → 深耕期 → 发展期","深耕期 → 探索期 → 发展期","入门期 → 熟练期 → 退休期"],"answer":1,"why":"先探索、再深耕、后发展。"},{"q":"按这一课，很多人职业迷茫的一个重要原因是？","options":["自己太笨","运气不好","标准化教育很少教人认识自己、规划职业","工作太累"],"answer":2,"why":"迷茫很大程度上来自教育体制，没人教过如何规划。"}],"task":"画出三级火箭，标出你现在处在哪个阶段，并写一句这个阶段你最需要解决的问题。","taskHint":"10 分钟。","ep":"第 55 集"},"zy02":{"id":"zy02","title":"刚入职的表妹问我怎么选","courseLabel":"职业规划系统 · 02 探索期的逻辑","scenes":[{"place":"周六","who":"旁白","line":"表妹刚毕业，找燕美聊：做会计、做银行还是考公？"},{"place":"15:00","who":"表妹","line":"我什么都想试，又怕选错，浪费时间。"},{"place":"15:10","who":"燕美（心里）","line":"我当年什么都没想，就进厂了。"},{"place":"15:20","who":"燕美","line":"这个阶段，到底该怎么探索？"}],"cliff":"刚进职场、什么都不确定时，该怎么选？","teacher":["探索期一般是进职场的头三年，要解决两件事：先生存下来，再找到方向。","知己：了解自己的性格、兴趣、能力和价值观，可以借助一些自我评估工具。","知彼：了解行业、公司、岗位的实际情况，多问一线的人。","在自己想做的、能做的、市场需要的三者之间，找一个动态平衡点。探索期允许试错，但每次试都要有复盘。"],"source":"职业规划系统 · 02 探索期的逻辑（按课程要点改写）","after":[{"place":"15:40","who":"燕美","line":"你先列三样：你喜欢什么、你擅长什么、哪些岗位需要人。"},{"place":"15:50","who":"旁白","line":"表妹写满了一张纸。燕美在旁边也写了一张，给现在的自己。"}],"quiz":[{"q":"探索期主要要解决的两件事是？","options":["买房和结婚","升职和加薪","生存和找方向","考证和读研"],"answer":2,"why":"先活下来，再找方向。"},{"q":"“知彼”指的是？","options":["了解自己","了解领导喜好","了解同事八卦","了解行业、公司、岗位的实际情况"],"answer":3,"why":"知彼是了解外部的职业环境。"}],"task":"写三栏：我喜欢的、我擅长的、市场需要的，各写 3 条，圈出三栏都有的交集。","taskHint":"10 分钟。","ep":"第 56 集"},"zy03":{"id":"zy03","title":"深耕，到底在耕什么","courseLabel":"职业规划系统 · 03 深耕期的逻辑","scenes":[{"place":"周一","who":"旁白","line":"燕美在厂里十年，账户、银行、贷款都门儿清。"},{"place":"10:00","who":"燕美（心里）","line":"可如果离开这家厂，这些经验还值钱吗？"},{"place":"10:20","who":"旁白","line":"她想到：很多经验只属于“这家厂”，换个地方就用不上。"},{"place":"10:30","who":"燕美","line":"我要深耕的，应该是能带走的东西。"}],"cliff":"在一个岗位干久了，怎么确保积累的是真本事？","teacher":["深耕期是按性格、兴趣、价值观选定领域，然后长期积累。","要深耕三样：经验专业（行业硬技能）、资源人脉（银行、同行、供应商的关系）、可迁移能力（沟通、分析、项目管理，换地方也能用）。","选领域前也要分析：行业前景、公司前景、岗位的发展路径和局限。","在岗的人就在岗位上深耕：把手上的事做到专业，主动承担，积累能带走的能力。"],"source":"职业规划系统 · 03 深耕期的逻辑（按课程要点改写）","after":[{"place":"10:40","who":"燕美","line":"多账户流水自动化，就是能带走的能力。银行的人脉，也是。"},{"place":"10:50","who":"旁白","line":"她在笔记里列了三栏：专业、人脉、可迁移能力，各写了两条要加强的。"}],"quiz":[{"q":"深耕期要积累的三样东西是？","options":["学历、证书、职称","房子、车子、存款","加班、熬夜、忍耐","经验专业、资源人脉、可迁移能力"],"answer":3,"why":"三者都要积累，尤其是可迁移能力。"},{"q":"下面哪一项属于可迁移能力？","options":["项目管理和沟通能力","熟悉本厂某个老板的脾气","知道厂里的打印机在哪","会用某个只有本厂才有的系统"],"answer":0,"why":"换了地方也能用的能力，才是可迁移能力。"}],"task":"列三栏：专业、人脉、可迁移能力，每栏写 1 项你已经有的、1 项要加强的。","taskHint":"10 分钟。","ep":"第 57 集"},"zy04":{"id":"zy04","title":"主业到头了吗","courseLabel":"职业规划系统 · 04 发展期的逻辑","scenes":[{"place":"年底","who":"旁白","line":"燕美的工资三年没怎么涨了，上面也没有更高的职位。"},{"place":"21:00","who":"燕美（心里）","line":"再这样干十年，会不会变成“中年油腻”？"},{"place":"21:10","who":"旁白","line":"她看到有人做副业、有人学投资，心里有点慌。"},{"place":"21:20","who":"燕美","line":"我是不是也该做点什么？"}],"cliff":"主业遇到瓶颈，下一步怎么布局？","teacher":["发展期的关键：主业到瓶颈之前，就要开始布局第二曲线。等到危机出现才动，就晚了。","收入有四根支柱：主业收入、副业收入、投资收入、资产收入（健康、认知、影响力这些也是资产）。","主业可以纵向发展（升职）或横向发展（叠加新能力，比如财务 + 自动化）。","副业可以从主业延伸（分享专业经验），也可以从兴趣出发；投资要先学基础常识，避开陷阱。"],"source":"职业规划系统 · 04 发展期的逻辑（按课程要点改写）","after":[{"place":"21:30","who":"燕美","line":"我先走横向：财务 + 自动化。将来也可以分享给同行。"},{"place":"21:40","who":"旁白","line":"她在本子上画了四根柱子，在“主业”和“资产·认知”上画了星。"}],"quiz":[{"q":"收入的四根支柱是？","options":["主业、副业、投资、资产","工资、奖金、补贴、福利","房租、利息、股票、基金","现金、存款、理财、保险"],"answer":0,"why":"主业、副业、投资、资产（健康、认知、影响力等）。"},{"q":"“财务 + 自动化”属于主业的哪种发展方式？","options":["纵向发展","横向发展：叠加新能力","副业","投资"],"answer":1,"why":"横向叠加能力，形成稀缺组合。"},{"q":"布局第二曲线的时机应该是？","options":["被裁员之后","退休以后","主业到瓶颈之前","等别人都做了再说"],"answer":2,"why":"提前布局，避免被动。"}],"task":"画出收入四根柱子，写下你现在最强和最弱的一根，以及这个月给最弱那根做的一件小事。","taskHint":"小事例：读一本投资入门书的第一章。10 分钟。","ep":"第 58 集"},"zy05":{"id":"zy05","title":"规划都做好了，就怕坚持不下去","courseLabel":"职业规划系统 · 05 执行的注意事项","scenes":[{"place":"一个月后","who":"旁白","line":"燕美的职业规划写得清清楚楚，可每天还是被琐事淹没。"},{"place":"21:00","who":"燕美（心里）","line":"我这个年纪、这个学历，真的能改变吗？"},{"place":"21:10","who":"旁白","line":"厂里的杂事也总找上她：别人不想做的，都推给她。"},{"place":"21:20","who":"燕美","line":"方法、心态、时间，好像哪样都卡着。"}],"cliff":"规划落地时，会遇到哪些障碍？怎么过？","teacher":["执行会遇到三类障碍：方法、心态、时间。","方法：循序渐进，先打基础，别一上来就追高难度。","心态：成长反馈慢，要有成长型思维——能力是可以通过努力提升的，不是天生固定的。再打造一套精神助推系统：榜样、陪伴、鼓励自己的环境。","时间：提高时间精力效率；主动避开不必要的麻烦事，别什么活都揽到自己身上。"],"source":"职业规划系统 · 05 执行的注意事项（按课程要点改写）","after":[{"place":"21:30","who":"燕美","line":"“这个年纪改变不了”是固定型思维。我可以换一句：我还在学。"},{"place":"21:40","who":"旁白","line":"她在便利贴上写下：“不是我的活，先问清楚再接。”"}],"quiz":[{"q":"执行职业规划的三类障碍是？","options":["钱、人、关系","方法、心态、时间","学历、年龄、性别","运气、天赋、背景"],"answer":1,"why":"方法、心态、时间三类。"},{"q":"“能力可以通过努力提升”是哪种思维？","options":["固定型思维","线性思维","成长型思维","逆向思维"],"answer":2,"why":"成长型思维，德韦克提出。"},{"q":"别人推给你的不必要的杂事，课程建议？","options":["全部接下","生闷气","辞职","主动避开不必要的麻烦事"],"answer":3,"why":"把时间留给真正重要的事。"}],"task":"写下你最近一次“我不行”的想法，改写成一句成长型思维的话；再列一件可以推掉或先问清楚的杂事。","taskHint":"10 分钟。","ep":"第 59 集"},"zt-lj1":{"id":"zt-lj1","title":"两个业务员，一个说了假话","courseLabel":"思维专题课 · 逻辑 01 认识逻辑思维","scenes":[{"place":"周一 · 财务室","who":"旁白","line":"一笔货款对不上。业务员甲说：“乙收了现金没交。”业务员乙说：“甲在说谎。”"},{"place":"9:20","who":"燕美（心里）","line":"两个人各说各的，我该信谁？"},{"place":"9:30","who":"旁白","line":"她想起一个老谜题：岛上有诚实的人和说谎的人，问一个问题就要找到宝藏。"},{"place":"9:40","who":"燕美","line":"这种题，好像靠的不是感觉，是推理。"}],"cliff":"听起来都有道理，怎么判断谁说的是真的？","teacher":["孤岛宝藏谜题的关键，是把每句话当成可以检验真假的命题，看它们能不能同时成立。","甲说“乙有问题”，乙说“甲说谎”。两句话互相指认，至少能推出：两人不可能同时说真话。再加上收款记录这类事实，就能判断。","逻辑是关于推理是否有效的规则；逻辑思维是用这些规则去想问题、表达、做判断的能力。","学逻辑思维的价值：少被话术带着走，判断更准，说话也更有说服力。"],"source":"思维专题课 · 逻辑 01 认识逻辑思维（按课程要点改写）","after":[{"place":"9:50","who":"燕美","line":"先不看谁说得更像真话，先查那天的收款记录。"},{"place":"10:10","who":"旁白","line":"记录显示乙那天没有现金收款。燕美在笔记里写：先把话拆成可以检验的命题。"}],"quiz":[{"q":"面对互相矛盾的说法，逻辑思维要求先做什么？","options":["相信关系更好的那个人","把说法拆成可以检验真假的命题","凭直觉选一个","两个都不信"],"answer":1,"why":"把话变成命题，才能判断能否同时成立、用事实检验。"},{"q":"甲说“乙有问题”，乙说“甲在说谎”。可以确定的是？","options":["两人都说真话","甲一定说谎","两人不可能同时说真话","乙一定说谎"],"answer":2,"why":"两句互相否定，不可能同时为真；具体谁真还要事实来定。"},{"q":"逻辑思维带来的好处，不包括？","options":["少被话术带偏","判断更准确","表达更有说服力","让对方一定服从"],"answer":3,"why":"逻辑能让表达更有说服力，但不保证别人服从。"}],"task":"找一句最近让你犹豫要不要信的话（同事、银行、客户说的），把它改写成一个可以检验真假的命题，并写出用什么事实来验证。","taskHint":"例：“这笔款下周一定到”→ 命题“对方已提交付款申请”；验证：要付款申请截图。10 分钟。","ep":"第 60 集"},"zt-lj2":{"id":"zt-lj2","title":"厂长说：“流水乱，是因为你不细心”","courseLabel":"思维专题课 · 逻辑 02 方法篇","scenes":[{"place":"周五 · 厂部","who":"厂长老张","line":"流水总对不上，说明你不够细心。"},{"place":"17:00 · 工位","who":"燕美（心里）","line":"好像也对……可我明明每笔都看了。"},{"place":"17:20","who":"旁白","line":"她越想越委屈，却说不出哪里不对。"},{"place":"17:30","who":"燕美","line":"我需要把这句话拆开来看。"}],"cliff":"一句话听着有道理，怎么拆开看它到底对不对？","teacher":["逻辑思维三步：明确概念、提取命题、逻辑推演。","明确概念：“流水乱”具体指什么？是金额对不上、账户记错，还是导出缺页？“细心”又指什么？","提取命题：把话变成“如果……那么……”的判断，比如“如果流水对不上，那么一定是人不细心”。","逻辑推演有三种：演绎（从一般规则推到具体情况）、归纳（从多个具体情况总结规律）、溯因（从结果反推最可能的原因）。"],"source":"思维专题课 · 逻辑 02 方法篇（按课程要点改写）","after":[{"place":"17:40","who":"燕美","line":"“流水对不上就是不细心”这个命题，前提不成立：银行导出本来就会漏单。"},{"place":"17:50","who":"旁白","line":"她列了上个月的 6 笔差错：4 笔是导出漏单，2 笔是人工录错。下周一带着数据去找厂长。"}],"quiz":[{"q":"逻辑思维的三个步骤是？","options":["收集、整理、分析","提问、假设、验证","明确概念、提取命题、逻辑推演","观察、记录、汇报"],"answer":2,"why":"先说清概念，再提出命题，最后推理。"},{"q":"从“这 6 笔差错里有 4 笔是导出漏单”得出“差错主要来自导出环节”，这是？","options":["演绎","溯因","类比","归纳"],"answer":3,"why":"从多个具体情况总结规律，是归纳。"},{"q":"看到“回单没到”，推测“最可能是银行系统延迟”，这是？","options":["溯因：从结果反推最可能的原因","演绎","归纳","猜测"],"answer":0,"why":"从结果反推最可能的解释，是溯因推理。"}],"task":"拿一句别人对你工作的评价，按三步拆：概念指什么、命题是什么、用哪种推理检验。","taskHint":"写成三行即可。重点是找出里面模糊的概念。10 分钟。","ep":"第 61 集"},"zt-lj3":{"id":"zt-lj3","title":"食堂承包商说生意不太好","courseLabel":"思维专题课 · 逻辑 03 运用篇","scenes":[{"place":"周二 · 厂部","who":"食堂承包商","line":"最近生意不太好，下个月的管理费能不能缓一缓？"},{"place":"10:00","who":"厂长老张","line":"燕美，你看看是真是假，该怎么处理。"},{"place":"10:10","who":"燕美（心里）","line":"“生意不太好”……这话能说明什么呢？"},{"place":"10:20","who":"旁白","line":"她想起老师讲的咖啡店案例：同样一句“生意不好”，要一步步拆开。"}],"cliff":"一句模糊的“生意不太好”，怎么一步步找到真相、定下对策？","teacher":["第一步明确概念：“生意不好”是指营业额下降、利润下降，还是来吃饭的人变少？跟哪个时期比？","第二步提取命题：例如“本月就餐人数比上月少两成”“客单价没变”。","第三步推理：演绎——如果工厂人数减少，就餐人数必然减少；归纳——连续几个月的就餐数据有什么规律；溯因——人数少了，最可能的原因是什么？列出几个备选。","找到真相后再定策略：是人员减少、菜品问题还是竞争，对策完全不同。"],"source":"思维专题课 · 逻辑 03 运用篇（按课程要点改写）","after":[{"place":"14:00","who":"燕美","line":"查了刷卡数据：就餐人数没少，是承包商自己把菜价降了。"},{"place":"14:10","who":"旁白","line":"她给厂长写了三行结论：概念、数据、推理。管理费按合同照收，可以帮对方看看菜单定价。"}],"quiz":[{"q":"听到“生意不太好”，第一步应该？","options":["马上同意缓缴","直接拒绝","去问别人的意见","明确“不好”具体指什么、和什么比"],"answer":3,"why":"概念不清，后面的推理都会跑偏。"},{"q":"“如果工厂人数减少，就餐人数必然减少”，这种推理属于？","options":["演绎","归纳","溯因","直觉"],"answer":0,"why":"从一般规则推出具体结论，是演绎。"},{"q":"用溯因推理找原因时，好的做法是？","options":["想到一个原因就下结论","列出几个可能的解释，再逐个用数据检验","相信对方的说法","选最好听的那个"],"answer":1,"why":"溯因要多列备选，再检验。"}],"task":"找一句工作中模糊的抱怨或请求，按“概念 → 命题 → 推理 → 对策”写四行分析。","taskHint":"例：银行说“资料不全”——概念：缺哪几份？命题……10 分钟。","ep":"第 62 集"},"zt-lj4":{"id":"zt-lj4","title":"三次都准时，就一定准时吗","courseLabel":"思维专题课 · 逻辑 04 注意事项","scenes":[{"place":"周四 · 财务室","who":"同事小林","line":"这家客户前三次都准时付款，这次肯定也没问题，先把货发了吧。"},{"place":"10:00","who":"燕美（心里）","line":"前三次准时……这次就一定准时？"},{"place":"10:10","who":"旁白","line":"她又想到上周厂长的推理：“所有银行都要这份证明，所以这家也要。”可那家银行明明没要。"},{"place":"10:20","who":"燕美","line":"推理看起来都对，怎么结论会错？"}],"cliff":"推理的步骤都对了，结论为什么还会错？","teacher":["演绎要看两点：前提是否可靠、结构是否有效。“所有银行都要这份证明”这个前提不可靠，结论就不可靠。","归纳要看样本：数量够不够、质量好不好，以及是不是真的因果关系。三次准时样本太少，也不能说明对方现在的资金状况。","溯因要多列几个解释，再逐一检验。只想到一个原因就下结论，最容易错。","所以推理之后，还要回头检查：前提、样本、备选解释。"],"source":"思维专题课 · 逻辑 04 注意事项（按课程要点改写）","after":[{"place":"10:30","who":"燕美","line":"三次准时是归纳，样本太少。发货前先问一句对方这批款的付款计划。"},{"place":"10:40","who":"旁白","line":"她在笔记里写：演绎看前提，归纳看样本，溯因看备选。"}],"quiz":[{"q":"演绎推理需要检查的两点是？","options":["前提可靠、结构有效","样本多、时间长","人多、证据多","速度快、成本低"],"answer":0,"why":"前提可靠 + 结构有效，结论才可靠。"},{"q":"“前三次准时，所以这次一定准时”，问题在于？","options":["演绎结构无效","归纳样本太少，也没考虑因果和变化","完全正确","溯因不够"],"answer":1,"why":"归纳要看样本数量、质量和因果。"},{"q":"溯因推理最常见的错误是？","options":["列了太多解释","收集了太多数据","只想到一个原因就下结论","检验太慢"],"answer":2,"why":"溯因要多列几个解释再检验。"}],"task":"回想你最近一次“想当然”的判断，写下它属于哪种推理，以及漏掉了哪一项检查（前提 / 样本 / 备选解释）。","taskHint":"写三行：判断、推理类型、漏掉的检查。10 分钟。","ep":"第 63 集"},"zt-xt1":{"id":"zt-xt1","title":"催款越催，回款越慢","courseLabel":"思维专题课 · 系统 01 认识系统思维","scenes":[{"place":"月初 · 财务室","who":"厂长老张","line":"回款太慢！燕美，以后每天给客户打电话催。"},{"place":"第 1 周","who":"旁白","line":"燕美每天打十几个电话。几家客户确实付了一点。"},{"place":"第 3 周","who":"旁白","line":"有两家老客户开始不接电话，业务员也来抱怨：“你们催得太凶，客户要换供应商了。”"},{"place":"月底","who":"燕美（心里）","line":"我更努力了，结果怎么反而更糟？"}],"cliff":"明明做的是对的事，为什么越用力越糟？","teacher":["老故事：为了消灭眼镜蛇，政府悬赏蛇皮，结果有人开始养蛇，取消悬赏后蛇反而更多了。这叫眼镜蛇效应。","原因是真实世界是非线性的：一个动作会引起一连串反应，有些还会绕回来影响你。","系统 = 要素 + 关联 + 目的 + 环境。只盯一个要素用力，忽略了它和别的要素怎么连着。","系统思维就是：环形地想（因果会绕回来），看结构而不只看事件，看长期而不只看眼前。"],"source":"思维专题课 · 系统 01 认识系统思维（按课程要点改写）","after":[{"place":"月底 18:00","who":"燕美","line":"催款、客户关系、业务员、订单，这几样是连着的。我只拧了一个螺丝。"},{"place":"18:10","who":"旁白","line":"她画了一张小图：催得越狠 → 客户越不爽 → 订单越少 → 回款越少。"}],"quiz":[{"q":"眼镜蛇效应说明了什么？","options":["悬赏一定有用","蛇很难抓","政府不该管事","简单直接的办法可能引发反效果"],"answer":3,"why":"非线性的世界里，直觉方案可能带来相反结果。"},{"q":"系统的四个组成部分是？","options":["要素、关联、目的、环境","人、财、物、事","输入、处理、输出、反馈","计划、执行、检查、行动"],"answer":0,"why":"系统 = 要素 + 关联 + 目的 + 环境。"},{"q":"下面哪种想法更接近系统思维？","options":["回款慢就多打电话","想想催款会怎么影响客户关系和以后的订单","换一个更凶的人去催","不管它"],"answer":1,"why":"环形思考，看动作的连锁影响。"}],"task":"选一件你最近“越用力越糟”的事，画一个简单的因果圈：A → B → C → 又影响 A。","taskHint":"三到四个方框加箭头就够，拍照存进收集箱。10 分钟。","ep":"第 64 集"},"zt-xt2":{"id":"zt-xt2","title":"六步拆开“月底加班”这个系统","courseLabel":"思维专题课 · 系统 02 如何掌握","scenes":[{"place":"周一 · 财务室","who":"旁白","line":"燕美决定用系统思维看看：为什么每个月底都要加班？"},{"place":"9:30","who":"燕美（心里）","line":"第一反应：人手不够，招个人就好了。"},{"place":"9:35","who":"燕美（心里）","line":"等等，这个答案太顺了。恐怕没那么简单。"},{"place":"10:00","who":"旁白","line":"她拿出一张白纸，准备一步步来。"}],"cliff":"系统思维到底怎么用？有没有能照着走的步骤？","teacher":["意识层先装一个开关：遇到很顺直觉的答案，先对自己说“恐怕没那么简单”。","方法层六步：一、定边界——只看“月底对账”这一块；二、找要素——账户数、导出方式、核对规则、人、时间。","三、理因果——谁影响谁；四、找反馈回路——哪些因果会绕成圈，越转越大或越转越稳。","五、找杠杆解——找那个动一下就能带动全局的点；六、出系统方案——围绕杠杆点设计整体方案，而不是到处补洞。"],"source":"思维专题课 · 系统 02 如何掌握（按课程要点改写）","after":[{"place":"11:00","who":"燕美","line":"回路找到了：月底才集中导流水 → 错误集中爆发 → 返工 → 更晚。"},{"place":"11:10","who":"旁白","line":"杠杆点不是招人，而是“每周五导一次流水”。她把它写进了周计划。"}],"quiz":[{"q":"遇到一个很顺直觉的答案时，系统思维要求先？","options":["想一想“恐怕没那么简单”","立刻执行","找人投票","放弃"],"answer":0,"why":"这是意识层的开关，防止掉进线性思维。"},{"q":"系统思维六步的第一步是？","options":["找要素","定边界","找杠杆解","出方案"],"answer":1,"why":"先定边界，确定分析哪一块。"},{"q":"“杠杆解”指的是？","options":["花钱最多的方案","最快见效的临时办法","动一下就能带动全局的关键点","上级指定的办法"],"answer":2,"why":"找到小投入、大影响的那个点。"}],"task":"用六步里的前四步分析一个工作难题：写出边界、3–5 个要素、因果关系、一个反馈回路。","taskHint":"例：边界“月底对账”；要素“账户数、导出频率、核对规则……”。10 分钟。","ep":"第 65 集"},"zt-xt3":{"id":"zt-xt3","title":"画了一整面墙的因果图","courseLabel":"思维专题课 · 系统 03 注意事项","scenes":[{"place":"周三","who":"旁白","line":"燕美爱上了画因果图。工资、税务、贷款、供应商……一张比一张大。"},{"place":"周五 · 厂部","who":"厂长老张","line":"你画这么多图，到底要我做什么决定？"},{"place":"周五 · 工位","who":"燕美（心里）","line":"我分析了好几天，可一件事也没改。"},{"place":"18:00","who":"旁白","line":"墙上的图越来越复杂，月底照样加班。"}],"cliff":"系统思维用到最后，为什么变成了“只分析不行动”？","teacher":["系统思维有四个局限：边界很难定、人有认知偏差、分析成本很高、从看懂到行动之间有阻力。","对策一：以终为始，从小系统开始。先选一个你能改的小范围，不要一上来就分析整个公司。","对策二：引入多元视角。找业务员、找银行、找厂长聊，弥补自己的盲区。","对策三：和线性思维互补。分析够用了就动手，在行动中修正，不必等图画完美。"],"source":"思维专题课 · 系统 03 注意事项（按课程要点改写）","after":[{"place":"18:10","who":"燕美","line":"先只改一个小系统：每周五导一次流水。别的图先收起来。"},{"place":"18:15","who":"旁白","line":"她把一面墙的图收进文件夹，只留下一张，贴在显示器旁。"}],"quiz":[{"q":"以下哪一项不是系统思维的局限？","options":["边界难定","能让人立刻行动","认知偏差","分析成本高"],"answer":1,"why":"从看懂到行动有阻力，恰恰是它的局限之一。"},{"q":"“以终为始，从小系统开始”是指？","options":["先分析整个公司","先画最大的图","先选一个能改的小范围，围绕目标动手","等所有人同意再做"],"answer":2,"why":"从小系统开始，降低分析成本，更容易行动。"},{"q":"系统思维和线性思维的关系，课程建议是？","options":["系统思维完全取代线性思维","线性思维更高级","只能二选一","两者互补并用"],"answer":3,"why":"互补：系统思维看全局，线性思维推动行动。"}],"task":"从你画过（或想过）的问题里，只挑一个能自己改的小系统，写下这周就做的一个动作。","taskHint":"小到“每周五 16:00 导一次某银行流水”都可以。10 分钟。","ep":"第 66 集"},"zt-dy0":{"id":"zt-dy0","title":"电梯太慢，又没钱换","courseLabel":"思维专题课 · 第一性 00 导言","scenes":[{"place":"周一 · 厂部开会","who":"厂长老张","line":"办公楼电梯太慢，员工天天抱怨。燕美，你算算换电梯要多少钱。"},{"place":"14:00","who":"旁白","line":"燕美问了三家，报价都要几十万。今年预算早就排满了。"},{"place":"15:00","who":"燕美（心里）","line":"换不起，那就修？加速？好像都要花钱……"},{"place":"16:00 · 走廊","who":"旁白","line":"等电梯的人一边看手机一边叹气：“又要等这么久。”"}],"cliff":"钱不够换电梯，这个问题是不是就无解了？","teacher":["经典的解法是：在电梯口装镜子、放些看的东西。抱怨很快变少了，电梯一点没变快。","因为问题本身不是“电梯慢”，而是“等的时候很难熬”。换了问题，答案就完全不同。","这就是第一性原理的味道：别在原方案上修修补补，先退回去问——我们到底要解决什么？","后面几课会讲具体做法：归零、解构、重构。"],"source":"思维专题课 · 第一性 00 导言（按课程要点改写）","after":[{"place":"16:30","who":"燕美","line":"我一直在算“怎么让电梯变快”，没问过“大家到底在烦什么”。"},{"place":"16:35","who":"旁白","line":"她在报告里加了一条：电梯口装镜子和公告屏，预算两千元。"}],"quiz":[{"q":"电梯口装镜子之后抱怨变少，说明真正的问题是？","options":["电梯速度太慢","等待的过程很难熬","员工太挑剔","预算不够"],"answer":1,"why":"真正的问题是等待体验，不是速度本身。"},{"q":"第一性原理最先要做的是？","options":["在原方案上继续优化","先找最贵的方案","回到问题本身，问到底要解决什么","照搬别人的做法"],"answer":2,"why":"别急着修补原方案，先回到问题的起点。"}],"task":"挑一个你一直觉得“没钱没资源办不了”的工作难题，写下：它表面的问题是什么，背后真正的问题可能是什么。","taskHint":"例：表面“没钱买自动对账系统”；背后“月底对账错了要返工，提心吊胆”。写两行就行，10 分钟。","ep":"第 67 集"},"zt-dy1":{"id":"zt-dy1","title":"为什么月底总在救火","courseLabel":"思维专题课 · 第一性 01 核心知识","scenes":[{"place":"月末 · 21:00","who":"旁白","line":"燕美又在加班对账。第三次发现同一类错误：一笔付款记到了错的账户。"},{"place":"21:10","who":"燕美（心里）","line":"下次我再仔细一点就好了。"},{"place":"下个月末","who":"旁白","line":"同样的错误又出现了。"},{"place":"21:30","who":"燕美","line":"“再仔细一点”根本没用。到底是哪里出了问题？"}],"cliff":"同样的错一犯再犯，“更仔细”为什么不管用？","teacher":["第一性原理按笛卡尔的思路走三步：归零、解构、重构。","归零：放下现成的经验和惯性解法，用 5 Why 一层层追问“为什么”，直到碰到最根本的原因。","解构：用公式思维把问题拆成要素，比如“错误数 = 笔数 × 每笔出错率”，看清卡点在哪个要素上。","重构：按要素之间的关系重新设计方案，而不是在老做法上贴补丁。"],"source":"思维专题课 · 第一性 01 核心知识（按课程要点改写）","after":[{"place":"21:40","who":"燕美","line":"为什么记错户？因为账户名太像。为什么太像？因为都是“XX 公司基本户”。为什么只靠肉眼分辨？因为没有编号……"},{"place":"21:50","who":"旁白","line":"她给三十个账户统一加了“银行简称 + 尾号”的编号，导出模板也按编号排。"}],"quiz":[{"q":"第一性原理的三步是？","options":["计划、执行、复盘","观察、假设、验证","归零、解构、重构","收集、整理、归档"],"answer":2,"why":"笛卡尔式的三步：归零、解构、重构。"},{"q":"归零这一步常用的工具是？","options":["SWOT 分析","番茄钟","思维导图","5 Why 连续追问"],"answer":3,"why":"用 5 Why 一层层问到底，找到本质原因。"},{"q":"“错误数 = 笔数 × 每笔出错率”，这是在做哪一步？","options":["解构：用公式找要素和卡点","归零","重构","复盘"],"answer":0,"why":"把问题写成公式，就是在解构要素、找卡点。"}],"task":"对一个反复出现的工作错误连问 5 个“为什么”，写下最后那个根本原因和一个针对它的改法。","taskHint":"问到“因为没有规则/没有编号/没有提醒”这一类，通常就接近根了。10 分钟。","ep":"第 68 集"},"zt-dy2":{"id":"zt-dy2","title":"把第一性原理用在自己的钱包上","courseLabel":"思维专题课 · 第一性 02 扩展用法","scenes":[{"place":"周六 · 家里","who":"旁白","line":"燕美翻手机账单：这个月又超支了。"},{"place":"10:00","who":"燕美（心里）","line":"我已经少点外卖了，为什么还是不够？"},{"place":"10:20","who":"旁白","line":"她搜了一圈理财技巧：记账 App、52 周存钱法、各种省钱攻略。"},{"place":"10:40","   if(v===SYNTH_ID){ selectSynth(!!S.started && !muted); toast("合成闯关曲",false); return; }
  for(var i=0;i<TRACKS.length;i++){
    if(TRACKS[i].id===v){ selectTrack(i, !!S.started && !muted); toast(TRACKS[i].name,false); return; }
  }
};


function renderMap(){
  var st=total(),idx=0;RANKS.forEach(function(r,i){if(st>=r.min)idx=i});var cur=RANKS[idx],nx=RANKS[idx+1];
  var pct=nx?Math.max(4,Math.round((st-cur.min)/(nx.min-cur.min)*100)):100;
  var cleared=BUILT.filter(function(id){return starsOf(game[id])>=1}).length;
  var next=RECOMMENDED.map(function(id){return LESSONS.find(function(l){return l.id===id})}).find(function(l){return l&&EPISODES[l.id]&&starsOf(game[l.id])<3})
    ||LESSONS.find(function(l){return EPISODES[l.id]&&starsOf(game[l.id])<3});
  var recL=LESSONS.find(function(l){return isRec(l.id)&&EPISODES[l.id]});
  var h='<div class="card rank-card"><div class="rank"><div><div class="muted">当前称号</div><div class="name">'+esc(cur.name)+'</div></div><div style="text-align:right"><div class="stars">★ '+st+'</div><div class="muted">已通关 '+cleared+' · 上线 '+BUILT.length+' 关</div></div></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="muted">'+(nx?'再拿 '+(nx.min-st)+' 颗星 → 「'+esc(nx.name)+'」':'已经是最高称号')+'</div>'+
    (recL&&starsOf(game[recL.id])<3?'<div class="card rec-card"><div class="tag">⭐ 推荐先玩</div><b>'+esc(recL.n)+' · 人生规划罗盘</b><p class="muted" style="margin:6px 0 10px">你说过复盘很重要。这一关开局就能进：短剧 → 老师出招 → 答题 → 今晚写三行复盘。</p><button class="btn gold full" data-open="'+recL.id+'">▶ 先闯「复盘」关</button></div>':'')+
    (next&&!(recL&&next.id===recL.id)?'<div class="row"><button class="btn pri full" data-open="'+next.id+'">▶ 继续闯关：'+esc(next.n)+'</button></div>':'')+'</div>';
  h+='<div class="card"><b>怎么玩</b><p class="muted" style="margin:6px 0 0">每关是一集短剧。看到悬念时请老师出招，再答几道题、做一个 10 分钟现实任务。看完剧情 / 答题全对 / 做完任务各得 ★。复盘、执行力前几关、思维三课开局可进；任意拿到 1 星后，全部关卡解锁。</p>'+(canSave?'':'<p class="fb"><b class="no">注意：</b>当前打开方式不能保存进度。</p>')+'</div>';
  h+='<div class="card"><b>关卡地图</b><div class="muted" style="margin-bottom:8px">推荐先玩「复盘」· 全部 '+BUILT.length+' 关已上线（复盘、执行力前几关、思维三课开局可进）</div>';
  var n=0;
  COURSES.forEach(function(c){
    var ls=LESSONS.filter(function(l){return l.c===c.key});
    if(!ls.length)return;
    h+='<div class="course">'+esc(c.name)+'</div><div class="map"><div class="map-path"></div>';
    ls.forEach(function(l){
      n++;var built=!!EPISODES[l.id],open=built&&unlocked(l.id),s=starsOf(game[l.id]);
      var rec=isRec(l.id)&&built,cls="lv"+(open?" open":"")+(s>=1?" clear":"")+(rec?" lv-rec":"");
      var sub=built?(open?(s>=3?"三星通关":s>=1?"继续拿星":(isRec(l.id)?"推荐 · 开局可进":"可以进入")):(EARLY_OPEN[l.id]?"开局可进":"先过上一关或拿 1 星")):"即将上线";
      h+='<div class="lv-row'+(rec?' rec-row':'')+'"><button class="'+cls+'" '+(open?'data-open="'+l.id+'"':'')+' aria-label="'+esc(l.n)+'"><div class="c">'+(s>=3?"★":n)+'</div><div class="meta"><div class="t">'+esc(l.n)+(isRec(l.id)?'<span class="rec">推荐</span>':'')+'</div>'+(built?'<div class="s">'+stars(s)+'</div>':'')+'<div class="sub">'+sub+'</div></div></button></div>';
    });
    h+='</div>';
  });
  h+='<div class="row"><button class="btn" id="resetGame">清空闯关记录</button></div></div>';
  return h;
}

function sceneCard(s,i,t,mode){
  var n=s.who==="旁白";
  return '<div class="stage '+(mode||'')+'"><div class="meta"><span>'+esc(s.place||"")+'</span><span>第 '+(i+1)+' / '+t+' 幕</span></div>'+
    '<div class="plate"><div class="av '+whoAv(s.who)+'">'+esc(s.who.slice(0,1))+'</div><div class="nm">'+esc(s.who)+'</div></div>'+
    '<div class="line'+(n?' n':'')+'">'+(n?esc(s.line):'“'+esc(s.line)+'”')+'</div></div>';
}
function dots(t,a){var h='<div class="dots">';for(var i=0;i<t;i++)h+='<i class="'+(i<=a?'on':'')+'"></i>';return h+'</div>'}

function renderPlayer(){
  var ep=EPISODES[S.level],prog=game[ep.id]||EMPTY;
  var ph=["story","cliff","teacher","after","quiz","task"],lb=["剧情","悬念","老师出招","结局","答题","现实任务"];
  var doneSteps=(prog.story?1:0)+(prog.quiz?1:0)+(prog.task?1:0);
  var h='<div class="muted">'+esc(ep.ep)+' · '+esc(ep.courseLabel||(LESSONS.find(function(l){return l.id===ep.id})||{}).n||'')+'</div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h1 class="ep">'+esc(ep.title)+'</h1>'+stars(starsOf(prog),true,popStar&&popStar.id===ep.id?popStar.n-1:-1)+'</div>';
  h+='<div class="xp"><i style="width:'+(doneSteps/3*100)+'%"></i></div>';
  h+='<div class="phases">'+ph.map(function(p,i){return '<span class="'+(p===S.phase?'on':'')+'">'+lb[i]+'</span>'}).join("")+'</div>';
  if(S.phase==="story"){h+=dots(ep.scenes.length,S.si)+sceneCard(ep.scenes[S.si],S.si,ep.scenes.length)+'<div class="row">'+(S.si>0?'<button class="btn" data-act="prev">上一幕</button>':'')+
    (S.si<ep.scenes.length-1?'<button class="btn pri" data-act="next" style="flex:1">下一幕 ▶</button>':'<button class="btn pri" data-act="toCliff" style="flex:1">进入悬念 ▶</button>')+'</div>'}
  if(S.phase==="cliff"){h+='<div class="stage cliff"><div class="muted" style="text-align:center">本集悬念</div><div class="cliff-txt">'+esc(ep.cliff)+'</div></div><div class="row"><button class="btn" data-act="back2story">回看剧情</button><button class="btn gold" data-act="toTeacher" style="flex:1">✨ 请老师出招</button></div>'}
  if(S.phase==="teacher"){h+='<div class="stage teacher"><div class="tag">常青老师出招 · '+(S.ai+1)+' / '+ep.teacher.length+'</div>'+dots(ep.teacher.length,S.ai)+
    '<div class="plate"><div class="av ls">师</div><div class="nm">常青老师</div></div><div class="line">'+esc(ep.teacher[S.ai])+'</div><div class="muted" style="margin-top:8px">出自：'+esc(ep.source)+'</div></div><div class="row">'+
    (S.ai>0?'<button class="btn" data-act="tprev">上一招</button>':'')+(S.ai<ep.teacher.length-1?'<button class="btn pri" data-act="tnext" style="flex:1">下一招 ▶</button>':'<button class="btn pri" data-act="toAfter" style="flex:1">看结局 ▶</button>')+'</div>'}
  if(S.phase==="after"){h+=dots(ep.after.length,S.si)+sceneCard(ep.after[S.si],S.si,ep.after.length)+'<div class="row">'+
    (S.si<ep.after.length-1?'<button class="btn pri" data-act="anext" style="flex:1">下一幕 ▶</button>':'<button class="btn gold" data-act="toQuiz" style="flex:1">答题拿星 ▶</button>')+'</div>'}
  if(S.phase==="quiz"){var all=true;
    ep.quiz.forEach(function(q,qi){var p=S.picks[qi];if(p!==q.answer)all=false;
      h+='<div class="card"><div class="muted">第 '+(qi+1)+' 题</div><div style="font-weight:700;margin-top:4px">'+esc(q.q)+'</div>';
      q.options.forEach(function(o,oi){var c=p===oi?(oi===q.answer?' right':' wrong'):'';h+='<button class="opt'+c+'" data-q="'+qi+'" data-o="'+oi+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+'</button>'});
      if(p!=null)h+='<div class="fb">'+(p===q.answer?'<b class="ok">答对了。</b> '+esc(q.why):'<b class="no">再想想，可以重选。</b>')+'</div>';
      h+='</div>'});
    h+='<div class="row"><button class="btn pri full" data-act="toTask">'+(all?'全对！去做现实任务 ▶':'先去做现实任务 ▶')+'</button></div>'}
  if(S.phase==="task"){h+='<div class="card"><div class="tag">现实任务 · 基础版 10 分钟</div><div class="line" style="margin-top:10px;font-size:17px">'+esc(ep.task)+'</div><p class="muted">'+esc(ep.taskHint)+'</p><div class="row">'+
    (prog.task?'<span class="done">已完成，第 3 颗星到手。</span>':'<button class="btn gold" data-act="taskDone" style="flex:1">我做完了 ★</button>')+'</div><p class="muted">星星规则：看完剧情 1 ★ · 答题全对 1 ★ · 现实任务 1 ★</p></div>'}
  h+='<div class="row"><button class="btn full" data-act="map">← 回到地图</button></div>';
  return h;
}

function renderTracker(){
  var h='<div class="card"><b>课程进度</b><div class="muted">“学完”和“已用上”都算；闯关拿星会自动往前推</div>';
  COURSES.forEach(function(c){var ls=LESSONS.filter(function(l){return l.c===c.key});var d=ls.filter(function(l){return lessonSt[l.id]==="学完"||lessonSt[l.id]==="已用上"}).length;var p=Math.round(d/ls.length*100);
    h+='<div class="pb"><span class="l">'+esc(c.short)+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span class="v">'+d+'/'+ls.length+'</span></div>'});
  h+='</div><div class="chips">'+COURSES.map(function(c){return '<button class="chip'+(S.course===c.key?' on':'')+'" data-course="'+c.key+'">'+esc(c.short)+'</button>'}).join("")+'</div>';
  LESSONS.filter(function(l){return l.c===S.course}).forEach(function(l){
    h+='<div class="card les"><h3>'+esc(l.n)+'</h3><p><span class="k">核心</span>'+esc(l.core)+'</p><p><span class="k">今天怎么用一次</span>'+esc(l.use)+'</p><div class="path">'+esc(ROOT+l.dir+"\\"+l.file)+'</div><select data-st="'+l.id+'">'+STATUSES.map(function(s){return '<option'+(lessonSt[l.id]===s?' selected':'')+'>'+s+'</option>'}).join("")+'</select></div>'});
  return h;
}

function render(){
  if(!S.started)return;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab===S.tab)});
  document.getElementById("app").innerHTML=S.tab==="tracker"?renderTracker():(S.level?renderPlayer():renderMap());
  syncMuteBtn();popStar=null;
}
function go(f){f();render();window.scrollTo(0,0)}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){go(function(){S.tab=t.dataset.tab});return}
  if(t.dataset.open){var id=t.dataset.open;go(function(){S.level=id;S.phase="story";S.si=0;S.ai=0;S.picks=[];raise(id,"在学")});return}
  if(t.dataset.course){go(function(){S.course=t.dataset.course});return}
  if(t.id==="resetGame"){if(confirm("确定清空所有星星吗？")){game={};wr(GAME_KEY,game);render()}return}
  if(t.dataset.q!=null){var qi=+t.dataset.q,oi=+t.dataset.o,ep=EPISODES[S.level];S.picks[qi]=oi;
    if(ep.quiz.every(function(q,i){return S.picks[i]===q.answer}))mark(ep.id,"quiz");render();return}
  var a=t.dataset.act,ep2=S.level&&EPISODES[S.level];
  var A={prev:function(){S.si--},next:function(){S.si++},toCliff:function(){S.phase="cliff"},back2story:function(){S.phase="story";S.si=ep2.scenes.length-1},
    toTeacher:function(){S.phase="teacher";S.ai=0},tprev:function(){S.ai--},tnext:function(){S.ai++},toAfter:function(){S.phase="after";S.si=0},anext:function(){S.si++},
    toQuiz:function(){mark(ep2.id,"story");S.phase="quiz"},toTask:function(){S.phase="task"},taskDone:function(){mark(ep2.id,"task")},map:function(){S.level=null}};
  if(A[a])go(A[a]);
});
document.addEventListener("change",function(e){var s=e.target;if(s.dataset&&s.dataset.st){lessonSt[s.dataset.st]=s.value;wr(KEY,lessonSt);render()}});

// ===== 手游特效：按下反馈 / 星星弹出 / 通关彩纸 =====
var REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function sfx(notes,type,gain,step){if(muted||!actx)return;try{ensureAudio();var t0=actx.currentTime+0.01;notes.forEach(function(f,i){tone(f,t0+i*(step||0.08),0.14,type||"square",gain||0.1)})}catch(e){}}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
document.addEventListener("pointerdown",function(e){
  var t=e.target.closest("button,.opt");if(!t||!S.started)return;
  if(!REDUCED){var r=document.createElement("div");r.className="tap-ring";r.style.left=e.clientX+"px";r.style.top=e.clientY+"px";document.body.appendChild(r);setTimeout(function(){r.remove()},500)}
  buzz(8);sfx([880],"triangle",0.06);
},{passive:true});
function starFly(n){
  sfx([784,1046.5,1318.5],"square",0.14,0.07);buzz([15,40,15]);
  var d=document.createElement("div");d.className="star-fly";d.innerHTML='<div class="s">★</div><div class="p">第 '+n+' 颗星！</div>';
  document.body.appendChild(d);setTimeout(function(){d.classList.add("out")},850);setTimeout(function(){d.remove()},1350);
  if(!REDUCED)confetti(40,0.5,0.42);
}
function levelClear(id){
  var l=LESSONS.find(function(x){return x.id===id})||{n:""};
  sfx([523.25,659.25,783.99,1046.5,1318.5,1568],"square",0.16,0.1);buzz([30,60,30,60,80]);
  var b=document.createElement("div");b.className="clear-banner";
  b.innerHTML='<b>关卡完成！</b><div class="muted" style="color:var(--ink2)">'+esc(l.n)+' · 三星通关</div><div class="bs"><span>★</span><span>★</span><span>★</span></div>';
  document.body.appendChild(b);setTimeout(function(){b.classList.add("out")},2300);setTimeout(function(){b.remove()},2800);
  if(!REDUCED){confetti(160,0.5,0.3);setTimeout(function(){confetti(80,0.15,0.6);confetti(80,0.85,0.6)},350)}
}
var fxParts=[],fxRun=false;
function confetti(count,ox,oy){
  var c=document.getElementById("fx");if(!c)return;
  var W=c.width=innerWidth*(devicePixelRatio||1),H=c.height=innerHeight*(devicePixelRatio||1),k=devicePixelRatio||1;
  var cols=["#ffd166","#ffb703","#ff8fab","#7aa2ff","#3ddc97","#9b8cff","#ffffff"];
  for(var i=0;i<count;i++){var a=Math.random()*Math.PI*2,v=(4+Math.random()*9)*k;
    fxParts.push({x:W*ox,y:H*oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6*k,w:(5+Math.random()*6)*k,h:(8+Math.random()*8)*k,
      r:Math.random()*6,vr:(Math.random()-.5)*0.4,c:cols[i%cols.length],life:0,max:90+Math.random()*60,star:Math.random()<.15})}
  if(!fxRun){fxRun=true;requestAnimationFrame(fxTick)}
}
function fxTick(){
  var c=document.getElementById("fx"),g=c.getContext("2d"),k=devicePixelRatio||1;g.clearRect(0,0,c.width,c.height);
  fxParts=fxParts.filter(function(p){return p.life<p.max&&p.y<c.height+40});
  fxParts.forEach(function(p){p.life++;p.vy+=0.28*k;p.vx*=0.985;p.vy*=0.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    g.save();g.globalAlpha=Math.min(1,(p.max-p.life)/25);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;
    if(p.star){g.font=(p.h*1.6)+"px sans-serif";g.fillText("★",-p.h/2,p.h/2)}else g.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*0.15)));
    g.restore()});
  if(fxParts.length)requestAnimationFrame(fxTick);else{fxRun=false;g.clearRect(0,0,c.width,c.height)}
}
syncMuteBtn();
</script>
