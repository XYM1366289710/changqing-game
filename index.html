<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小熊闯关 · 执行力短剧</title>
<style>
:root{
  --bg:#070b16;--bg2:#10182b;--card:#141c31;--card2:#1a243c;
  --ink:#eef2ff;--ink2:#a9b4d0;--ink3:#6e7a99;
  --line:rgba(255,255,255,.08);--glow:#4f7cff;--glow2:#7aa2ff;
  --gold:#ffd166;--gold2:#ffb703;--ok:#3ddc97;--bad:#ff6b6b;
  --pink:#ff8fab;--violet:#9b8cff;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:16px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(79,124,255,.28), transparent 60%),
    radial-gradient(800px 500px at 100% 20%, rgba(155,140,255,.12), transparent 50%),
    radial-gradient(700px 400px at 0% 80%, rgba(61,220,151,.08), transparent 50%),
    linear-gradient(180deg,#070b16,#0c1222 40%,#070b16)}
.wrap{position:relative;z-index:1;max-width:430px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{font-size:11px;color:var(--ink3)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn.on{border-color:rgba(79,124,255,.5);box-shadow:0 0 0 3px rgba(79,124,255,.15);color:var(--glow2)}
.tabs{display:flex;gap:8px;margin:0 0 14px;position:sticky;top:0;z-index:6;padding:6px 0;background:linear-gradient(180deg,rgba(7,11,22,.95),rgba(7,11,22,.75))}
.tab{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:11px;font-size:14px;
  color:var(--ink2);font-weight:700;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--glow),#6a5cff);border-color:transparent;color:#fff;
  box-shadow:0 8px 24px rgba(79,124,255,.35)}
.card{background:linear-gradient(180deg,rgba(26,36,60,.92),rgba(16,24,43,.92));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin:0 0 12px;backdrop-filter:blur(8px);
  box-shadow:0 10px 30px rgba(0,0,0,.25)}
.muted{color:var(--ink3);font-size:12px}
.rank-card{position:relative;overflow:hidden}
.rank-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,209,102,.25),transparent 70%);pointer-events:none}
.rank{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.rank .name{font-size:26px;font-weight:800;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;color:transparent}
.rank .stars{font-size:26px;font-weight:800;color:var(--gold)}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--gold));border-radius:999px;
  box-shadow:0 0 12px rgba(79,124,255,.6);transition:width .4s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--ink);border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer}
.btn.pri{background:linear-gradient(135deg,var(--glow),#6a5cff);border-color:transparent;color:#fff;
  box-shadow:0 10px 28px rgba(79,124,255,.4)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),#ffd166);border:0;color:#2a1a00;box-shadow:0 10px 28px rgba(255,183,3,.35)}
.btn.full{width:100%}
.btn:active{transform:scale(.98)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.course{margin:16px 0 10px;font-weight:800;font-size:13px;letter-spacing:1px;color:var(--ink2);text-transform:none;
  display:flex;align-items:center;gap:8px}
.course::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow)}

/* Game map path */
.map{position:relative;padding:8px 4px 4px}
.map-path{position:absolute;left:50%;top:20px;bottom:20px;width:3px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(79,124,255,.6),rgba(255,209,102,.25),rgba(255,255,255,.08));border-radius:999px;opacity:.7}
.lv-row{position:relative;display:flex;align-items:center;margin:0 0 18px;z-index:1}
.lv-row:nth-child(odd){justify-content:flex-start;padding-right:18%}
.lv-row:nth-child(even){justify-content:flex-end;padding-left:18%}
.lv{all:unset;cursor:default;display:flex;align-items:center;gap:10px;max-width:78%}
.lv-row:nth-child(even) .lv{flex-direction:row-reverse;text-align:right}
.lv .c{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  border:2px dashed rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--ink3);position:relative;
  box-shadow:inset 0 0 20px rgba(0,0,0,.35)}
.lv.open{cursor:pointer}
.lv.open .c{border:2px solid var(--glow2);background:radial-gradient(circle at 35% 30%,#2a3d6e,#132040);
  color:#fff;box-shadow:0 0 0 5px rgba(79,124,255,.18),0 8px 22px rgba(79,124,255,.35);animation:pulse 2.2s ease-in-out infinite}
.lv.clear .c{background:radial-gradient(circle at 35% 30%,#ffd166,#e09a00);border-color:#ffd166;color:#2a1a00;
  box-shadow:0 0 0 5px rgba(255,209,102,.15),0 8px 22px rgba(255,183,3,.3);animation:none}
.lv .meta{display:flex;flex-direction:column;gap:2px}
.lv .t{font-size:13px;font-weight:700;color:var(--ink2);line-height:1.3}
.lv.open .t,.lv.clear .t{color:var(--ink)}
.lv .sub{font-size:11px;color:var(--ink3)}
.lv .s{font-size:12px;letter-spacing:1px;color:var(--gold)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.st0{color:rgba(255,255,255,.2)}
.gold{color:var(--gold)}
.phases{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.phases span{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink3)}
.phases span.on{border-color:rgba(79,124,255,.5);color:var(--glow2);background:rgba(79,124,255,.12);font-weight:700}
.dots{display:flex;gap:6px;margin:0 0 10px}
.dots i{flex:1;max-width:28px;height:6px;border-radius:999px;background:rgba(255,255,255,.1)}
.dots i.on{background:linear-gradient(90deg,var(--glow),var(--gold))}

/* Story stage */
.stage{position:relative;min-height:230px;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:
    radial-gradient(600px 240px at 50% 0%, rgba(79,124,255,.22), transparent 55%),
    linear-gradient(180deg,#121a2e,#0a1020);
  box-shadow:inset 0 0 80px rgba(0,0,0,.45);padding:18px;display:flex;flex-direction:column;gap:12px}
.stage.cliff{background:
  radial-gradient(500px 220px at 50% 30%, rgba(255,107,107,.18), transparent 55%),
  linear-gradient(180deg,#1a1220,#0a1020)}
.stage.teacher{background:
  radial-gradient(500px 220px at 50% 20%, rgba(255,209,102,.16), transparent 55%),
  linear-gradient(180deg,#1a1828,#0a1020)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.45) 100%)}
.stage > *{position:relative;z-index:1}
.stage .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.plate{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 12px 6px 6px;border-radius:999px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.plate .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.av.ym{background:linear-gradient(135deg,#ff8fab,#ff6b9d)}
.av.nb{background:linear-gradient(135deg,#6e7a99,#4a5568)}
.av.ls{background:linear-gradient(135deg,#ffd166,#f4a261);color:#2a1a00}
.av.qt{background:linear-gradient(135deg,#7aa2ff,#6a5cff)}
.plate .nm{font-size:12px;font-weight:800}
.line{font-size:18px;line-height:1.65;font-weight:600}
.line.n{color:var(--ink2);font-weight:500;font-size:16px}
.cliff-txt{font-size:22px;font-weight:800;line-height:1.45;text-align:center;padding:24px 8px}
.tag{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:1px}

.opt{all:unset;display:block;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);margin-top:8px;font-size:14px;cursor:pointer;transition:transform .1s}
.opt:active{transform:scale(.99)}
.opt.right{background:rgba(61,220,151,.12);border-color:var(--ok);color:#b8ffe0}
.opt.wrong{background:rgba(255,107,107,.12);border-color:var(--bad);color:#ffc9c9}
.fb{margin-top:10px;font-size:13px;color:var(--ink2)}
.fb b.ok{color:var(--ok)} .fb b.no{color:var(--bad)}
.done{color:var(--ok);font-weight:800}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:rgba(20,28,49,.95);
  color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;z-index:20;
  border:1px solid rgba(255,209,102,.35);box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .3s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .star-pop{display:inline-block;animation:starPop .6s ease}
@keyframes starPop{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}

/* Gate overlay */
.gate{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;
  background:
    radial-gradient(800px 500px at 50% 20%, rgba(79,124,255,.35), transparent 60%),
    linear-gradient(180deg,#070b16,#0b1020);padding:24px}
.gate-card{width:100%;max-width:400px;background:linear-gradient(180deg,#1a243c,#121a2e);border:1px solid var(--line);
  border-radius:24px;padding:28px 22px 22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);margin-bottom:env(safe-area-inset-bottom)}
.gate-card .logo{font-size:42px;margin-bottom:8px}
.gate-card h1{font-size:24px;margin:0 0 8px}
.gate-card p{color:var(--ink2);font-size:14px;margin:0 0 18px}
.gate.hidden{display:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:7px 12px;font-size:12px;color:var(--ink2);cursor:pointer}
.chip.on{background:rgba(79,124,255,.18);border-color:rgba(79,124,255,.5);color:var(--glow2);font-weight:700}
.pb{display:flex;align-items:center;gap:10px;font-size:12px;margin:6px 0}
.pb .l{flex:0 0 72px;color:var(--ink2)}.pb .bar{flex:1;margin:0}.pb .v{flex:0 0 48px;text-align:right;color:var(--ink3)}
.les h3{font-size:15px;margin:0 0 6px}
.les p{margin:6px 0;font-size:13px;color:var(--ink2)}
.les .k{color:var(--ink3);font-size:11px;font-weight:700;display:block;margin-bottom:2px}
.les select{font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0d1424;color:var(--ink);margin-top:6px;width:100%}
.path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:var(--ink3);word-break:break-all;margin-top:6px}
.xp{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 0}
.xp>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .35s}
h1.ep{font-size:20px;margin:4px 0;line-height:1.35}

.lv .rec{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:linear-gradient(90deg,var(--gold2),var(--gold));color:#1a1200;font-size:10px;font-weight:800;vertical-align:middle}
.rec-card{border:1px solid rgba(240,192,64,.45);background:linear-gradient(180deg,rgba(240,192,64,.12),rgba(0,0,0,.15))}
.rec-card .tag{color:var(--gold);font-weight:800;font-size:12px;margin-bottom:6px}


.music-panel{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);text-align:left}
.music-panel .ml{font-size:11px;color:var(--ink3);font-weight:700;margin-bottom:6px}
.music-panel select{width:100%;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0d1424;color:var(--ink)}
.music-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.music-row .btn{flex:1;padding:8px 6px;font-size:13px}
.music-now{font-size:12px;color:var(--gold);margin-top:8px;min-height:1.2em;line-height:1.35}
.top-music{display:flex;gap:4px;align-items:center}
.top-music .iconbtn{width:36px;height:36px;font-size:14px}

/* 手游手感：按下反馈 */
.btn,.tab,.chip,.iconbtn,.opt{transition:transform .12s cubic-bezier(.3,1.6,.5,1),filter .12s,box-shadow .12s;user-select:none;-webkit-user-select:none}
.btn:active,.tab:active,.chip:active,.iconbtn:active{transform:scale(.93) translateY(1px);filter:brightness(1.18)}
.btn.pri:active{box-shadow:0 4px 12px rgba(79,124,255,.35)}
.btn.gold:active{box-shadow:0 4px 12px rgba(255,183,3,.3)}
.opt:active{transform:scale(.97)}
.lv .c{transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.lv.open:active .c{transform:scale(.88);animation:none}
.tap-ring{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:40;
  border:2px solid rgba(255,209,102,.85);animation:tapRing .45s ease-out forwards}
@keyframes tapRing{to{transform:scale(5);opacity:0}}

/* 推荐关高亮（rs06） */
.lv.lv-rec .c{border:3px solid var(--gold);background:radial-gradient(circle at 35% 30%,#3a2f10,#1d1606);color:var(--gold);
  box-shadow:0 0 0 6px rgba(255,209,102,.18),0 0 28px rgba(255,183,3,.55);animation:recGlow 1.6s ease-in-out infinite}
.lv.lv-rec.clear .c{background:radial-gradient(circle at 35% 30%,#ffd166,#e09a00);color:#2a1a00}
.lv.lv-rec .c::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px dashed rgba(255,209,102,.7);animation:spin 6s linear infinite}
.lv.lv-rec .c::after{content:"👇";position:absolute;top:-30px;left:50%;font-size:20px;transform:translateX(-50%);animation:bob 1s ease-in-out infinite}
.lv.lv-rec .t{color:var(--gold)}
.lv-row.rec-row::before{content:"";position:absolute;inset:-6px -2px;border-radius:999px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,209,102,.13),transparent);background-size:200% 100%;animation:shine 2.4s linear infinite}
.rec-card .btn.gold{position:relative;overflow:hidden}
.rec-card .btn.gold::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sweep 2.6s ease-in-out infinite}
@keyframes recGlow{0%,100%{transform:scale(1);box-shadow:0 0 0 6px rgba(255,209,102,.18),0 0 22px rgba(255,183,3,.45)}50%{transform:scale(1.08);box-shadow:0 0 0 10px rgba(255,209,102,.1),0 0 36px rgba(255,183,3,.75)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}

/* 星星弹出 */
.star-fly{position:fixed;left:50%;top:42%;z-index:45;pointer-events:none;text-align:center;transform:translate(-50%,-50%)}
.star-fly .s{font-size:96px;line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(255,183,3,.9),0 6px 0 #b77900;
  animation:starBig .9s cubic-bezier(.2,1.5,.4,1) forwards}
.star-fly .p{font-size:18px;font-weight:900;color:#fff;margin-top:6px;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:starTxt .9s ease forwards}
.star-fly.out{animation:flyOut .45s ease-in forwards}
@keyframes starBig{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.35) rotate(15deg)}100%{transform:scale(1) rotate(0)}}
@keyframes starTxt{0%,30%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@keyframes flyOut{to{opacity:0;transform:translate(-50%,-260%) scale(.3)}}
.gold.pop{display:inline-block;animation:starPop .7s cubic-bezier(.2,1.6,.4,1)}

/* 通关彩纸 + 横幅 */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:44}
.clear-banner{position:fixed;left:50%;top:30%;z-index:46;pointer-events:none;transform:translate(-50%,-50%);text-align:center;
  padding:18px 26px;border-radius:22px;background:linear-gradient(180deg,rgba(42,32,8,.95),rgba(20,16,4,.95));border:2px solid var(--gold);
  box-shadow:0 0 50px rgba(255,183,3,.5),0 20px 60px rgba(0,0,0,.6);animation:bannerIn .6s cubic-bezier(.2,1.6,.4,1)}
.clear-banner b{display:block;font-size:28px;letter-spacing:3px;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;color:transparent}
.clear-banner .bs{font-size:34px;color:var(--gold);letter-spacing:6px;margin-top:4px}
.clear-banner .bs span{display:inline-block;animation:starPop .6s cubic-bezier(.2,1.6,.4,1) both}
.clear-banner .bs span:nth-child(2){animation-delay:.15s}.clear-banner .bs span:nth-child(3){animation-delay:.3s}
.clear-banner.out{transition:opacity .4s,transform .4s;opacity:0;transform:translate(-50%,-50%) scale(.8)}
@keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

@media (prefers-reduced-motion:reduce){
  .lv.lv-rec .c,.lv.lv-rec .c::before,.lv.lv-rec .c::after,.lv-row.rec-row::before,.rec-card .btn.gold::after{animation:none}
}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-card">
    <div class="logo">⭐</div>
    <h1>小熊闯关</h1>
    <p>看燕美在财务室遇到难题，请老师出招，答题拿星，再在真实工作里用一次。<br>点「开始游戏 · 开启音乐」后播放曲库（约 37 首 CC0）。可用上一首/下一首或下拉切换；也可选「合成闯关曲」。</p>
    <button class="btn gold full" id="startBtn">开始游戏 · 开启音乐</button>
    <button class="btn full" id="startMuted" style="margin-top:8px">先静音开始</button>
    <button class="btn full" id="testMusic" style="margin-top:8px">🔊 测试音乐</button>

    <div class="music-panel">
      <div class="ml">背景音乐（开源 CC0 · 可切换）</div>
      <select id="trackSelect" aria-label="选曲"></select>
      <div class="music-row">
        <button type="button" class="btn" id="prevTrack">上一首</button>
        <button type="button" class="btn" id="nextTrack">下一首</button>
      </div>
      <div class="music-now" id="nowPlaying">当前：合成闯关曲</div>
    </div>
  </div>
</div>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><b>小熊闯关 · 执行力短剧</b><span>关卡地图 · 短剧 · 答题 · 现实任务</span></div>
    <div class="top-music"><button class="iconbtn" id="prevTrackTop" title="上一首" aria-label="上一首">⏮</button><button class="iconbtn" id="muteBtn" title="音乐" aria-label="音乐开关">🔇</button><button class="iconbtn" id="nextTrackTop" title="下一首" aria-label="下一首">⏭</button></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="game">闯关模式</button>
    <button class="tab" data-tab="tracker">学习进度表</button>
  </div>
  <div id="app"></div>
</div>

<script>
var ROOT="P:\\常青老师课程\\";
var COURSES=[{"key": "zx", "name": "执行力系统课程", "short": "执行力"}, {"key": "xx", "name": "学习力闭环训练营", "short": "学习力"}, {"key": "rs", "name": "人生规划罗盘", "short": "人生罗盘"}, {"key": "zs", "name": "知识体系训练营", "short": "知识体系"}, {"key": "wn", "name": "外脑系统训练营", "short": "外脑"}, {"key": "zy", "name": "职业规划系统", "short": "职业规划"}, {"key": "zt", "name": "思维专题课（选修）", "short": "思维专题"}, {"key": "sj", "name": "赠送·时间整理术（选修）", "short": "时间整理术"}];
var LESSONS=[{"id": "zx01", "c": "zx", "n": "01 执行理念", "dir": "执行力系统课程\\01-执行理念", "file": "文稿笔记.md", "core": "执行拉垮不是意志力问题，是系统问题。按王阳明“知行合一”，用一套系统去管住执行，而不是头疼医头。", "use": "挑一件总在拖的活（比如贷后资料补交），写一句：它卡在“不想做、做不动、忘了做”的哪一种。"}, {"id": "zx02", "c": "zx", "n": "02 执行原理", "dir": "执行力系统课程\\02-执行原理", "file": "文稿笔记.md", "core": "福格行为模型：行为 = 动机 × 能力 × 提示，缺一角就停。兴趣级动机容易退，刚需级才持久；三角对应动力、任务、提示三套系统。", "use": "拿本月一件“计划了没做到”的事（比如流水对账），给三个角各打一分，找出最弱的那一角。", "d": "已用上"}, {"id": "zx03", "c": "zx", "n": "03 动力系统", "dir": "执行力系统课程\\03-动力系统", "file": "文稿笔记.md", "core": "动力来自刺激点：痛点越痛、爽点越爽，改变意愿越强。愿望不等于刚需，用具体化、可视化、重复化把愿望变成执念。", "use": "把“不想再一个个登网银导流水”写成一句具体的痛点，设成桌面壁纸或贴在显示器上。", "d": "已用上"}, {"id": "zx04", "c": "zx", "n": "04 提示系统", "dir": "执行力系统课程\\04-提示系统", "file": "文稿笔记.md", "core": "大脑会冲淡激情、会遗忘、会被环境带偏。用鲶鱼效应（激励者、陪伴者、引导者）、触发提醒和环境改造来对抗。", "use": "给明天最重要的一件事（如付款审批）设一个定时提醒，把要用的表格放到桌面最显眼处。", "d": "在学"}, {"id": "zx05", "c": "zx", "n": "05 任务系统", "dir": "执行力系统课程\\05-任务系统", "file": "文稿笔记.md", "core": "像游戏一样派任务：自动推送省掉决策，难度卡在“有挑战能完成”。三段式任务量；想逃避时用最小动作和最终幻想，做完给激励。", "use": "把今天最难的一件（如月报）切成基础、正常、冲刺三档，第一步只写一个 5 分钟动作：打开模板。", "d": "已用上"}, {"id": "zx06", "c": "zx", "n": "06 综合状态", "dir": "执行力系统课程\\06-综合状态", "file": "文稿笔记.md", "core": "四种状态毁掉执行：反馈慢导致失望、放纵后自责、生理波动、外界刺激导致焦虑。对策有预期管理、场景预判、精力管理、减少焦虑信息、时间模块化。", "use": "今天哪一段崩了，就只放弃那一段，到下一个饭点重启（并联，不是串联）。", "d": "已用上"}, {"id": "zx07", "c": "zx", "n": "07 加餐·执行力周期", "dir": "执行力系统课程\\07-加餐-执行力周期", "file": "课程原文.md", "core": "做任何事都会经历新鲜期、疲劳期、麻木期、内化期。撑过去靠多重意义加持、把“想”变成“做”、适当借助外部激励。", "use": "判断你对“学这套课”正处在哪一期，再写一条“想学好”以外的意义，比如少熬一次夜对账。"}, {"id": "xx01", "c": "xx", "n": "01 理解力", "dir": "学习力闭环训练营·第2期\\01-理解力", "file": "文稿笔记.md", "core": "理解力是从信息里快速准确抓重点。它受背景知识和工作记忆（7±2）限制；用框架学习法：抓主线、抓重点（结论、加粗、小标题）、看主题—论点—论据。", "use": "银行发来新通知时，只看标题和加粗句，用一句话写下“它要我做什么”。", "d": "学完"}, {"id": "xx06", "c": "xx", "n": "加餐1 理解力卡点", "dir": "学习力闭环训练营·第2期\\06-直播加餐1-理解力卡点如何打通", "file": "课程原文.md", "core": "按你 7 月的笔记：词、句、段、篇四层读法；找中心句和支撑句；带着主线问题去读；看清“破—立”结构。", "use": "读一份贷款合同或银行回函时，每段只划一句中心句。", "d": "学完"}, {"id": "xx02", "c": "xx", "n": "02 提炼力", "dir": "学习力闭环训练营·第2期\\02-提炼力", "file": "文稿笔记.md", "core": "把作者的知识变成自己的。心法是“六经注我”，五招是提炼触点、关联案例、能用在哪、注意边界、纳入体系。", "use": "合上笔记，不用任何术语讲一遍“最小动作”，讲不出就问：这事在我身上发生过吗？", "d": "已用上"}, {"id": "xx03", "c": "xx", "n": "03 迁移力", "dir": "学习力闭环训练营·第2期\\03-迁移力", "file": "文稿笔记.md", "core": "把只能认出来的惰性知识变成用得出来的活性知识。四个练法：理论找理论、理论找案例、案例找理论、结构性迁移。", "use": "结构性迁移：把已经跑通的一家银行导出步骤，对照另一家，找出相同的骨架。"}, {"id": "xx04", "c": "xx", "n": "04 记忆力", "dir": "学习力闭环训练营·第2期\\04-记忆力", "file": "文稿笔记.md", "core": "记忆六板斧：高集中、强刺激、有逻辑、超连接、场景化、高重复。学之前有仪式感和问题意识，累了就休息，靠间隔重复记牢。", "use": "睡前闭眼回想今天学的一个概念，早上醒来再说一遍。", "d": "已用上"}, {"id": "xx05", "c": "xx", "n": "05 应用力", "dir": "学习力闭环训练营·第2期\\05-应用力", "file": "文稿笔记.md", "core": "知识的最高境界是“无招胜有招”：显性知识要靠实践变成隐性能力。五种刻意练习：提炼、迁移、复盘日记、沙盘推演、清单式训练，练完马上复盘。", "use": "把一项常做的流程（如回单整理）写成一张清单，下次照着做一遍，再改一处。"}, {"id": "xx07", "c": "xx", "n": "加餐2 提炼迁移力打通", "dir": "学习力闭环训练营·第2期\\07-直播加餐2-提炼迁移力如何打通", "file": "课程原文.md", "core": "对笔记再加工：用自己的话压缩概括、关联案例、能用在哪、适用边界、纳入体系。工作流可以简化，也可以让 AI 辅助提炼。", "use": "让 AI 先压缩一节笔记，你再把它改成一句“我的话”。"}, {"id": "rs00", "c": "rs", "n": "00 开营仪式", "dir": "人生规划罗盘\\00-开营仪式", "file": "文稿笔记.md", "core": "罗盘是从找目标到实现目标的整套方案。常青老师靠复盘日记（600 万字以上）、梦想清单、周计划跟踪表一路走出来。", "use": "翻一下课件里他的复盘日记和周计划表，只挑一个你想照抄的格式。"}, {"id": "rs01", "c": "rs", "n": "01 分块", "dir": "人生规划罗盘\\01-分块", "file": "文稿笔记.md", "core": "人生不可控才更要规划。把人生分块，每一块相对可控、对时间更敏感、不容易焦虑彷徨；前提是心里真的认同。", "use": "给现在这一块起个名字，比如“2026–2028 财务实操 + AI 流程化阶段”，写在档案首页。"}, {"id": "rs02", "c": "rs", "n": "02 定向", "dir": "人生规划罗盘\\02-定向", "file": "文稿笔记.md", "core": "方向 = 向内求 + 向外找。向内用梦想清单唤醒真实需求；向外靠模仿、练底层通用能力、养精英习惯。", "use": "找一个做财务数字化或 AI 流程化的人，模仿他一个具体做法。"}, {"id": "rs03", "c": "rs", "n": "03 分解", "dir": "人生规划罗盘\\03-分解", "file": "文稿笔记.md", "core": "避开“大而全”和“模糊没落脚点”。先用 SMART 里的具体、可衡量；抓二八定律的关键要素；深挖意义、预估困难、设时间节点。", "use": "把流水导出项目写成一句能判断的目标：下个月末还要不要一个个登网银。"}, {"id": "rs04", "c": "rs", "n": "04 统筹", "dir": "人生规划罗盘\\04-统筹", "file": "文稿笔记.md", "core": "统筹是统一调配资源达成目标。五维度统筹法按年、季、月、周、日排节点，配合 OKR；只用在对结果有明确要求的项目上。", "use": "把 PBL 项目的 KR1–KR6 各放进一个月份。"}, {"id": "rs05", "c": "rs", "n": "05 部署", "dir": "人生规划罗盘\\05-部署", "file": "文稿笔记.md", "core": "周计划、日计划是落地层。计划是为了心中有数，不是死守；周末复盘时做下周计划，先梳理再部署，分确定任务和备胎任务，已养成的习惯不用写。", "use": "周五下班前，把下周固定要做的（工资、还款日、报表）先填进日程，再列两个备胎任务。"}, {"id": "rs06", "c": "rs", "n": "06 复盘", "dir": "人生规划罗盘\\06-复盘", "file": "文稿笔记.md", "core": "复盘是向内的工具：从学习、工作、生活总结一天，吾日三省吾身，记下重要感悟，直接生成明天的计划；和晨间清单配合，早晚各一次。", "use": "今晚按每日卡写三行复盘。"}, {"id": "rs07", "c": "rs", "n": "07 执行", "dir": "人生规划罗盘\\07-执行", "file": "文稿笔记.md", "core": "执行拉垮是动力太小、阻力太大。提振靠想清意义、正面激励、2W2H 任务法、成就系统、社交系统、监督；能固化的一律固化，做不好就反思，别自责。", "use": "用 2W2H 写今天一件事：为什么做、具体什么动作、做到什么程度算完。"}, {"id": "rs08", "c": "rs", "n": "08 时间管理", "dir": "人生规划罗盘\\08-时间管理", "file": "文稿笔记.md", "core": "人对时间的感知有缺陷，先提高时间敏感度和时间价值意识（机会成本）。分清整块、碎片、暗时间；管住手机；忙的人可以花钱买时间、站在巨人肩膀上。", "use": "找出今天唯一一段整块时间，留给最要专注的事（比如对账）。"}, {"id": "rs09", "c": "rs", "n": "09 精力管理", "dir": "人生规划罗盘\\09-精力管理", "file": "文稿笔记.md", "core": "精力是时间管理的地基。精神能量 = 目标 × 动机；身体能量靠情绪、饮食、睡眠、小休、运动；按自己的精力周期排事情。", "use": "记一天自己脑子最清醒的时段，下周把最容易出错的活（付款、核对）放进去。"}, {"id": "rs10", "c": "rs", "n": "10 结营仪式", "dir": "人生规划罗盘\\10-结营仪式", "file": "文稿笔记.md", "core": "串讲全部模块：分块定向分解、统筹部署、复盘执行、时间和精力管理。成长没有捷径，盯住“因”，坚持复盘会显出威力。", "use": "看完只写一句：这套罗盘里我现在最用得上的是哪一块。"}, {"id": "zs01", "c": "zs", "n": "01 知识体系的理念", "dir": "知识体系训练营·第2期\\01-知识体系的理念", "file": "文稿笔记.md", "core": "知识体系就是大脑里的结构框架（图式）。有了框架，新知识会自动归位、更好记，用的时候能按问题类型快速调出来。", "use": "打开你的财务 AI 专用体系栏目，把今天学到的一句话挂到其中一个下面。"}, {"id": "zs02", "c": "zs", "n": "02 四大知识分类", "dir": "知识体系训练营·第2期\\02-四大知识分类", "file": "文稿笔记.md", "core": "知识分事实性、概念性、程序性、元认知四类。越往后越难学、迁移能力越强，元认知最值钱。", "use": "拆一件手上的活（比如银行承兑）：哪些是事实、哪些是流程、哪些是判断方法。"}, {"id": "zs03", "c": "zs", "n": "03 搭建通识体系", "dir": "知识体系训练营·第2期\\03-搭建通识体系", "file": "文稿笔记.md", "core": "通识体系像内功心法，以学为用、多元思维模型，靠泛读入门级好书建立学科脉络。", "use": "按你的原则暂缓：现在只留一句结论，不变成任务。"}, {"id": "zs04", "c": "zs", "n": "04 搭建专用体系", "dir": "知识体系训练营·第2期\\04-搭建专用体系", "file": "文稿笔记.md", "core": "专用体系以用为学，围绕刚需问题展开。两条原则：当下需求优先、兴趣第二；以主题为单位推进。", "use": "确认你的专用主题就是“家族企业财务 + AI 流程化”，划掉一个跟它无关的学习计划。"}, {"id": "zs05", "c": "zs", "n": "05 PBL 项目制学习法", "dir": "知识体系训练营·第2期\\05-PBL项目制学习法", "file": "文稿笔记.md", "core": "PBL 是问题导向或课题导向的学习，在解决真实问题中积累知识。六力模型：项目力、输入力、研究力、结构力、本质力、迭代力。", "use": "打开 `学习笔记\\02-PBL项目·多账户流水批量导出.md`，看 KR1 做到哪了。", "d": "在学"}, {"id": "zs06", "c": "zs", "n": "06 项目力", "dir": "知识体系训练营·第2期\\06-项目力", "file": "文稿笔记.md", "core": "用项目管理的思路统筹学习（刻舟求剑学习法、西蒙学习法、烧开水理论）。三步：明目标、制地图、上部署，分清主线和支线。", "use": "给流水导出项目画一张地图：主线是跑通一家银行，支线是文件命名规则。"}, {"id": "zs07", "c": "zs", "n": "07 输入力", "dir": "知识体系训练营·第2期\\07-输入力", "file": "文稿笔记.md", "core": "快速建立一个领域的基础认识：先搭最小可用框架，再做主题阅读。工具是问题树和黄金圈（是什么、为什么、怎么做）。", "use": "用黄金圈三问写影刀 RPA：它是什么、为什么能帮我、怎么上手。"}, {"id": "zs08", "c": "zs", "n": "08 研究力", "dir": "知识体系训练营·第2期\\08-研究力", "file": "文稿笔记.md", "core": "针对知识缺口做主题研究，整合不同观点，避免盲人摸象。五步：基础输入、召集大师、略读抓触点、精读炼触点、加工成模型。", "use": "研究“哪些银行网银能批量导出”：先找三个不同来源，对比差异。"}, {"id": "zs09", "c": "zs", "n": "09 结构力", "dir": "知识体系训练营·第2期\\09-结构力", "file": "文稿笔记.md", "core": "知识体系的本质是结构框架。树状最适合承载知识，网状是内化后的结果；可按元起点或主题、黄金圈嵌套、时空维度来分篮子。", "use": "把银行资料按“银行 → 账户 → 文件类型”做成三层树，就是 PBL 的 KR1 全景表。"}, {"id": "zs10", "c": "zs", "n": "10 本质力", "dir": "知识体系训练营·第2期\\10-本质力", "file": "文稿笔记.md", "core": "找第一原理，也就是事物的起点和根本问题。方法是归纳和演绎，演绎走“归零—解构—重构”。", "use": "问一句：每月导流水最终是为了什么（对账、报表）？再看哪一步可以省。"}, {"id": "zs11", "c": "zs", "n": "11 迭代力", "dir": "知识体系训练营·第2期\\11-迭代力", "file": "文稿笔记.md", "core": "体系要持续迭代：增（给知识点补多场景用法）、减（合并本质相同的）；显性知识要用成本能，隐性经验要写成方法。", "use": "把脑子里一条和银行打交道的经验，写成两行 SOP。"}, {"id": "zs12", "c": "zs", "n": "加餐1 如何实操 PBL", "dir": "知识体系训练营·第2期\\12-直播加餐1-如何实操PBL方法", "file": "课程原文.md", "core": "知识体系 = 要素（知识点）+ 要素间的逻辑。PBL 工作流从规划力开始：以终为始，想清动机、目标、要投入的时间、当下精力，再做输入和研究。", "use": "为流水项目回答四问：动机、要解决什么、要投入多少时间、我现在精力够不够。"}, {"id": "zs13", "c": "zs", "n": "加餐2 如何形成知识体系", "dir": "知识体系训练营·第2期\\13-直播加餐2-如何形成知识体系", "file": "课程原文.md", "core": "两种分类逻辑；用终极三问搭框架（以经济学、历史学示范）。体系背后串起来的是问题，不是关键词；PBL 也有边界。", "use": "把你的财务栏目各写成一个问题，比如“回单怎么做到不漏”。"}, {"id": "wn01", "c": "wn", "n": "01 外脑系统的理念", "dir": "外脑系统训练营\\01-外脑系统的理念", "file": "文稿笔记.md", "core": "外脑是用信息化工具替大脑记东西：解决遗忘、避免信息乱堆、把脑力留给思考（谷歌效应）、帮助创造。", "use": "脑子里记着的一件待办，写进收集箱，就不再记它。"}, {"id": "wn02", "c": "wn", "n": "02 外脑载体的选择", "dir": "外脑系统训练营\\02-外脑载体的选择", "file": "文稿笔记.md", "core": "电子笔记胜过纸质。公有云易用，私有云（Obsidian、思源）可定制；推荐“中枢 + 分支”组合，别陷进工具癖。", "use": "定下你的中枢是哪一个，其他工具只当分支。"}, {"id": "wn03", "c": "wn", "n": "03 安装外脑操作系统", "dir": "外脑系统训练营\\03-安装外脑操作系统", "file": "文稿笔记.md", "core": "根目录要覆盖全部场景、一次定好，避免交叉、割裂、过多（5–9 个为宜）。借用 GTD：收集箱、等待处理、将来可能、归档。", "use": "数一数档案盘的顶层文件夹，超过 9 个就记下来，周五再处理。"}, {"id": "wn04", "c": "wn", "n": "04 输入的逻辑", "dir": "外脑系统训练营\\04-输入的逻辑", "file": "文稿笔记.md", "core": "用收集箱中转，输入和整理分开。只收能改变你认知或行为的“触点”，提炼精华不全文复制，定期清空。", "use": "今天只往收集箱放一条，写一句“它能改变我哪个动作”。"}, {"id": "wn05", "c": "wn", "n": "05 加工的逻辑", "dir": "外脑系统训练营\\05-加工的逻辑", "file": "文稿笔记.md", "core": "信息要加工才变成知识（DIKW）。用卢曼卡片笔记法，一张卡一个知识点；按价值分级加工，经验类内容可用 ORID。", "use": "把今天一个工作经验做成一张卡：发生了什么、我怎么处理、下次怎么做。"}, {"id": "wn06", "c": "wn", "n": "06 体系化管理的逻辑", "dir": "外脑系统训练营\\06-体系化管理的逻辑", "file": "文稿笔记.md", "core": "以主题为导向、以整合为手段、以流动为准则、以产品为结果，把卡片整合进体系。", "use": "把一张卡挂到“银行贷后资料”主题下。"}, {"id": "wn07", "c": "wn", "n": "07 非体系管理的逻辑", "dir": "外脑系统训练营\\07-非体系管理的逻辑", "file": "文稿笔记.md", "core": "素材库（表达素材、案例）不用强行分类，粗分类加标签、双链让它自然归纳。", "use": "建一个“财务案例素材”粗分类，今天的烦心事写一句放进去。"}, {"id": "wn08", "c": "wn", "n": "08 索引之搜索系统", "dir": "外脑系统训练营\\08-索引之搜索系统", "file": "文稿笔记.md", "core": "搜索好不好用取决于命名规范。用命名万能公式，做到不打开文件就知道里面是什么。", "use": "给今天导出的流水或回单按统一规则命名一次，比如 银行_账户_月份_类型。"}, {"id": "wn09", "c": "wn", "n": "09 索引之标签系统", "dir": "外脑系统训练营\\09-索引之标签系统", "file": "文稿笔记.md", "core": "标签补上搜索只认关键词、文件夹只能放一处的短板。六类标签：主题、类别、状态、项目、任务、兴趣，再加来源标签，统一前缀。", "use": "只建一个 `#项目/流水导出` 标签，先用起来（你的原则：不追求完美标签）。"}, {"id": "wn10", "c": "wn", "n": "10 索引之双链系统", "dir": "外脑系统训练营\\10-索引之双链系统", "file": "文稿笔记.md", "core": "双向链接和块引用适合关联和随手复习；但引用关系不等于逻辑关系，树状结构仍是体系主干。", "use": "按你的原则可以先跳过，只记一句：树状是主干，双链是辅助。"}, {"id": "wn11", "c": "wn", "n": "11 索引之中控系统", "dir": "外脑系统训练营\\11-索引之中控系统", "file": "文稿笔记.md", "core": "中控台把常用内容聚到一页，少翻层级。四种用法：常用工作台、标签导航、主题汇总、知识库导航。", "use": "做你档案里那个待办：一个叫“今天答一道题”的桌面快捷方式。"}, {"id": "wn12", "c": "wn", "n": "12 迭代的逻辑", "dir": "外脑系统训练营\\12-迭代的逻辑", "file": "文稿笔记.md", "core": "外脑要维护：清理（每周清空收集箱）、更新（增减）、回顾（专题式、随机漫步，按重要紧急定频率）、挪移（处理历史堆积）。", "use": "周五花 10 分钟清空一次收集箱。"}, {"id": "wn13", "c": "wn", "n": "13 项目管理的逻辑", "dir": "外脑系统训练营\\13-项目管理的逻辑", "file": "文稿笔记.md", "core": "用外脑管人生项目：以年为单位规划，用五维度（年季月周日）统筹，再执行。", "use": "在外脑里建一个流水导出项目页，放 KR 和进度节点。"}, {"id": "wn14", "c": "wn", "n": "14 文件管理的逻辑", "dir": "外脑系统训练营\\14-文件管理的逻辑", "file": "文稿笔记.md", "core": "本地文件只要解决存和找：粗分类架构、桌面中控台、标准化命名（项目名_版本_日期），媒体文件按要素命名。", "use": "定一条回单、流水的文件命名规则写进档案，就是 PBL 的 KR5。"}, {"id": "wn15", "c": "wn", "n": "15 信息管理的逻辑", "dir": "外脑系统训练营\\15-信息管理的逻辑", "file": "文稿笔记.md", "core": "生活琐碎信息也有价值。能自动记就自动记，集中记录；静态信息粗文件夹加标签，动态信息用表格中控台；循序渐进别贪多。", "use": "把银行联系人、账户、还款日这类会变的信息放进一张表。"}, {"id": "wn16", "c": "wn", "n": "16 外脑的大一统", "dir": "外脑系统训练营\\16-外脑的大一统", "file": "文稿笔记.md", "core": "把外脑方法论串成公式；本地部署要解决同步和备份（3-2-1 备份法则）；方法只有用起来才有效。", "use": "检查一次：你的档案和课程资料有没有第二份备份。"}, {"id": "zy01", "c": "zy", "n": "01 职业规划的理念", "dir": "职业规划系统\\01-职业规划的理念", "file": "文稿笔记.md", "core": "很多人迷茫源于普鲁士式教育。职业规划三级火箭：探索期 → 深耕期 → 发展期，路径因人而异，每一阶段都不简单。", "use": "写一句：我现在在哪一级、为什么。"}, {"id": "zy02", "c": "zy", "n": "02 探索期的逻辑", "dir": "职业规划系统\\02-探索期的逻辑", "file": "课程原文.md", "core": "（这课 AI 笔记很短，按课程原文）探索期是进职场头三年，解决生存和找方向：知己（如 SIGN 模型）、知彼（行业、岗位），实操讲感受原则和多量原则。", "use": "写两条：财务 + AI 这个方向里，我喜欢的一点、我擅长的一点。"}, {"id": "zy03", "c": "zy", "n": "03 深耕期的逻辑", "dir": "职业规划系统\\03-深耕期的逻辑", "file": "文稿笔记.md", "core": "按性格、兴趣、价值观选定领域长期积累，深耕经验专业、资源人脉、可迁移能力；在岗的人就在岗位上深耕。", "use": "列出工作里一项可迁移能力（如银行对接、Excel 模板），写一个可展示案例的题目。"}, {"id": "zy04", "c": "zy", "n": "04 发展期的逻辑", "dir": "职业规划系统\\04-发展期的逻辑", "file": "文稿笔记.md", "core": "主业到瓶颈前就要布局第二曲线。收入四支柱：主业、副业、投资、资产（健康、认知、影响力）；主业可纵向晋升或横向叠加能力。", "use": "写一句：AI 流程化能力加可展示案例，就是我在攒的“资产收入”。"}, {"id": "zy05", "c": "zy", "n": "05 执行的注意事项", "dir": "职业规划系统\\05-执行的注意事项", "file": "文稿笔记.md", "core": "执行会遇到三类障碍：方法（循序渐进）、心态（慢反馈，要有成长性思维和精神助推）、时间（提高效率、主动避开不必要的麻烦事）。", "use": "列一件不归你管却总落到你身上的麻烦事，想一句交还或拒绝的话。"}, {"id": "zt-lj1", "c": "zt", "n": "逻辑 01 认识逻辑思维", "dir": "逻辑思维专题课\\01-认识逻辑思维", "file": "课程原文.md", "core": "从“孤岛宝藏”（诚实者和说谎者）的谜题讲起，讲清什么是逻辑、什么是逻辑思维、为什么值得学。", "use": "读完用一句话写：逻辑思维和“感觉对”差在哪。"}, {"id": "zt-lj2", "c": "zt", "n": "逻辑 02 方法篇", "dir": "逻辑思维专题课\\02-逻辑思维（方法篇）", "file": "课程原文.md", "core": "三步：明确概念、提取命题、逻辑推演；推演有演绎、归纳、溯因三种。", "use": "银行说“资料不齐”，先问清“不齐”具体指哪几份（明确概念）。"}, {"id": "zt-lj3", "c": "zt", "n": "逻辑 03 运用篇", "dir": "逻辑思维专题课\\03-逻辑思维（运用篇）", "file": "课程原文.md", "core": "用咖啡店“生意不太好”的案例走一遍：明确概念 → 提取命题 → 三种推理找真相、定策略。", "use": "有人说“这个月账不对”时，先问清“不对”指的是什么。"}, {"id": "zt-lj4", "c": "zt", "n": "逻辑 04 注意事项", "dir": "逻辑思维专题课\\04-逻辑思维的注意事项", "file": "课程原文.md", "core": "演绎要看前提可靠、结构有效；归纳要看样本数量质量和因果；溯因要多列几个解释再检验。", "use": "一笔对不上的账，先列三个可能原因，再逐个查。"}, {"id": "zt-xt1", "c": "zt", "n": "系统 01 认识系统思维", "dir": "系统思维专题课\\01-认识系统思维", "file": "课程原文.md", "core": "眼镜蛇悬赏越治越多，说明真实世界是非线性的。系统 = 要素 + 关联 + 目的 + 环境；系统思维是环形思考、看结构、看变化、看全局。", "use": "想一个“越补越乱”的工作问题，画出它的循环。"}, {"id": "zt-xt2", "c": "zt", "n": "系统 02 如何掌握", "dir": "系统思维专题课\\02-如何掌握系统思维？", "file": "课程原文.md", "core": "意识层：遇到很顺直觉的答案，先想“恐怕没那么简单”。方法层六步：定边界、找要素、理因果、找反馈回路、找杠杆解、出系统方案。", "use": "对“月底总加班”按六步写出要素和一个杠杆点。"}, {"id": "zt-xt3", "c": "zt", "n": "系统 03 注意事项", "dir": "系统思维专题课\\03-系统思维的注意事项", "file": "课程原文.md", "core": "四个局限：边界难定、认知偏差、分析成本高、从看懂到行动有阻力。对策：以终为始从小系统开始、引入多元视角、和线性思维互补并画图、分析利益相关方。", "use": "推一个流程改动前，先列出会受影响的人。"}, {"id": "zt-dy0", "c": "zt", "n": "第一性 00 导言", "dir": "第一性原理专题课\\00-导言", "file": "课程原文.md", "core": "用“电梯太慢、又没预算换”的案例引入：别在原方案上修修补补，回到问题本身。", "use": "找一个你工作里的“慢电梯”问题。"}, {"id": "zt-dy1", "c": "zt", "n": "第一性 01 核心知识", "dir": "第一性原理专题课\\01-第一性原理【核心知识】", "file": "课程原文.md", "core": "笛卡尔三步：归零（用 5Why 找本质）、解构（用公式思维找要素和卡点）、重构（按要素关系出新方案）。", "use": "对“导流水太耗时”连问 5 个为什么。"}, {"id": "zt-dy2", "c": "zt", "n": "第一性 02 扩展用法", "dir": "第一性原理专题课\\02-第一性原理【扩展用法】", "file": "课程原文.md", "core": "把第一性原理迁移到历史、学一项新技能、个人财务管理等日常场景。", "use": "用归零—解构—重构看一次自己的钱怎么管。"}, {"id": "zt-dy3", "c": "zt", "n": "第一性 03 适用边界", "dir": "第一性原理专题课\\03-第一性原理【适用边界】", "file": "课程原文.md", "core": "五个局限：耗时耗资源、依赖专业知识、不适合主观感性问题、可能把复杂系统简化过头、执行难。", "use": "紧急付款这种要快决定的事，不用第一性原理，按清单走。"}, {"id": "sj01", "c": "sj", "n": "10 招时间整理术", "dir": "赠送资料：你一定要学的时间管理书\\10招精通超级时间整理术", "file": "文稿笔记.md", "core": "十招：零散时间法、日程表法（番茄钟）、重点关注法、转化法、奖励法、合作法、效率法、因人制宜法、约束法、反问法。", "use": "用一个 25 分钟番茄钟做今天最难的那件事。"}];
var EPISODES={"zx01": {"id": "zx01", "ep": "第 1 集", "courseLabel": "执行力系统课程 · 01 执行理念", "title": "方法都学了，为什么还是乱？", "scenes": [{"place": "周一 8:40 · 财务室", "who": "旁白", "line": "燕美打开电脑，显示器边上贴满便利贴：贷后资料、回单、工资表、承兑到期。"}, {"place": "8:52 · 电话响了", "who": "银行客户经理", "line": "燕美姐，上次说的贷后资料，这周五前要交齐哦。"}, {"place": "9:10", "who": "燕美（心里）", "line": "我学过时间管理，下过番茄钟，画过四象限，还看了好多“高效习惯”……"}, {"place": "10:30 · 又一通电话", "who": "供应商", "line": "上周那笔货款什么时候能付？我们这边也等着对账。"}, {"place": "11:00", "who": "旁白", "line": "她又打开一篇“自律的 10 个方法”。热血了十分钟，被下一件急事打断。"}, {"place": "17:30 · 下班前", "who": "旁白", "line": "贷后资料只理了一半。便利贴还在，一张都没撕下来。"}], "cliff": "燕美盯着便利贴：是不是我就是不够自律？", "teacher": ["那些方法大多没有问题，都经过很多人实践验证。问题不在方法。", "执行是一个系统问题，系统问题要用系统去解决。头疼医头、脚疼医脚不行：鸡汤和故事能短期提振，长期稳定要从多个因素一起干预。", "影响执行的因素很多：环境、自己的意识、心情、身体状态、计划安排、时间和精力策略、身边的人、当下的事，甚至一个念头。", "所以要搭自己的执行力系统，底层是王阳明的“知行合一”：知 = 觉知，能随时监控、识别、干预自己的行为；行 = 让行为持续、稳定发生的各种策略。"], "source": "执行力系统课程 · 01 执行理念（文稿笔记、课程原文）", "after": [{"place": "17:40", "who": "燕美", "line": "不是我不自律，是我还没有一套自己的执行系统。"}, {"place": "17:42", "who": "旁白", "line": "她撕下一张便利贴，在背面写：今天打断我的是什么？明天先写这个。"}], "quiz": [{"q": "学了很多自我管理方法，执行还是不稳定。按这一课，主要原因是什么？", "options": ["那些方法本身是错的", "执行是一个系统问题，单靠某一个方法解决不了", "人天生懒，没办法", "学的方法还不够多"], "answer": 1, "why": "老师说这些方法“基本上都是没有问题的”，只是持久度和稳定性因人而异；执行是系统问题，要用系统去解决。"}, {"q": "执行力系统里的“知”和“行”分别指什么？", "options": ["知 = 懂得多，行 = 做得多", "知 = 做计划，行 = 每天打卡", "知 = 觉知，能监控、识别、干预自己的行为；行 = 让行为持续稳定发生的策略", "知 = 听课，行 = 写笔记"], "answer": 2, "why": "课程原文：知指觉知，让我们有能力随时对行为作出监控、识别和干预；行指让行为发生的各种策略和方法。"}, {"q": "“头疼医头、脚疼医脚”在这一课里提醒我们什么？", "options": ["多看励志故事就能长期保持执行力", "找到一个最好的方法，坚持用就够了", "短期可以靠激励缓解，长期稳定要从多个因素一起调整和干预"], "answer": 2, "why": "笔记原话：短期执行力提振可通过激励方法实现，长期执行稳定需多维度干预。"}], "task": "拿一件这周一直拖着的活（比如贷后资料），写下今天打断它的 3 个因素，再写一个你已经在用的应对办法。", "taskHint": "因素可以从这些里挑：环境、心情、身体状态、计划安排、身边的人、突发的事、一个念头。10 分钟，写在收集箱就行。"}, "zx02": {"id": "zx02", "ep": "第 2 集", "courseLabel": "执行力系统课程 · 02 执行原理", "title": "第三次放下的那个计划", "scenes": [{"place": "三月 · 某个晚上", "who": "旁白", "line": "燕美刷到同行分享：几十个账户的流水，一键就导出来了。她很羡慕，收藏了教程。"}, {"place": "两天后", "who": "旁白", "line": "教程还在收藏夹里。没人催，也不影响今天的活。"}, {"place": "月底 · 22:00", "who": "旁白", "line": "一个个登网银、选日期、点导出。对账时还错了一笔，返工到深夜。"}, {"place": "22:30", "who": "燕美", "line": "受够了。这次一定要把自动导出学会！"}, {"place": "接下来两晚", "who": "旁白", "line": "装插件、学 RPA，卡在一家银行强制跳浏览器那一步。试了好几次，看不到进展，越弄越烦。"}, {"place": "月初", "who": "旁白", "line": "新的一月忙起来，那晚的难受慢慢淡了。教程又躺回收藏夹。"}], "cliff": "这已经是第三次了。为什么每次都是：热血、卡住、放下？", "teacher": ["福格行为模型：行为要改变，需要动机、能力、提示三样，缺一不可。老师把它叫“改变三角”。", "只是羡慕别人，是“兴趣”念头：有它更好，没有也过得下去，呼之即来、挥之即去。被痛点刺激到，才会变成“刚需”。", "有了刚需，可任务比想象难、看不到正面反馈，信心就会动摇，这是能力不足带来的慢反馈。", "痛苦被时间冲淡、没有持续的提示，热情就散了，这是触发机制不足导致的后劲不足。三样合起来，就是“间歇性凌云壮志，持续性混吃等死”。", "三个角各配一套系统：动力系统管动机，提示系统管持续提醒，任务系统管能力和任务大小。"], "source": "执行力系统课程 · 02 执行原理（文稿笔记、课程原文）", "after": [{"place": "第二天早上", "who": "燕美", "line": "动机：月底熬夜，是刚需，有了。能力：一上来就想全部自动化，切太大了。提示：零，没人提醒。"}, {"place": "8:45", "who": "燕美", "line": "原来不是我不行，是三角缺了两个角。先补一个最小的。"}], "quiz": [{"q": "福格行为模型（改变三角）的三个要素是？", "options": ["目标、计划、复盘", "动机、能力、提示", "时间、精力、注意力", "知识、技能、态度"], "answer": 1, "why": "课程原文：行为动机（Motivation）、行为能力（Ability）、提示触发机制（Triggers），三者缺一不可。"}, {"q": "看到同行一键导流水很羡慕，就想学。按课程，这种动机属于？", "options": ["刚需，一定能坚持", "兴趣念头：有它更好、没有也过得下去，容易挥之即去", "已经是执念了"], "answer": 1, "why": "老师用“看别人弹钢琴很优雅也想学”举例：这只是承载美好期望的兴趣念头，是非常微弱的动机。"}, {"q": "痛下决心开始学，却卡在一步、看不到进展，于是开始动摇。三角里哪个角出了问题？", "options": ["动机", "能力：任务比想象难，没有正面反馈", "提示"], "answer": 1, "why": "课程原文：做这件事比想象中困难得多，又收不到正面反馈，执行信心就会动摇，这是行为能力不足带来的慢反馈。"}], "task": "拿本月一件“计划了没做到”的事，给动机、能力、提示各打 1 到 5 分，写下最弱那一角的一个小改法。", "taskHint": "比如：能力弱，就把“全部自动化”改成“这周只跑通一家银行的一种文件”；提示弱，就设一个固定提醒。10 分钟。"}, "rs06": {"id": "rs06", "ep": "第 3 集", "title": "忙完一天，脑子里什么都没留下", "courseLabel": "人生规划罗盘 · 06 复盘", "rec": true, "scenes": [{"place": "周五 18:20 · 财务室", "who": "旁白", "line": "燕美关掉最后一个网银窗口。今天导了流水、回了三家银行、催了两笔付款，忙得脚不沾地。"}, {"place": "18:25", "who": "燕美", "line": "总算下班了。明天再想明天的事吧。"}, {"place": "周六上午 · 家里", "who": "旁白", "line": "她刷手机，又看到别人晒“每日复盘”。她也买过日记本，写了三天就停了。"}, {"place": "下周一 9:05", "who": "旁白", "line": "银行又来催同一份贷后说明。燕美愣住：这事上周五不是处理过了吗？"}, {"place": "9:08", "who": "燕美（心里）", "line": "我明明做过……可具体怎么回复的、卡在哪一步，一点都想不起来。"}, {"place": "9:15", "who": "旁白", "line": "她翻聊天记录、翻邮件，花了二十分钟才拼出经过。便利贴上又多了一句：别再忘了。"}], "cliff": "每天都很忙，为什么一转身就忘？复盘是不是只有“很会写日记的人”才做得到？", "teacher": ["复盘不是写长日记，是向内的工具：把一天里学习、工作、生活的事过一遍，像孔子说的“吾日三省吾身”。", "它要干三件事：看见今天发生了什么、记下真正重要的感悟、并且直接生成明天的计划——复盘的终点不是感慨，是下一步动作。", "最好和晨间清单配合：早上定三件最重要的事，晚上用两三行收回来。早晚各一次，负担很小，但能把“忙”变成“有迹可循”。", "常青老师自己靠复盘日记一路走过来。坚持的威力不在某一天写得多漂亮，而在你盯住“因”：今天卡住的原因是什么、明天改哪一小步。", "所以别追求完美格式。今晚先写三行就够：做完了什么、卡住的事、一句话收获。写完，明天的计划也就有了着落。"], "source": "人生规划罗盘 · 06 复盘（文稿笔记核心要点；配合每日复盘卡）", "after": [{"place": "当晚 21:40", "who": "燕美", "line": "我不是不会复盘，是把复盘想成了写作文。其实只要三行。"}, {"place": "21:42", "who": "旁白", "line": "她打开表格，写下：做完了——回三家银行；卡住——贷后说明没有固定模板；收获——催过的事也要留一句“怎么回的”。"}, {"place": "21:45", "who": "燕美", "line": "明天晨间三件事的第一件：把贷后说明做成可复用的两句话模板。"}], "quiz": [{"q": "按这一课，复盘首先是什么？", "options": ["把一天的流水账写得很长", "向内的工具：总结一天，留下感悟，并生成明天的计划", "只在周末做一次的大型总结", "专门用来自我批评的仪式"], "answer": 1, "why": "文稿笔记要点：复盘是向内的工具，从学习、工作、生活总结一天，记下重要感悟，直接生成明天的计划。"}, {"q": "复盘和晨间清单怎么配合最好？", "options": ["只在早上写，晚上不用管", "只在出差时才写", "早晚各一次：晨间定事，晚间收回来", "必须写成和老师一样的长篇日记"], "answer": 2, "why": "笔记要点：和晨间清单配合，早晚各一次。早上定向，晚上复盘，形成闭环。"}, {"q": "刚开始做每日复盘，最合适的起步是？", "options": ["先设计完美模板再动笔", "今晚按每日卡写三行（做完了什么、卡住的事、一句话收获）", "先把过去一年的事全部补写完", "只在心里想一想，不要写下来"], "answer": 1, "why": "课程落地建议就是“今晚按每日卡写三行复盘”；先用起来，再慢慢加字段。"}], "task": "今晚打开你的每日复盘表（或一张纸），写三行：①做完了什么 ②卡住的事 ③一句话收获；并据此写下明天最重要的 1 件事。", "taskHint": "字段可参考：心情/精力可选填。10 分钟内写完就打勾，不追求文笔。写完那 1 件明天的事，复盘才算闭环。"}};
Object.assign(EPISODES,{"zx03":{"id":"zx03","title":"愿望清单为什么总在吃灰","courseLabel":"执行力系统课程 · 03 动力系统","scenes":[{"place":"周日晚上 · 家里","who":"旁白","line":"燕美在本子上写下新年愿望：学会自动导流水、每天复盘、把账户整理清楚。"},{"place":"周一 9:00 · 财务室","who":"旁白","line":"三十几个账户，一个个登网银。愿望那页本子，压在抽屉最底下。"},{"place":"周三 21:30","who":"燕美","line":"又加班。其实我挺想学自动化的……就是总提不起劲。"},{"place":"周五 · 茶水间","who":"同事小林","line":"你上次说要学 RPA，学得怎么样啦？"},{"place":"周五 · 工位","who":"燕美（心里）","line":"我是真想学，可“想”好像从来推不动我。"}],"cliff":"明明很想改变，为什么“想”就是变不成“做”？","teacher":["动力来自刺激点：痛点越痛、爽点越爽，人越愿意改变。没刺激，人会自然维持现状。","愿望不等于刚需。愿望是“有更好、没有也行”；刚需是“没有它吃饭都不香”。只有刚需级的动机才扛得住日常的消耗。","把愿望炼成执念有三步：具体化——写清到底痛在哪、爽在哪；可视化——把它变成看得见的画面、贴在眼前；重复化——每天反复看见、反复提醒。","可以建一个“动力种子清单”：把真实刺激过你的痛点、爽点攒起来，没劲的时候翻一翻。","如果对什么都无感，多往下看看人间辛苦，也多往上看看更好的生活，把人生边界打开，刺激点自然会出现。"],"source":"执行力系统课程 · 03 动力系统（按课程要点改写）","after":[{"place":"周五 22:00","who":"燕美","line":"我写的是“想学自动化”，太虚了。真正痛的是：月底熬到十一点，还对错一笔。"},{"place":"22:05","who":"旁白","line":"她把那句话改成：“下个月末，我不想再一个个点导出。”打印出来，贴在显示器边框上。"}],"quiz":[{"q":"按这一课，人最愿意改变的时候是？","options":["心情好的时候","制定完计划的时候","被痛点或爽点强烈刺激的时候","别人夸奖的时候"],"answer":2,"why":"动力来自刺激点：痛点越痛、爽点越爽，改变的意愿越强。"},{"q":"“想学自动导流水，学会更好，不学也能过”，这属于？","options":["刚需","执念","习惯","愿望"],"answer":3,"why":"有更好、没有也过得下去，是愿望；刚需是不解决就难受。"},{"q":"把愿望变成执念的三个办法是？","options":["具体化、可视化、重复化","早起、打卡、发朋友圈","列清单、定奖励、找监督","多看书、多听课、多记笔记"],"answer":0,"why":"老师给的三板斧：具体化、可视化、重复化。"}],"task":"把一件“一直想做没做”的工作改进，写成一句具体的痛点（时间、场景、后果都写上），设成壁纸或贴在显示器上。","taskHint":"例：“每月最后一天 22:00 还在一家家登网银，对错一笔要返工。”越具体越好，10 分钟。","ep":"第 4 集"},"zx04":{"id":"zx04","title":"热血三天后，就忘了","courseLabel":"执行力系统课程 · 04 提示系统","scenes":[{"place":"周一 8:50","who":"旁白","line":"显示器边框上贴着那句痛点。燕美看了一眼，打开影刀教程，学了半小时。"},{"place":"周二","who":"旁白","line":"银行来电、供应商催款、厂长要报表。教程一眼没看。"},{"place":"周四","who":"旁白","line":"那张纸被文件夹挡住了一半。"},{"place":"下周一","who":"燕美（心里）","line":"咦，我上周是不是说过要学什么来着？"},{"place":"10:20 · 工位","who":"旁白","line":"她的电脑桌面上，最显眼的是微信和购物网站。"}],"cliff":"痛点也找到了，为什么热情还是三天就散？","teacher":["大脑有三个特性在跟你作对：保护属性——会冲淡激动的情绪，让你回到平常状态；遗忘属性——不提醒就忘；适应属性——会被周围环境带着走。","对付保护属性，用鲶鱼效应往外借力：激励者（给你压力或倒逼你的人）、陪伴者（一起做的人，最管用）、引导者（走在前面的导师或榜样）。","对付遗忘，用触发机制：闹钟、便利贴、日历推送，让任务在对的时间自己跳出来。反过来，也可以把坏习惯的触发物藏起来。","对付环境影响，改造环境场：把要做的事放在最顺手的地方，把干扰的东西挪远。孟母三迁就是在换环境场。"],"source":"执行力系统课程 · 04 提示系统（按课程要点改写）","after":[{"place":"周一 10:30","who":"燕美","line":"我不是记性差，是没给自己装“提醒”。"},{"place":"10:35","who":"旁白","line":"她把影刀快捷方式拖到桌面正中，设了每周二、四 17:00 的闹钟，还约了会 RPA 的同行每周互报进度。"}],"quiz":[{"q":"热情几天后自然变淡，按这一课对应大脑的哪个特性？","options":["遗忘属性","适应属性","懒惰属性","保护属性"],"answer":3,"why":"保护属性会让激动的情绪回归平均水平，所以要靠外部力量续上。"},{"q":"鲶鱼效应里，老师特别强调最管用的一种角色是？","options":["陪伴者","激励者","引导者","旁观者"],"answer":0,"why":"陪伴者：一起做、互相看见进度，最容易让人坚持下去。"},{"q":"把影刀快捷方式放到桌面中间、把购物网站挪走，这是在？","options":["设置最终幻想","改造环境场","做三段式任务","写复盘"],"answer":1,"why":"环境会影响行为，把要做的事放顺手、把干扰挪远，就是在设计环境场。"}],"task":"给明天最重要的一件事设一个定时提醒，并把它要用的文件或表格放到桌面最显眼的位置。","taskHint":"例：明早 9:00 闹钟“付款审批”，审批表拖到桌面左上角。再想一个可以每周互报进度的人。10 分钟。","ep":"第 5 集"},"zx05":{"id":"zx05","title":"一打开就想关掉的月报","courseLabel":"执行力系统课程 · 05 任务系统","scenes":[{"place":"月初 9:00","who":"厂长老张","line":"燕美，月报这周五前给我。"},{"place":"9:05","who":"燕美（心里）","line":"月报要汇总三十个账户、核对往来、写说明……光想就头大。"},{"place":"9:10","who":"旁白","line":"她先回了几条微信，又顺手整理了一下桌面。"},{"place":"14:00","who":"旁白","line":"月报文件还是没打开。下午被各种小事填满。"},{"place":"周四 20:00","who":"燕美","line":"明天就要交了，我现在才开始……"}],"cliff":"知道该做，却怎么也开不了头。是我太懒吗？","teacher":["游戏让人停不下来，是因为任务系统做得好：任务清晰、自动推送、难度刚好“有挑战但能完成”。","任务推送：提前把任务排进计划，到点直接做，省掉“现在该干嘛”的决策消耗。","弹性匹配，做三段式任务量：基础量（状态差也能完成）、正常量、冲刺量。按当天状态选档，不至于一卡就全盘放弃。","临门一脚想逃时，用最小动作：只做第一个 5 分钟的小动作，比如“打开模板”；或用最终幻想：想象做完后的轻松。","做完立刻给激励：打勾、进度条、一杯奶茶都可以。精神激励和物质激励搭配着用。"],"source":"执行力系统课程 · 05 任务系统（按课程要点改写）","after":[{"place":"周四 20:10","who":"燕美","line":"先不想“写完月报”，只做一件事：打开模板，把三十个账户名粘进去。"},{"place":"20:40","who":"旁白","line":"名字粘完，她顺手把前十个账户的余额也填了。原来开头才是最难的那一步。"}],"quiz":[{"q":"三段式任务量指的是？","options":["基础量、正常量、冲刺量","上午、下午、晚上","计划、执行、复盘","简单、困难、地狱"],"answer":0,"why":"按当天状态选档：状态差做基础量，状态好冲一冲。"},{"q":"一想到月报就想逃，最推荐的第一步是？","options":["等有整块时间再做","先做一个 5 分钟的最小动作，比如打开模板","先刷会手机放松一下","把整件事一次做完"],"answer":1,"why":"最小动作把开始的门槛压到最低，开了头就容易继续。"},{"q":"游戏里的任务让人上瘾，下面哪一条不是原因？","options":["任务清晰","难度刚好能完成","任务越难越多越好","完成后有即时反馈"],"answer":2,"why":"难度要匹配：有挑战、能完成。太难只会让人放弃。"}],"task":"把今天最难的一件事切成基础、正常、冲刺三档，写下第一步的 5 分钟最小动作，现在就做完这一步。","taskHint":"例：月报——基础：填完余额表；正常：加往来核对；冲刺：写完说明。最小动作：打开模板。做完给自己打个勾。","ep":"第 6 集"},"zx06":{"id":"zx06","title":"崩了一上午，全天都不想干了","courseLabel":"执行力系统课程 · 06 综合状态","scenes":[{"place":"周三 9:00","who":"旁白","line":"燕美计划今天：上午对账，下午学一小时 RPA，晚上写复盘。"},{"place":"9:30","who":"银行客户经理","line":"燕美姐，有笔回单对不上，你马上来核一下。"},{"place":"11:50","who":"旁白","line":"对账没动。她刷到同龄人升职加薪的消息，心里一沉。"},{"place":"12:30","who":"燕美（心里）","line":"上午全废了，下午学 RPA 也没意思了。今天就这样吧。"},{"place":"21:00","who":"旁白","line":"刷了一晚上视频。睡前她很自责：我怎么又这样。"}],"cliff":"一段崩了就全天崩，然后自责。这个循环怎么破？","teacher":["有四种状态会毁掉执行：任务反馈慢带来的失望、放纵之后的自责、身体和精力的波动、外界刺激带来的焦虑。","失望：先知道执行有周期，前期反馈慢很正常，做好预期管理，再配一套对冲的小激励。","自责：提前预判容易失控的场景；真失控了就止损——把一天切成几个时间模块，并联而不是串联，崩一段就到下一个节点重启。之后和自己和解，不要反复鞭打自己。","身体波动：管好睡眠和精力，可以借助咖啡、茶这类外物；把关键任务固化成习惯。","焦虑：减少刺激，少看让你焦虑的信息源；从小处入手提升掌控感，日拱一卒；也可以用冥想、复盘、倾诉来减压。"],"source":"执行力系统课程 · 06 综合状态（按课程要点改写）","after":[{"place":"21:10","who":"燕美","line":"上午崩了，只是上午那一块崩了。下午那一块其实还能救。"},{"place":"21:15","who":"旁白","line":"她把明天分成三块：上午、午饭后、晚饭后。在便利贴上写：“崩了就等下一个饭点重启。”"}],"quiz":[{"q":"“一段崩了就全天放弃”，问题出在把时间安排成了？","options":["并联","串联","倒序","随机"],"answer":1,"why":"串联时一环断全断；把一天切成模块并联，崩一段只放弃那一段。"},{"q":"放纵之后很自责，课程建议怎么做？","options":["狠狠惩罚自己","干脆放弃计划","止损重启，再和自己和解","等心情好了再说"],"answer":2,"why":"止损 + 和解：及时在下一个节点重启，接纳自己，不陷入自责循环。"},{"q":"刷到同龄人的消息变得焦虑，对应的对策是？","options":["多看几条找安慰","立刻定一个大目标","熬夜加班追上","减少焦虑信息的刺激，从小处提升掌控感"],"answer":3,"why":"减少刺激 + 提升掌控：少接触负面信息，日拱一卒找回掌控感。"}],"task":"把明天分成 3–4 个时间模块，写下每块只做的一件事，再写一句“崩了就在 ___ 重启”。","taskHint":"重启点建议用饭点或固定时刻（如 12:30、18:30）。10 分钟。","ep":"第 7 集"},"zx07":{"id":"zx07","title":"第三周，开始觉得没意思了","courseLabel":"执行力系统课程 · 07 加餐·执行力周期","scenes":[{"place":"学 RPA 第 1 周","who":"旁白","line":"燕美每天都很兴奋，跑通一个账户就截图发给小林。"},{"place":"第 3 周","who":"旁白","line":"同样的报错一遍遍出现，新鲜感没了，每天打开软件都像上班打卡。"},{"place":"第 5 周","who":"燕美（心里）","line":"好像也没那么难受了，可也没什么感觉，就是机械地做。"},{"place":"第 6 周 · 周五","who":"同事小林","line":"你那个自动导出还在弄吗？"},{"place":"工位","who":"燕美","line":"在弄……但我有点想停了。"}],"cliff":"从热血到麻木，是不是说明这件事不适合我？","teacher":["做任何事都会经历四个时期：新鲜期、疲劳期、麻木期、内化期。疲劳和麻木不是你不行，是规律。","撑过疲劳期，要给事情加多重意义：不只是“学会一项技能”，还可以是“少熬一次夜”“在厂长面前有底气”“给自己证明一次”。","把“想”变成“做”：不去反复琢磨要不要继续，直接按计划做今天的那一小步。","适当借助外部激励：找人陪、公开承诺、完成后奖励自己，帮你熬到内化期，那时它就成了习惯，不再费劲。"],"source":"执行力系统课程 · 07 加餐·执行力周期（按课程要点改写）","after":[{"place":"周五 18:00","who":"燕美","line":"我现在是麻木期，不是“不适合”。再往前就是内化期。"},{"place":"18:05","who":"旁白","line":"她在本子上写下第二条意义：“月底能准点回家吃饭。”然后照常打开了软件。"}],"quiz":[{"q":"执行力周期的四个时期，顺序正确的是？","options":["新鲜期 → 内化期 → 疲劳期 → 麻木期","疲劳期 → 新鲜期 → 内化期 → 麻木期","新鲜期 → 疲劳期 → 麻木期 → 内化期","麻木期 → 疲劳期 → 新鲜期 → 内化期"],"answer":2,"why":"新鲜、疲劳、麻木，熬过去才到内化。"},{"q":"学了几周开始觉得没意思，最可能的原因是？","options":["这件事不适合你","方法完全错了","你天生没毅力","进入了疲劳期或麻木期，这是正常规律"],"answer":3,"why":"疲劳、麻木是每件事的必经阶段，不代表不适合。"},{"q":"下面哪一项属于“多重意义加持”？","options":["给学 RPA 再加一条意义：月底准点回家吃饭","换一个新软件重新开始","等热情回来再做","每天多学三小时"],"answer":0,"why":"多给事情几层意义，单一意义淡了还有别的撑着。"}],"task":"判断你对“学这套课”现在处在哪一期，再写一条“想学好”以外的意义。","taskHint":"例：疲劳期；意义——“少熬一次夜对账”“遇到银行问题能自己判断”。写在复盘表里，10 分钟。","ep":"第 8 集"},"xx01":{"id":"xx01","title":"一篇文章读了三遍还是没抓住","courseLabel":"学习力闭环训练营 · 01 理解力","scenes":[{"place":"周二 · 午休","who":"旁白","line":"银行发来一份新的贷款政策文件，十几页。厂长让燕美看看对公司有什么影响。"},{"place":"13:00","who":"燕美","line":"从第一个字开始读……读到第三页，前面讲什么已经忘了。"},{"place":"13:40","who":"旁白","line":"她又从头读了一遍，划了一堆重点，几乎每行都划了。"},{"place":"14:00","who":"厂长老张","line":"看完了吗？有什么要注意的？"},{"place":"14:01","who":"燕美（心里）","line":"我……说不上来。"}],"cliff":"认真读了好几遍，为什么还是抓不住重点？","teacher":["理解力就是从信息里快速、准确地抓到重点。它受两样东西限制：背景知识和工作记忆。","工作记忆一次大约只能处理 7±2 个信息块，一字一句平均用力，脑子很快就满了。","解决办法是框架学习法：先抓主线——这份东西要回答什么问题？再抓重点。","抓重点的小技巧：看首句首段和结论，找“因此”“总之”这类结论性关键词，看加粗字和小标题。一段内容通常就是主题、论点、理由三样。"],"source":"学习力闭环训练营 · 01 理解力（按课程要点改写）","after":[{"place":"14:10","who":"燕美","line":"我先只看小标题和每段第一句，找跟“我们公司”有关的。"},{"place":"14:30","who":"旁白","line":"她给厂长三条：利率下调、需要补充两份材料、截止日期是月底。"}],"quiz":[{"q":"工作记忆的容量大约是？","options":["3±1 个信息块","20 个左右","7±2 个信息块","没有限制"],"answer":2,"why":"米勒的“神奇数字 7±2”：一次能处理的信息块有限。"},{"q":"读一份长文件，按框架学习法第一步应该？","options":["从第一个字开始逐字读","把所有内容都划线","先背下来","先找主线：这份东西要回答什么问题"],"answer":3,"why":"先抓主线，再抓重点。"},{"q":"下面哪个不是抓重点的小技巧？","options":["从最后一页倒着逐字读","看首句首段和结论","找结论性关键词","看加粗字和小标题"],"answer":0,"why":"首句、结论、关键词、加粗、小标题，是快速定位重点的抓手。"}],"task":"找一份你最近要看的工作文件或通知，只看标题、每段首句和加粗字，用三句话写出它的重点。","taskHint":"写完再回头核对一下有没有漏掉关键信息。10 分钟。","ep":"第 9 集"},"xx06":{"id":"xx06","title":"段落那么长，中心句在哪","courseLabel":"学习力闭环训练营 · 加餐1 理解力卡点","scenes":[{"place":"周四 · 午休","who":"旁白","line":"燕美在看一篇讲“财务数字化”的长文章，想找点思路。"},{"place":"12:30","who":"燕美（心里）","line":"每个字都认识，一段读完却不知道它想说啥。"},{"place":"12:40","who":"旁白","line":"文章前半部分在批评传统做法，后半部分在讲新方法。她把两部分混在一起看，越看越乱。"},{"place":"12:50","who":"燕美","line":"我是不是读得太慢了？"}],"cliff":"字都认识，为什么一段读完还是不知所云？","teacher":["读文章分四层：词、句、段、篇。卡住的往往不是词，而是没看出段和篇的结构。","每段找中心句和支撑句：中心句是观点，支撑句是理由、例子、数据。先找中心句，支撑句可以快读。","带着主线问题去读：比如“这篇文章能给我的对账流程什么启发”，和问题无关的段落可以跳过。","注意“破—立”结构：很多文章先破（批评旧观点），再立（提出新观点）。分清哪部分在破、哪部分在立，就不会乱。"],"source":"学习力闭环训练营 · 加餐1 理解力卡点（按课程要点改写）","after":[{"place":"13:00","who":"燕美","line":"前半篇是“破”，后半篇才是“立”。我要的是“立”的那部分。"},{"place":"13:10","who":"旁白","line":"她只精读后半篇每段的中心句，抄下了两条能用的思路。"}],"quiz":[{"q":"一段话里，表达观点的是？","options":["支撑句","过渡句","例子","中心句"],"answer":3,"why":"中心句是观点，支撑句给理由和例子。"},{"q":"文章先批评旧做法，再提出新方法，这是？","options":["破—立结构","总分结构","并列结构","时间顺序"],"answer":0,"why":"先破后立，分清两部分，理解就清楚了。"},{"q":"“带着主线问题去读”的好处是？","options":["读得更慢更细","知道哪些段落重要、哪些可以跳过","不用找中心句","可以只看标题"],"answer":1,"why":"有问题做导航，阅读更有方向。"}],"task":"找一篇你收藏没读完的文章，带着一个具体问题读，每段只标出中心句，最后写一句它对你的启发。","taskHint":"问题例：“这对我的月底对账有什么帮助？”10 分钟。","ep":"第 10 集"},"xx02":{"id":"xx02","title":"笔记抄了一大本，用不上","courseLabel":"学习力闭环训练营 · 02 提炼力","scenes":[{"place":"周日 · 家里","who":"旁白","line":"燕美翻开学习笔记本：密密麻麻，全是从课程里抄下来的原话。"},{"place":"15:00","who":"燕美（心里）","line":"抄的时候觉得都很有道理……"},{"place":"周一 · 银行来电","who":"银行客户经理","line":"燕美姐，我们这个月想给你们推荐一款新产品，送一次免费的财务培训。"},{"place":"10:05","who":"旁白","line":"燕美隐约觉得这里面有课上讲过的什么原理，可就是想不起来。"}],"cliff":"笔记记了很多，为什么到了要用的时候一句也想不起来？","teacher":["提炼力是把作者的知识变成自己的。心法叫“六经注我”：不是我去给书做注解，而是让书为我所用。","具体五招：第一，提炼触点——只挑真正触动你、改变你认知的点，用自己的话重写。","第二，关联案例——这个点能解释哪些身边的现象？第三，能用在哪——我可以在什么场景用它？","第四，注意边界——它在什么条件下不成立？第五，纳入体系——放进你自己的知识框架里。","比如“互惠原则”：先送你东西，你就不好意思拒绝。银行送免费培训，就是一个现成案例。"],"source":"学习力闭环训练营 · 02 提炼力（按课程要点改写）","after":[{"place":"10:20","who":"燕美","line":"送培训→我欠人情→不好意思拒绝产品。这就是互惠！"},{"place":"10:25","who":"旁白","line":"她客气地收下培训邀请，但跟客户经理说：产品要等比较完三家再定。"}],"quiz":[{"q":"“六经注我”的意思是？","options":["逐字逐句给书做注解","多读经典","背诵原文","让知识为我所用，用自己的话重构"],"answer":3,"why":"以我为主，让知识服务于自己的问题。"},{"q":"提炼力的第一招是？","options":["提炼触点：挑出真正触动你的点","纳入体系","注意边界","关联案例"],"answer":0,"why":"先筛选触点，再加工。"},{"q":"“互惠原则在什么情况下不成立”，属于哪一招？","options":["关联案例","注意边界","能用在哪","纳入体系"],"answer":1,"why":"找知识的适用条件和失效条件，就是注意边界。"}],"task":"从你最近学的一课里挑 1 个触点，按五招各写一句：触点、案例、能用在哪、边界、放进哪个体系。","taskHint":"一行一招，五行写完就打勾。10 分钟。","ep":"第 11 集"},"xx03":{"id":"xx03","title":"学过的道理，到了现场就想不起来","courseLabel":"学习力闭环训练营 · 03 迁移力","scenes":[{"place":"周三 · 财务室","who":"旁白","line":"上周燕美刚学完“互惠原则”，还在笔记里写了五招。"},{"place":"10:00","who":"供应商","line":"燕美姐，这批货我们先给你们开票，款不急。顺便，下个月涨价的事……"},{"place":"10:15","who":"旁白","line":"挂了电话，燕美才反应过来：这不就是互惠吗？可刚才她已经答应考虑涨价了。"},{"place":"10:20","who":"燕美（心里）","line":"学的时候都懂，到用的时候就是想不起来。"}],"cliff":"知识明明学过，为什么到了现场就是“想不起来”？","teacher":["只能认出来、用不出来的知识，叫惰性知识；能在现场被调出来用的，叫活性知识。迁移力，就是把惰性知识变成活性知识。","练法一，理论找理论：学一个新理论，找找它和你已知的哪个理论相通或相反。","练法二，理论找案例：给每个理论找几个身边的案例，越多越容易在现场被唤醒。","练法三，案例找理论：遇到一件事，主动问“这能用哪个道理解释”。","练法四，结构性迁移：把一个领域的结构搬到另一个领域，比如把游戏的任务系统搬到工作计划里。"],"source":"学习力闭环训练营 · 03 迁移力（按课程要点改写）","after":[{"place":"10:30","who":"燕美","line":"我只记了理论，没给它配足够多的案例。"},{"place":"10:40","who":"旁白","line":"她在“互惠”下面补了三个案例：银行送培训、供应商先开票、客户送月饼。下次电话再来，她一下就认出来了。"}],"quiz":[{"q":"只能认出来、却用不出来的知识叫？","options":["惰性知识","活性知识","隐性知识","元知识"],"answer":0,"why":"迁移力就是把惰性知识变成活性知识。"},{"q":"遇到供应商先开票，主动想“这能用哪个道理解释”，这是哪种练法？","options":["理论找理论","案例找理论","理论找案例","结构性迁移"],"answer":1,"why":"从案例出发找理论，是案例找理论。"},{"q":"把游戏任务系统的结构用到工作计划上，属于？","options":["理论找案例","理论找理论","结构性迁移","死记硬背"],"answer":2,"why":"把一种结构搬到别的领域，就是结构性迁移。"}],"task":"选一个你学过的理论（比如互惠、福格模型），给它找 3 个你工作中真实发生过的案例。","taskHint":"案例越具体越好：谁、什么事、哪一步对上了理论。10 分钟。","ep":"第 12 集"},"xx04":{"id":"xx04","title":"昨天背的步骤，今天又忘了","courseLabel":"学习力闭环训练营 · 04 记忆力","scenes":[{"place":"周一","who":"旁白","line":"同行教燕美影刀 RPA 的 12 个步骤。她认真记在手机备忘录里。"},{"place":"周二","who":"燕美（心里）","line":"第 5 步是什么来着？"},{"place":"周三","who":"旁白","line":"她翻备忘录，发现记的全是零散的点，看不出顺序和原因。"},{"place":"周三 23:00","who":"旁白","line":"熬夜硬背了一遍。第二天起来，又忘了一半。"}],"cliff":"明明很认真记了，为什么就是记不住？","teacher":["记忆有六板斧：高集中、强刺激、有逻辑、超连接、场景化、高重复。","高集中：一次只记一件事，目标要清楚。强刺激：多感官参与，看、听、动手做。","有逻辑：找到规律和意义，比死记好记得多。超连接：和已经会的东西挂上钩。","场景化：在真实使用的场景里记。高重复：按间隔反复复习，长期记忆才会形成。","学之前给自己一点仪式感、带着问题去学；累了就休息，硬熬效果最差。"],"source":"学习力闭环训练营 · 04 记忆力（按课程要点改写）","after":[{"place":"周四 21:00","who":"燕美","line":"12 步其实就是三段：登录、筛选、导出，每段 4 步。"},{"place":"21:20","who":"旁白","line":"她对着真实网银走了一遍，边做边说出每一步。周六又复习了一次，再没忘过。"}],"quiz":[{"q":"下面哪个不是记忆六板斧之一？","options":["高集中","熬夜突击","强刺激","高重复"],"answer":1,"why":"熬夜硬背违反“累了就休息”，效果最差。"},{"q":"把 12 个步骤归成三段，用到的是？","options":["强刺激","高重复","有逻辑：找规律和结构","仪式感"],"answer":2,"why":"有逻辑的信息比零散信息好记得多。"},{"q":"对着真实网银边做边记，属于？","options":["超连接","高集中","强刺激","场景化"],"answer":3,"why":"在真实使用场景里记忆，提取时更容易想起来。"}],"task":"选一个你总记不住的流程，把它分成 2–4 段，在真实场景里边做边说一遍，并在日历里设两次复习提醒。","taskHint":"复习间隔建议：第 2 天、第 7 天。10 分钟。","ep":"第 13 集"},"xx05":{"id":"xx05","title":"课都学完了，还是不会用","courseLabel":"学习力闭环训练营 · 05 应用力","scenes":[{"place":"周五","who":"旁白","line":"燕美把学习力课程都看完了，笔记做得很漂亮。"},{"place":"下周一","who":"厂长老张","line":"下个月要接新系统，你学一下，教教大家。"},{"place":"周一 14:00","who":"燕美（心里）","line":"理解力、提炼力、迁移力……我都学过，可面对新系统，还是不知道从哪下手。"},{"place":"周一 18:00","who":"旁白","line":"她打开新系统的说明书，又开始一页页地读。"}],"cliff":"学了那么多方法，为什么一到真事上就不会用了？","teacher":["知识的最高境界是“无招胜有招”：招式忘了，能力还在。这要靠把显性知识，通过实践变成隐性能力。","只学不用，是纸上谈兵；只用不学，是低水平重复。要学用结合。","刻意练习有五种场景：学习中练提炼、生活中练迁移、复盘中写复盘日记、模拟中做沙盘推演、自检中用清单训练。","就像看菜谱学不会做菜，必须下厨做几次，才知道火候。"],"source":"学习力闭环训练营 · 05 应用力（按课程要点改写）","after":[{"place":"18:10","who":"燕美","line":"我先列一张自检清单：读系统说明书时，主线是什么？重点在哪？能用在哪？"},{"place":"18:30","who":"旁白","line":"她按清单走了一遍，再在测试账号上把常用操作实际点了三次。"}],"quiz":[{"q":"“无招胜有招”指的是？","options":["什么都不用学","只学一招","招式忘了，能力已经内化","随便做"],"answer":2,"why":"显性知识通过实践变成隐性能力。"},{"q":"只学不用的问题是？","options":["低水平重复","学得太少","太累","纸上谈兵，知识用不出来"],"answer":3,"why":"只学不用是纸上谈兵；只用不学是低水平重复。"},{"q":"下面哪个不属于五种刻意练习场景？","options":["等别人教","复盘中","模拟中","自检中"],"answer":0,"why":"五种场景：学习中、生活中、复盘中、模拟中、自检中。"}],"task":"选一个你学过的方法，写一张 3 条以内的自检清单，下次做相关工作时照着用一次。","taskHint":"例：读文件清单——①主线是什么 ②重点三条 ③和我有什么关系。10 分钟。","ep":"第 14 集"},"xx07":{"id":"xx07","title":"笔记再加工，有没有省力的办法","courseLabel":"学习力闭环训练营 · 加餐2 提炼迁移力打通","scenes":[{"place":"周日 · 家里","who":"旁白","line":"燕美攒了一个月的课程笔记，想按“提炼五招”再加工一遍。"},{"place":"14:00","who":"燕美（心里）","line":"每条都要写触点、案例、能用在哪、边界、体系……一条要半小时。"},{"place":"15:30","who":"旁白","line":"只加工了三条，她已经很累了。"},{"place":"15:40","who":"燕美","line":"这样下去，我又要放弃了。"}],"cliff":"提炼和迁移很有用，可太费劲了，能不能简化？","teacher":["对笔记再加工的核心还是那几步：用自己的话压缩概括、关联案例、能用在哪、适用边界、纳入体系。","但工作流可以简化：不是每条笔记都要五步走完。重要的、常用的做全套，其他的先只做“一句话概括 + 一个案例”。","也可以让 AI 辅助：让它帮你压缩、举例、找边界，你只负责判断和改成自己的话。","关键是持续做下去，而不是一次做完美。"],"source":"学习力闭环训练营 · 加餐2 提炼迁移力打通（按课程要点改写）","after":[{"place":"15:50","who":"燕美","line":"先给每条笔记写一句话和一个案例，打上星号的再做全套。"},{"place":"16:30","who":"旁白","line":"她让 AI 先帮忙列了几个案例草稿，自己挑出真正发生过的，改成自己的话。"}],"quiz":[{"q":"笔记加工的第一步通常是？","options":["用自己的话压缩概括","全文复制","直接纳入体系","先找边界"],"answer":0,"why":"先用自己的话压缩，才算真正过了脑子。"},{"q":"笔记太多加工不过来，课程建议？","options":["全部放弃","简化工作流，重要的做全套，其他先做简版","每条都做五步","只收藏不加工"],"answer":1,"why":"按重要程度分级加工，持续比完美更重要。"},{"q":"让 AI 辅助提炼时，你自己最该负责的是？","options":["什么都不用管","复制 AI 的结果","判断和改成自己的话","让 AI 替你学"],"answer":2,"why":"AI 可以帮你起草，判断和内化还得靠自己。"}],"task":"从你的笔记里挑 5 条，每条写一句话概括 + 一个真实案例；挑出最重要的 1 条打星号。","taskHint":"可以让 AI 先帮你起草，再改成自己的话。10 分钟。","ep":"第 15 集"},"rs00":{"id":"rs00","title":"一个人走出来的路","courseLabel":"人生规划罗盘 · 00 开营仪式","scenes":[{"place":"周六 · 家里","who":"旁白","line":"燕美打开“人生规划罗盘”的第一课。老师讲自己的故事：学历不高，曾经很迷茫。"},{"place":"10:10","who":"燕美（心里）","line":"学历不高……跟我有点像。"},{"place":"10:20","who":"旁白","line":"老师说，改变他的是三样东西：复盘日记、梦想清单、周计划跟踪表。"},{"place":"10:30","who":"燕美","line":"复盘日记写了六百多万字？这得多少年……"}],"cliff":"人生规划，是不是只有聪明人、有资源的人才玩得起？","teacher":["罗盘是一整套方案：从找目标，到把目标一步步实现。","老师靠三个工具一路走过来：复盘日记（写了几百万字）、梦想清单（不断迭代）、周计划跟踪表。","这些工具都不靠天赋，靠的是时间和坚持。时间的力量，会在复盘里一点点显现。","课程顺序是：分块、定向、分解、统筹、部署、复盘、执行，再加时间管理和精力管理。"],"source":"人生规划罗盘 · 00 开营仪式（按课程要点改写）","after":[{"place":"10:40","who":"燕美","line":"我不需要一开始就写几百万字，先每天写三行。"},{"place":"10:45","who":"旁白","line":"她在本子第一页写下三个工具的名字：复盘、梦想清单、周计划。"}],"quiz":[{"q":"常青老师走出来，主要靠的三个工具是？","options":["番茄钟、四象限、GTD","名校学历、人脉、资金","复盘日记、梦想清单、周计划跟踪表","运气、天赋、机会"],"answer":2,"why":"三个工具都不靠天赋，靠持续。"},{"q":"人生规划罗盘的课程，下面哪一项不在其中？","options":["分块","定向","复盘","炒股技巧"],"answer":3,"why":"罗盘讲的是分块、定向、分解、统筹、部署、复盘、执行、时间、精力。"}],"task":"在本子或表格里写下你这一年最想改变的 3 件事（不用完美），作为后面几课的素材。","taskHint":"可以是工作、身体、家庭任何方面。10 分钟。","ep":"第 16 集"},"rs01":{"id":"rs01","title":"忙了十年，好像什么都没变","courseLabel":"人生规划罗盘 · 01 分块","scenes":[{"place":"周日 · 家里","who":"旁白","line":"燕美翻出十年前的照片：刚进厂当出纳，每天跑银行。"},{"place":"15:00","who":"燕美（心里）","line":"现在管着三十个账户，可每天还是在跑银行、导流水、救火。"},{"place":"15:10","who":"旁白","line":"她想规划一下未来，可又觉得：厂里的事、家里的事，哪样我说了算？"},{"place":"15:20","who":"燕美","line":"人生都不可控，规划有什么用？"}],"cliff":"人生这么不可控，规划还有意义吗？","teacher":["正因为不可控，才更要规划。没有规划，人只会被环境推着走：有刺激才改变，没刺激就维持现状。","规划就是主动给自己制造成长的刺激，而且规划本身也是在试错。","分块：把人生分成几块，比如学习、工作、生活。每一块都相对可控，你对时间更敏感，也不容易焦虑彷徨。","前提是你心里真的认同：分块不是为了好看，而是为了每一块都能看见进展。"],"source":"人生规划罗盘 · 01 分块（按课程要点改写）","after":[{"place":"15:30","who":"燕美","line":"整个人生我控制不了，但“学习”这一块，我每天能挤出半小时。"},{"place":"15:40","who":"旁白","line":"她画了三个格子：学习、工作、生活。每格先写一件能自己说了算的事。"}],"quiz":[{"q":"按这一课，为什么不可控的人生更要规划？","options":["规划能让一切都可控","规划能保证成功","别人都在规划","没有规划，人只会被环境推着走"],"answer":3,"why":"规划是主动给自己创造成长刺激。"},{"q":"把人生分块的好处，不包括？","options":["保证每块都成功","每块相对可控","对时间更敏感","不容易焦虑"],"answer":0,"why":"分块让人更可控、更敏感、更安心，但不保证成功。"}],"task":"画三个格子：学习、工作、生活。每格写一件这个月你自己说了算、能推进的事。","taskHint":"例：学习——每天半小时影刀；工作——统一账户编号；生活——周末陪孩子一次。10 分钟。","ep":"第 17 集"},"rs02":{"id":"rs02","title":"我到底想要什么","courseLabel":"人生规划罗盘 · 02 定向","scenes":[{"place":"周六 · 家里","who":"旁白","line":"燕美试着写梦想清单。第一条：财务自由。第二条：成为更好的自己。"},{"place":"10:10","who":"燕美（心里）","line":"写完好像很宏大，可跟我明天要干什么，一点关系都没有。"},{"place":"10:20","who":"旁白","line":"她又想：别人都在考 CPA、学 Python，我是不是也该学？"},{"place":"10:30","who":"燕美","line":"我好像不知道自己真正想要什么。"}],"cliff":"目标写得又大又空，或者只会跟着别人跑。方向到底从哪来？","teacher":["方向 = 向内求 + 向外找。","向内求：用梦想清单唤醒真实需求。别写“财务自由”这种口号，写具体想要的场景，再过两轮筛，留下最想要的几个。","可以把人生当成一家公司：学习部、工作部、生活部，下面再分成长、技能、职业、家庭、财务、健康等部门，按部门写梦想。","向外找：模仿你欣赏的人；练底层通用能力，比如学习力、表达力；养成精英习惯，比如运动、复盘。"],"source":"人生规划罗盘 · 02 定向（按课程要点改写）","after":[{"place":"11:00","who":"燕美","line":"我想要的不是“财务自由”，是“月底不用加班到半夜，能陪孩子吃晚饭”。"},{"place":"11:10","who":"旁白","line":"她按“人生公司”的部门重写清单，第一轮划掉了一半。"}],"quiz":[{"q":"方向公式是？","options":["方向 = 向内求 + 向外找","方向 = 努力 + 运气","方向 = 兴趣 + 金钱","方向 = 学历 + 人脉"],"answer":0,"why":"向内了解自己，向外学习榜样和通用能力。"},{"q":"下面哪一条梦想写得更好？","options":["财务自由","月底不加班到半夜，能陪孩子吃晚饭","成为更好的自己","变得很厉害"],"answer":1,"why":"具体的场景才能唤醒真实需求。"},{"q":"“向外找”不包括？","options":["模仿欣赏的人","练底层通用能力","别人学什么我就学什么","养成精英习惯"],"answer":2,"why":"向外找是有选择地模仿和练基本功，不是盲目跟风。"}],"task":"按“学习部 / 工作部 / 生活部”各写 2 条具体的梦想，再划掉一条最不想要的。","taskHint":"写成具体场景，不写口号。10 分钟。","ep":"第 18 集"},"rs03":{"id":"rs03","title":"目标太大，不知道从哪下手","courseLabel":"人生规划罗盘 · 03 分解","scenes":[{"place":"周一 · 早上","who":"旁白","line":"燕美的梦想清单上写着：“三个月内实现流水自动导出。”"},{"place":"9:00","who":"燕美（心里）","line":"从哪开始？买软件？学编程？先问 IT？"},{"place":"周三","who":"旁白","line":"她同时开了三个教程，每个学一点，哪个都没学完。"},{"place":"周五","who":"燕美","line":"目标是对的，可我好像一直在原地打转。"}],"cliff":"目标明确了，为什么还是不知道第一步做什么？","teacher":["分解有两个常见误区：追求大而全，什么都想要；目标模糊，没有落脚点。","用 SMART 原则里最关键的两条：具体（S）和可衡量（M）。比如“三十个账户中，先让工行的 5 个一键导出”。","抓二八定律：找出最关键的 20% 要素，先做它们。复杂项目先找骨架，可以借别人现成的框架来改。","分解时还要做四件事：深挖意义、预估困难、设时间节点、加一点仪式感。"],"source":"人生规划罗盘 · 03 分解（按课程要点改写）","after":[{"place":"周五 18:00","who":"燕美","line":"先只做工行 5 个账户，这周跑通一个就算赢。"},{"place":"18:10","who":"旁白","line":"她关掉了两个教程，只留一个，在日历上写下：周三前跑通第一个账户。"}],"quiz":[{"q":"目标分解的两大误区是？","options":["太小、太具体","大而全、模糊无落脚点","太快、太慢","太难、太简单"],"answer":1,"why":"大而全和模糊，都会让目标落不了地。"},{"q":"SMART 里课程最强调的是哪两条？","options":["可实现、相关","相关、有时限","具体、可衡量","可实现、有时限"],"answer":2,"why":"先做到具体（S）和可衡量（M）。"},{"q":"“先做最关键的 20%”用到的是？","options":["墨菲定律","帕金森定律","马太效应","二八定律"],"answer":3,"why":"二八定律帮你找关键要素。"}],"task":"拿一个你的大目标，用 S 和 M 改写成一句话，再写出最关键的 1 个要素和本周的时间节点。","taskHint":"例：“6 月 30 日前，工行 5 个账户一键导出流水”，关键要素：登录自动化。10 分钟。","ep":"第 19 集"},"rs04":{"id":"rs04","title":"每件事都很急，一件也没做完","courseLabel":"人生规划罗盘 · 04 统筹","scenes":[{"place":"周一 9:00","who":"旁白","line":"燕美手上同时有：RPA 自动导出、贷后资料、年度审计准备、学习常青课。"},{"place":"周二","who":"燕美（心里）","line":"今天做哪个？好像都很急。"},{"place":"周三","who":"旁白","line":"上午做一点审计，下午做一点 RPA，晚上看一点课。"},{"place":"月底","who":"燕美","line":"四件事都开了头，一件都没完成。"}],"cliff":"事情一多就乱，怎么让它们有序推进？","teacher":["统筹是统一调配资源，去达成目标。田忌赛马就是统筹：同样的马，换个顺序就赢了。","五维度统筹法：按年、季、月、周、日排时间节点。年、季、月是宏观把控层，周、日是微观迭代层。","再配合 OKR：O 是目标，KR 是几条可衡量的关键结果，路径清楚了，每周就知道推哪一条。","注意：统筹只用在对结果有明确要求的项目上，不是所有小事都要排五层。"],"source":"人生规划罗盘 · 04 统筹（按课程要点改写）","after":[{"place":"月底 18:00","who":"燕美","line":"审计有硬截止日，排第一；RPA 是我的主项目，每周推一个 KR。"},{"place":"18:20","who":"旁白","line":"她写下 RPA 的 O 和三条 KR，按月拆到周，贴在周计划第一行。"}],"quiz":[{"q":"五维度统筹法的五个维度是？","options":["人、财、物、事、时","目标、计划、执行、检查、复盘","年、季、月、周、日","上午、下午、晚上、周末、假期"],"answer":2,"why":"按年季月周日排时间节点。"},{"q":"OKR 里的 KR 指的是？","options":["目标","奖金","考核等级","关键结果，可衡量"],"answer":3,"why":"O 是目标，KR 是可衡量的关键结果。"},{"q":"统筹法适合用在哪类事情上？","options":["对结果有明确要求的项目","所有小事","只用在工作上","只用在学习上"],"answer":0,"why":"统筹有成本，用在有明确结果要求的项目上。"}],"task":"给你最重要的一个项目写 1 个 O 和 2–3 个 KR，并把第一个 KR 放进本周计划。","taskHint":"KR 要能判断“做到没做到”。10 分钟。","ep":"第 20 集"},"rs05":{"id":"rs05","title":"周计划写了，周三就乱了","courseLabel":"人生规划罗盘 · 05 部署","scenes":[{"place":"周日晚上","who":"旁白","line":"燕美认真写了周计划：每天几点做什么，排得满满的。"},{"place":"周一","who":"旁白","line":"银行临时来查资料，上午的计划全打乱。"},{"place":"周三","who":"燕美（心里）","line":"计划赶不上变化，写了也白写。"},{"place":"周五","who":"旁白","line":"周计划表停在周二那一格。"}],"cliff":"计划总被打乱，还要不要做计划？","teacher":["计划是为了心里有数，不是为了死守。计划赶不上变化很正常，有计划才知道被打乱了多少、该怎么补。","最好在周末复盘时顺手做下周计划：先梳理（看上周完成了什么、还剩什么），再部署。","任务分两种：确定的事（有固定时间的会、截止日）直接排进日程；不确定的事准备备胎任务，有空就拿来做。","已经养成习惯的事，就不用每次都写进计划。周末做计划时也可以有一点仪式感：告别上周，迎接新一周。"],"source":"人生规划罗盘 · 05 部署（按课程要点改写）","after":[{"place":"周日 20:00","who":"燕美","line":"这次只把确定的事写进日程；RPA 和学习放进“备胎任务”，哪天有空就拿一个。"},{"place":"20:20","who":"旁白","line":"她先花十分钟复盘上周，再写计划。表格只用了一半的格子。"}],"quiz":[{"q":"按这一课，做计划的目的是？","options":["一分不差地照做","给领导看","证明自己很忙","心里有数，知道变化时怎么调整"],"answer":3,"why":"计划是为了心中有数，不是死守。"},{"q":"做下周计划最好的时机是？","options":["周末复盘时，先梳理再部署","周一早上临时想","月初一次排完","想起来再做"],"answer":0,"why":"复盘和计划连在一起，信息最完整。"},{"q":"没有固定时间、可以灵活做的事，应该？","options":["硬排进某个时间点","作为备胎任务，有空就做","不写进计划","放到下个月"],"answer":1,"why":"确定任务排日程，不确定任务做备胎。"}],"task":"写下周计划：只列 3 件确定的事（带时间）和 3 件备胎任务。","taskHint":"先花 3 分钟看一眼上周做了什么，再写。10 分钟。","ep":"第 21 集"},"rs07":{"id":"rs07","title":"道理都懂，就是动不起来","courseLabel":"人生规划罗盘 · 07 执行","scenes":[{"place":"周二 · 晚上","who":"旁白","line":"周计划写好了，O 和 KR 也定了。可燕美打开电脑，又先刷了半小时手机。"},{"place":"21:00","who":"燕美（心里）","line":"我知道该做，就是不想动。"},{"place":"21:30","who":"旁白","line":"她打开 RPA，发现上次的进度在哪都忘了，又得从头找。"},{"place":"22:00","who":"燕美","line":"算了，明天再说。"}],"cliff":"规划都做好了，为什么一到执行就拉垮？","teacher":["执行拉垮，就是动力太小、阻力太大。","提振动力：想清这件事的意义；给自己正面激励；设计成就系统和社交系统，找人一起、找人监督。","降低阻力：用 2W2H 写任务——做什么、为什么、怎么做、做多少，任务越清楚越好启动。把开始需要的东西提前准备好，比如上次进度的截图、要用的文件。","反馈：做完马上给自己奖励，确定性奖励和偶尔的惊喜奖励都可以。能固化成习惯的，一律固化。"],"source":"人生规划罗盘 · 07 执行（按课程要点改写）","after":[{"place":"22:10","who":"燕美","line":"我缺的不是意志力，是“下一步做什么”写清楚。"},{"place":"22:20","who":"旁白","line":"她在 RPA 文件夹里新建了一个“下次从这里开始.txt”，写下：做什么、为什么、怎么做、做多少。"}],"quiz":[{"q":"执行拉垮的根本原因，按课程是？","options":["人太懒","动力太小、阻力太大","没有天赋","工作太忙"],"answer":1,"why":"动力不足、阻力太大，二者都要调。"},{"q":"2W2H 任务法包括？","options":["谁、何时、何地、为何","目标、计划、执行、检查","做什么、为什么、怎么做、做多少","早、中、晚、夜"],"answer":2,"why":"What、Why、How、How much，让任务清楚到能直接开始。"},{"q":"把下次要用的文件和进度提前准备好，属于？","options":["增加动力","找人监督","物质奖励","降低阻力：把利于开始的动作准备好"],"answer":3,"why":"提前准备是在降低启动阻力。"}],"task":"用 2W2H 写下你明天最重要的一件任务，并把开始需要的文件或链接准备好放在桌面。","taskHint":"4 行：做什么、为什么、怎么做、做多少。10 分钟。","ep":"第 22 集"},"rs08":{"id":"rs08","title":"一天过去了，时间去哪了","courseLabel":"人生规划罗盘 · 08 时间管理","scenes":[{"place":"周四 18:00","who":"旁白","line":"燕美关电脑时想：今天好像什么也没干，却累得要死。"},{"place":"18:05","who":"燕美（心里）","line":"上午被电话打断十几次，下午刷了好几次手机，晚上又在纠结做什么。"},{"place":"周五","who":"旁白","line":"她试着记了一天时间：真正连续做事超过 30 分钟的，只有一次。"},{"place":"17:30","who":"燕美","line":"原来我的时间是碎的。"}],"cliff":"每天都很忙，时间到底去哪了？","teacher":["人对时间的感知有缺陷：忙的时候觉得快，闲的时候觉得慢，很难准确估计。先做时间记录，提高时间敏感度。","建立时间价值意识：你的一小时值多少钱？想想机会成本——刷手机的半小时，本可以做什么？","时间分三种：整块时间做重要、需要专注的事；碎片时间做小事，避免把大事切碎；暗时间（走路、通勤）用来想问题。","管住手机：把没意识的使用变成有意识的使用，隐藏让你分心的 App。忙的人也可以花钱买时间。"],"source":"人生规划罗盘 · 08 时间管理（按课程要点改写）","after":[{"place":"17:40","who":"燕美","line":"每天上午 9:00–10:00 当整块时间，电话先静音，只做对账。"},{"place":"17:45","who":"旁白","line":"她把短视频 App 挪到手机最后一屏，并在日历上锁住了明天的整块时间。"}],"quiz":[{"q":"提高时间敏感度的第一步是？","options":["买一个好看的日程本","早起","做时间记录，看清时间去哪了","多做事"],"answer":2,"why":"先记录，才能看见自己的时间。"},{"q":"需要专注、重要的事，最适合放在？","options":["碎片时间","暗时间","睡前","整块时间"],"answer":3,"why":"整块时间做重要的事。"},{"q":"走路、通勤时用来想问题，用的是？","options":["暗时间","整块时间","碎片时间","加班时间"],"answer":0,"why":"暗时间：注意力释放，适合思考。"}],"task":"在明天日历上锁定一段 45–60 分钟的整块时间，写清只做哪件事，并把一个最耗时间的 App 挪到最后一屏。","taskHint":"整块时间里手机静音或放远一点。10 分钟设置完。","ep":"第 23 集"},"rs09":{"id":"rs09","title":"时间排好了，人却没力气","courseLabel":"人生规划罗盘 · 09 精力管理","scenes":[{"place":"周一 14:00","who":"旁白","line":"燕美把整块时间排在下午两点，准备学 RPA。"},{"place":"14:20","who":"燕美（心里）","line":"好困……眼皮在打架。"},{"place":"14:40","who":"旁白","line":"她喝了第三杯咖啡，还是看不进去。"},{"place":"晚上","who":"旁白","line":"前一晚为了追剧，她一点才睡。"}],"cliff":"时间排得再好，没精力也白搭，精力怎么管？","teacher":["精力是时间管理的地基。没精力，排再多时间也用不好。","精神能量 = 目标 × 动机：有方向、有想做的理由，精神才有劲。","身体能量靠五样：情绪、饮食、睡眠、小休、运动。情绪可以用 ABC 模型调整看法，多喝水、规律吃饭、睡够，工作中间小休一下。","找到自己的精力周期：一天里哪个时段最清醒，就把最难的事放在那里。还可以先做低刺激的事，再做高刺激的事，避免精力被刷手机这类高刺激的事先耗光。"],"source":"人生规划罗盘 · 09 精力管理（按课程要点改写）","after":[{"place":"21:00","who":"燕美","line":"我的清醒时段是早上九点到十一点。最难的事应该放在那里。"},{"place":"21:10","who":"旁白","line":"她把 RPA 挪到早上，下午改做整理单据这类轻活，还给自己定了 23:30 睡觉的闹钟。"}],"quiz":[{"q":"精神能量的公式是？","options":["精神能量 = 睡眠 + 饮食","精神能量 = 咖啡 × 2","精神能量 = 时间 × 效率","精神能量 = 目标 × 动机"],"answer":3,"why":"有目标、有动机，精神才有劲。"},{"q":"最难的工作应该放在？","options":["自己精力最好的时段","下午犯困的时候","下班后","随便什么时候"],"answer":0,"why":"按自己的精力周期排事情。"},{"q":"下面哪项不属于身体能量的来源？","options":["睡眠","熬夜刷剧","饮食","运动"],"answer":1,"why":"情绪、饮食、睡眠、小休、运动，是身体能量的五个来源。"}],"task":"记一天里你最清醒的时段，把明天最难的一件事挪到那个时段，再定一个睡觉提醒。","taskHint":"如果还不知道，就明天每两小时给精力打个 1–5 分。10 分钟。","ep":"第 24 集"},"rs10":{"id":"rs10","title":"把整个罗盘串起来","courseLabel":"人生规划罗盘 · 10 结营仪式","scenes":[{"place":"周日 · 家里","who":"旁白","line":"罗盘课程学到最后一课。燕美把笔记摊了一桌子。"},{"place":"15:00","who":"燕美（心里）","line":"分块、定向、分解、统筹、部署、复盘、执行、时间、精力……太多了。"},{"place":"15:10","who":"旁白","line":"她怕自己学完就忘，像以前很多次一样。"},{"place":"15:20","who":"燕美","line":"这些东西，到底怎么连成一套？"}],"cliff":"学了那么多模块，怎么把它们连成一套自己的系统？","teacher":["串一遍：分块让人生可控；定向找到方向（向内求 + 向外找）；分解把目标变成能做的项目（SMART 的 S 和 M、二八定律）。","统筹用五维度和 OKR 排节点；部署落到周计划、日计划；复盘总结一天并生成明天的计划；执行靠提动力、降阻力。","时间管理和精力管理是地基，撑着上面的每一层。","成长没有捷径，盯住“因”：每天复盘一点点，时间会让复盘显出威力。"],"source":"人生规划罗盘 · 10 结营仪式（按课程要点改写）","after":[{"place":"15:40","who":"燕美","line":"我不用一次把所有模块都用上。先保住两样：每晚复盘三行，每周日做周计划。"},{"place":"15:50","who":"旁白","line":"她把整套模块画成一张图，贴在书桌前，在“复盘”和“部署”两个格子上画了星。"}],"quiz":[{"q":"罗盘里把目标变成能做的项目，是哪一步？","options":["分块","分解","定向","复盘"],"answer":1,"why":"分解：用 SMART 和二八定律把目标落到项目。"},{"q":"支撑整套罗盘的“地基”是？","options":["梦想清单","OKR","时间管理和精力管理","周计划"],"answer":2,"why":"时间和精力是一切执行的地基。"},{"q":"学完整套课，老师强调最重要的是？","options":["一次全部用上","再报更多课程","等时机成熟","盯住“因”，坚持复盘"],"answer":3,"why":"成长没有捷径，坚持复盘会显出威力。"}],"task":"把罗盘的模块画成一张简图，在你现在最需要的 2 个模块上画星，写下这周各做一个什么动作。","taskHint":"例：复盘——每晚三行；部署——周日 20:00 做周计划。10 分钟。","ep":"第 25 集"},"zs01":{"id":"zs01","title":"学过的东西，散落一地","courseLabel":"知识体系训练营 · 01 知识体系的理念","scenes":[{"place":"周三 · 财务室","who":"厂长老张","line":"燕美，新来的会计问增值税专票怎么认证，你给她讲讲。"},{"place":"10:10","who":"燕美（心里）","line":"这个我知道啊……可从哪讲起呢？"},{"place":"10:20","who":"旁白","line":"她讲了一点认证，又跳到抵扣，又想起进项转出。新会计越听越糊涂。"},{"place":"10:40","who":"燕美","line":"我会做，但讲不成一套。"}],"cliff":"明明知道很多，为什么一用就乱、一讲就散？","teacher":["知识体系就是大脑里的结构框架，心理学叫“图式”。","对学的意义：有了框架，新知识会自动归位，像衣服挂进衣柜对应的格子里；有体系的知识也更好记、更好迭代。","对用的意义：没有体系，调用时容易挂一漏万，表达时也撑不起来。有了框架，就能按问题类型快速调出来。","就像国家的行政区划：省、市、县，一层层找下去，不会乱。"],"source":"知识体系训练营 · 01 知识体系的理念（按课程要点改写）","after":[{"place":"10:50","who":"燕美","line":"我先画个框：发票拿到 → 认证 → 抵扣 → 特殊情况。再往里填。"},{"place":"11:10","who":"旁白","line":"新会计照着这张图问了三个问题，都答上了。"}],"quiz":[{"q":"知识体系的本质是？","options":["一堆笔记","一本教材","一套软件","大脑里的结构框架（图式）"],"answer":3,"why":"知识体系就是大脑里的结构框架。"},{"q":"有知识体系的好处，不包括？","options":["不用再学习","新知识自动归位","更好记","调用更快"],"answer":0,"why":"体系让学习更高效，但学习永远要继续。"}],"task":"选一个你最熟悉的工作主题（比如发票、付款、对账），画一个最多 3 层的框架图。","taskHint":"第一层 3–5 个大块，往下各写 2–3 个要点。10 分钟。","ep":"第 26 集"},"zs02":{"id":"zs02","title":"知道定义，却做不对","courseLabel":"知识体系训练营 · 02 四大知识分类","scenes":[{"place":"周一","who":"旁白","line":"燕美背得出“银行承兑汇票”的定义，可第一次自己办贴现，还是卡住了好几次。"},{"place":"10:00","who":"燕美（心里）","line":"定义我都懂，为什么一到操作就不会？"},{"place":"14:00","who":"旁白","line":"老会计三两下就办完了，还顺手提醒她：这个月贴现利率高，可以缓几天。"},{"place":"14:10","who":"燕美","line":"她怎么知道什么时候该缓？"}],"cliff":"同样是“知道”，为什么有人会背、有人会用、有人会判断？","teacher":["知识分四类：事实性知识（是什么，比如某个日期、数字）、概念性知识（概念和关系，比如“承兑汇票”的含义）。","程序性知识：怎么做的步骤，比如贴现流程；元认知知识：知道自己懂不懂、什么时候该用什么方法。","越往后越难学，但迁移能力越强，元认知最值钱。","学事实性知识，会查就行；概念性知识要理解关系；程序性知识要动手练；元认知要靠复盘和反思。"],"source":"知识体系训练营 · 02 四大知识分类（按课程要点改写）","after":[{"place":"14:20","who":"燕美","line":"我只学到概念层，流程要练，“什么时候缓”是老会计的元认知。"},{"place":"14:30","who":"旁白","line":"她请老会计把判断贴现时机的几个考虑点说一遍，记进了复盘。"}],"quiz":[{"q":"“贴现的办理步骤”属于哪类知识？","options":["程序性","事实性","概念性","元认知"],"answer":0,"why":"怎么做的步骤，是程序性知识。"},{"q":"四类知识里，迁移能力最强的是？","options":["事实性","元认知","概念性","程序性"],"answer":1,"why":"越往后越难学、迁移越强，元认知最值钱。"},{"q":"学事实性知识，最省力的策略是？","options":["全部背下来","反复练习","知道去哪查就行","写论文"],"answer":2,"why":"事实性知识会检索就够，不必硬背。"}],"task":"从你这周学到或用到的知识里，各举一个事实性、概念性、程序性、元认知的例子。","taskHint":"四行就行。元认知可以是“我发现自己读长文件容易走神”。10 分钟。","ep":"第 27 集"},"zs03":{"id":"zs03","title":"只看财务书，越看越窄","courseLabel":"知识体系训练营 · 03 搭建通识体系","scenes":[{"place":"周末","who":"旁白","line":"燕美书架上全是会计、税务、Excel 的书。"},{"place":"周一 · 厂部","who":"厂长老张","line":"你看下这个合同条款，有没有风险？"},{"place":"10:10","who":"燕美（心里）","line":"合同……那是法务的事吧？"},{"place":"10:30","who":"旁白","line":"她发现，很多问题光靠财务知识，根本看不全。"}],"cliff":"专业知识够用了，为什么还要学专业以外的东西？","teacher":["通识体系像内功心法，是以学为用：先学好各学科的基本道理，用的时候自然能调出来。","芒格提倡多元思维模型：一个人如果只有一把锤子，看什么都像钉子。多几个学科视角，看问题才全面。","构建方法：泛读每个学科入门级的好书，先建立学科的大脉络，不求深。","学科很多，不必全学：心理学、经济学、管理学、历史等，挑和你生活工作最相关的先读。"],"source":"知识体系训练营 · 03 搭建通识体系（按课程要点改写）","after":[{"place":"10:40","who":"燕美","line":"我先读一本法律入门、一本心理学入门，不求精，求看懂大框架。"},{"place":"10:50","who":"旁白","line":"她在读书清单上写下两本入门书，每天睡前读 15 分钟。"}],"quiz":[{"q":"通识体系的思路是？","options":["以用为学","以学为用","只学专业","什么都学到精通"],"answer":1,"why":"通识是以学为用：先学，再在需要时调用。"},{"q":"“只有一把锤子，看什么都像钉子”，说明了？","options":["锤子很有用","要多买工具","单一视角的局限，需要多元思维模型","专业最重要"],"answer":2,"why":"多元思维模型，提供多个看问题的视角。"},{"q":"搭建通识体系，推荐的读书方式是？","options":["每科精读十本专业书","只看短视频","只读畅销书","泛读入门级好书，先建学科脉络"],"answer":3,"why":"入门级好书帮你快速建立学科大框架。"}],"task":"挑一个你工作中常碰到、但不是财务的学科（法律、心理、管理……），找一本入门书放进读书清单。","taskHint":"写下书名和你最想用它解决的一个问题。10 分钟。","ep":"第 28 集"},"zs04":{"id":"zs04","title":"学了一堆，没一样能解决眼前的事","courseLabel":"知识体系训练营 · 04 搭建专用体系","scenes":[{"place":"周六","who":"旁白","line":"燕美同时在学 Python、英语、PPT、理财。"},{"place":"周一","who":"旁白","line":"月底对账还是要一个个点网银，跟学的东西都不沾边。"},{"place":"周一 21:00","who":"燕美（心里）","line":"我学了这么多，怎么眼前最急的事还是没解决？"},{"place":"21:10","who":"燕美","line":"是不是学的顺序不对？"}],"cliff":"学得很多却解决不了眼前的问题，专用知识该怎么搭？","teacher":["专用体系是以用为学：围绕一个刚需问题去学，需要什么学什么。","两条原则：当下需求优先，兴趣第二优先。先解决最痛的问题，有余力再学感兴趣的。","以主题为单位推进：比如“多账户流水批量导出”就是一个主题，相关的网银、RPA、Excel 都围绕它学。","通识像森林的土壤，专用像一棵棵树：两者配合，才长得好。"],"source":"知识体系训练营 · 04 搭建专用体系（按课程要点改写）","after":[{"place":"21:20","who":"燕美","line":"Python、英语先停。我的主题是“流水批量导出”，只学和它有关的。"},{"place":"21:30","who":"旁白","line":"她把收藏夹里和这个主题有关的教程挑出来，其他的移到“将来可能”。"}],"quiz":[{"q":"专用体系的核心思路是？","options":["以学为用","只按兴趣学","以用为学，围绕刚需问题学","什么都学一点"],"answer":2,"why":"专用体系围绕要解决的问题去学。"},{"q":"专用体系的两条原则是？","options":["兴趣第一、需求第二","先难后易","先易后难","当下需求优先、兴趣第二"],"answer":3,"why":"先解决最痛的需求，再顾兴趣。"}],"task":"写下你当下最痛的一个工作问题，作为一个学习主题，列出学它需要的 3 项知识或技能。","taskHint":"例：主题“流水批量导出”——网银导出规则、RPA 基础、Excel 合并。10 分钟。","ep":"第 29 集"},"zs05":{"id":"zs05","title":"把学习变成一个项目","courseLabel":"知识体系训练营 · 05 PBL 项目制学习法","scenes":[{"place":"周一","who":"旁白","line":"燕美决定：这次不“学课程”，而是“做一个项目”——三个月内实现多账户流水批量导出。"},{"place":"9:30","who":"燕美（心里）","line":"可是做项目要什么能力？我从来没这样学过。"},{"place":"10:00","who":"旁白","line":"她以前学东西，都是从第一课看到最后一课，看完就忘。"},{"place":"10:10","who":"燕美","line":"这次换个方式。"}],"cliff":"什么叫项目制学习？它和“上课学”有什么不同？","teacher":["PBL 是问题导向或课题导向的学习：在解决真实问题的过程中积累知识。","它需要六种能力，叫六力模型：项目力（管好学习这个项目）、输入力（快速入门）、研究力（深入研究）。","还有结构力（搭框架）、本质力（找根本）、迭代力（不断更新）。","和“上课学”的区别：不是按课程顺序学，而是卡在哪，去哪找工具。"],"source":"知识体系训练营 · 05 PBL 项目制学习法（按课程要点改写）","after":[{"place":"10:20","who":"燕美","line":"我的项目就是流水批量导出，常青课是工具箱，卡在哪就翻哪一课。"},{"place":"10:30","who":"旁白","line":"她在项目文档第一行写：目标——下个月末，不再一个个登网银。"}],"quiz":[{"q":"PBL 学习法的核心是？","options":["按课程顺序学完","考证","背书","在解决真实问题中积累知识"],"answer":3,"why":"问题导向、课题导向的学习。"},{"q":"下面哪个不属于 PBL 六力模型？","options":["记忆力","项目力","输入力","研究力"],"answer":0,"why":"六力：项目力、输入力、研究力、结构力、本质力、迭代力。"}],"task":"给你的一个刚需问题写一句项目目标：做到什么、什么时候、怎么判断做到了。","taskHint":"判断标准要能说“是/否”。10 分钟。","ep":"第 30 集"},"zs06":{"id":"zs06","title":"项目开了头，就是推不动","courseLabel":"知识体系训练营 · 06 项目力","scenes":[{"place":"第 2 周","who":"旁白","line":"燕美的流水导出项目，进度停在“研究了几家银行的导出页面”。"},{"place":"周三","who":"燕美（心里）","line":"下一步做什么？我也说不清。"},{"place":"周四","who":"旁白","line":"她又看了几个新教程，感觉什么都有用，又什么都没推进。"},{"place":"周五","who":"燕美","line":"没有地图，我一直在乱走。"}],"cliff":"项目目标清楚了，为什么还是推不动？","teacher":["项目力是用项目管理的思路管学习。三步：明目标、制地图、上部署。","明目标：最终要交付什么，怎么判断完成。制地图：把项目拆成几个阶段，分清主线和支线，主线优先。","上部署：把任务排进周计划和日计划。","几个提醒：刻舟求剑学习法——先在框架上刻好记号，再往里填内容；西蒙学习法——集中时间攻一个主题；烧开水理论——水要一口气烧开，断断续续永远开不了。"],"source":"知识体系训练营 · 06 项目力（按课程要点改写）","after":[{"place":"周五 17:00","who":"燕美","line":"主线：工行 5 个账户跑通。支线：其他银行、美化报表，先放一放。"},{"place":"17:20","who":"旁白","line":"她把主线拆成三步，排进了下周一、三、五的整块时间。"}],"quiz":[{"q":"项目力的三步是？","options":["明目标、制地图、上部署","计划、执行、复盘","输入、加工、输出","找人、找钱、找时间"],"answer":0,"why":"先目标，再地图，再部署。"},{"q":"“烧开水理论”提醒我们？","options":["要多喝热水","学习要集中投入，断断续续烧不开","慢慢来","先休息"],"answer":1,"why":"集中投入才能突破，断断续续效果很差。"},{"q":"项目里的主线和支线，应该？","options":["一起推进","支线优先","主线优先，支线暂缓","随机"],"answer":2,"why":"分清主次，先保主线。"}],"task":"给你的项目画一张简单地图：写出 1 条主线（3 步以内）和 2 条暂缓的支线。","taskHint":"把主线第一步排进本周日历。10 分钟。","ep":"第 31 集"},"zs07":{"id":"zs07","title":"一个新领域，从哪开始入门","courseLabel":"知识体系训练营 · 07 输入力","scenes":[{"place":"周一","who":"旁白","line":"厂长让燕美了解一下“供应链金融”，看能不能帮公司融资。"},{"place":"10:00","who":"燕美（心里）","line":"完全没接触过……先搜一下？"},{"place":"11:00","who":"旁白","line":"搜出来上百篇文章，有的讲政策，有的讲平台，有的讲案例，越看越晕。"},{"place":"11:30","who":"燕美","line":"我需要一个入门的抓手。"}],"cliff":"面对一个陌生领域，怎么快速建立基础认识？","teacher":["输入力的目标：快速建立一个领域的基础认识。先搭最小可用框架，再做主题阅读往里填。","工具一，黄金圈：是什么、为什么、怎么做。先把这三个问题回答清楚，就入门了。","工具二，问题树：把大问题拆成小问题，一个个找答案。","主题阅读：围绕同一个主题读几本书或几篇文章，对比着看，比只读一本更全面。"],"source":"知识体系训练营 · 07 输入力（按课程要点改写）","after":[{"place":"11:40","who":"燕美","line":"供应链金融是什么？为什么企业要用？怎么申请？先回答这三个。"},{"place":"14:00","who":"旁白","line":"她找了三篇不同来源的文章对照着看，下午给厂长交了一页纸的入门说明。"}],"quiz":[{"q":"黄金圈的三个问题是？","options":["谁、何时、何地","是什么、为什么、怎么做","多少、多久、多贵","好不好、对不对、行不行"],"answer":1,"why":"What、Why、How，快速入门的三个问题。"},{"q":"进入新领域，课程建议先？","options":["读完最厚的那本书","收藏一百篇文章","搭最小可用框架，再往里填","找专家全权代劳"],"answer":2,"why":"先有框架，后面的信息才有地方放。"}],"task":"选一个你最近要了解的新领域，用“是什么、为什么、怎么做”各写一两句。","taskHint":"不确定的地方打问号，就是下一步要查的问题。10 分钟。","ep":"第 32 集"},"zs08":{"id":"zs08","title":"每篇文章说法都不一样","courseLabel":"知识体系训练营 · 08 研究力","scenes":[{"place":"周三","who":"旁白","line":"燕美想弄清：公司该不该用 RPA 来做流水导出？"},{"place":"10:00","who":"旁白","line":"有人说 RPA 万能，有人说维护成本高，有人说直接用银企直连更好。"},{"place":"10:30","who":"燕美（心里）","line":"每个人说得都有道理，我到底听谁的？"},{"place":"11:00","who":"燕美","line":"我好像在盲人摸象。"}],"cliff":"观点打架时，怎么整合出自己的判断？","teacher":["研究力是针对一个知识缺口做主题研究，整合不同观点，避免盲人摸象。","五步：一、基础输入，先搞懂基本概念；二、召集大师，找几个这个领域靠谱的人或资料。","三、略读抓触点，快速看一遍，标出有用的观点；四、精读炼触点，对关键观点深入理解。","五、加工成模型：把不同观点整合成你自己的判断框架，比如“什么情况用 RPA、什么情况用银企直连”。"],"source":"知识体系训练营 · 08 研究力（按课程要点改写）","after":[{"place":"14:00","who":"燕美","line":"账户少、银行多 → RPA；账户多、集中在一两家银行 → 银企直连。"},{"place":"14:10","who":"旁白","line":"她把这个判断画成一张小表，标上每条依据的来源。"}],"quiz":[{"q":"研究力要解决的核心问题是？","options":["读得更快","只听一个专家的","整合不同观点，避免盲人摸象","记住更多"],"answer":2,"why":"整合多方观点，形成自己的判断。"},{"q":"研究五步的最后一步是？","options":["基础输入","召集大师","略读抓触点","加工成模型"],"answer":3,"why":"最终要加工成自己的判断模型。"}],"task":"选一个你有疑问的工作问题，找 3 个不同来源的说法，写出你整合后的一句判断。","taskHint":"例：“账户少、银行多用 RPA；账户集中用银企直连。”10 分钟。","ep":"第 33 集"},"zs09":{"id":"zs09","title":"笔记很多，但找不到结构","courseLabel":"知识体系训练营 · 09 结构力","scenes":[{"place":"周日","who":"旁白","line":"燕美的笔记软件里有两百多条笔记，大部分在“未分类”里。"},{"place":"15:00","who":"燕美（心里）","line":"我想整理成体系，可是按什么分？"},{"place":"15:20","who":"旁白","line":"她试着按课程分，又发现很多内容是交叉的。"},{"place":"15:40","who":"燕美","line":"分来分去，越分越乱。"}],"cliff":"知识要搭成结构，到底按什么来分？","teacher":["知识体系的本质是结构框架。树状结构最适合承载知识，网状结构是内化以后自然形成的结果。","分篮子有几种方式：按元起点或主题分，比如“财务”“学习”“家庭”。","按黄金圈嵌套分：每个主题下面再分是什么、为什么、怎么做。","按时空维度分：比如按时间顺序、按流程环节。选一种最贴合你使用场景的方式。"],"source":"知识体系训练营 · 09 结构力（按课程要点改写）","after":[{"place":"16:00","who":"燕美","line":"按主题分：工作流程、学习方法、个人生活。工作流程下面再按“收、付、对、报”分。"},{"place":"16:30","who":"旁白","line":"她先把三十条笔记放进新结构里，剩下的周末再慢慢挪。"}],"quiz":[{"q":"最适合承载知识的结构是？","options":["网状结构","随意堆放","按时间排序","树状结构"],"answer":3,"why":"树状结构清楚，网状是内化后的结果。"},{"q":"下面哪一种不是课程讲的分篮子方式？","options":["按笔记字数","按主题","按黄金圈嵌套","按时空维度"],"answer":0,"why":"按主题、黄金圈嵌套、时空维度来分。"}],"task":"给你的笔记定一个最多两层的树状结构，先把 10 条笔记放进去。","taskHint":"第一层建议 3–7 个篮子。10 分钟。","ep":"第 34 集"},"zs10":{"id":"zs10","title":"费用总超预算，到底卡在哪","courseLabel":"知识体系训练营 · 10 本质力","scenes":[{"place":"季度末","who":"厂长老张","line":"这个季度费用又超了，下季度每个部门砍 10%！"},{"place":"10:00","who":"燕美（心里）","line":"每次都“一刀切”，下个季度照样超。"},{"place":"10:20","who":"旁白","line":"她翻了三个季度的数据，超支的项目每次都不一样。"},{"place":"10:40","who":"燕美","line":"问题的根到底在哪？"}],"cliff":"表面问题一个接一个，怎么找到最底层的那个原因？","teacher":["本质力是找第一原理：事物的起点和最根本的问题。","方法有两种：归纳——从大量现象里总结出共同规律；演绎——从基本原理推出具体结论。","演绎可以走“归零—解构—重构”三步：放下原有做法，把问题拆成要素，再重新组合方案。","找到本质以后，表面问题往往会一起解决。"],"source":"知识体系训练营 · 10 本质力（按课程要点改写）","after":[{"place":"11:00","who":"燕美","line":"三个季度超支，共同点都是“没有事前审批，事后才报销”。"},{"place":"11:10","who":"旁白","line":"她向厂长建议：不一刀切，而是加一个超过五千元先审批的规则。"}],"quiz":[{"q":"本质力要找的是？","options":["最表面的现象","事物的起点和根本问题","最省钱的办法","领导的想法"],"answer":1,"why":"找第一原理，即事物的起点和根本问题。"},{"q":"从三个季度数据中找共同点，用的是？","options":["演绎","类比","归纳","猜测"],"answer":2,"why":"从多个现象总结规律，是归纳。"}],"task":"找一个反复出现的问题，列出它出现过的 3 次情况，写出这几次的共同点。","taskHint":"共同点往往就是更接近本质的原因。10 分钟。","ep":"第 35 集"},"zs11":{"id":"zs11","title":"去年整理的框架，今年用不上了","courseLabel":"知识体系训练营 · 11 迭代力","scenes":[{"place":"年初","who":"旁白","line":"燕美翻出去年做的“付款流程”知识框架。"},{"place":"9:30","who":"燕美（心里）","line":"去年还没有电子承兑，今年都在用了。框架里一点都没有。"},{"place":"9:40","who":"旁白","line":"她还发现，有两条笔记讲的其实是同一件事，只是名字不同。"},{"place":"10:00","who":"燕美","line":"框架做完就不动了，难怪越来越不好用。"}],"cliff":"知识体系搭好了，为什么用着用着就过时了？","teacher":["知识体系要持续迭代。","增：给一个知识点补上新的使用场景和新案例。","减：把本质相同的知识点合并，删掉过时的内容。","显性知识要用成本能：常用的方法练到不用想就会。隐性经验要写成方法：自己做事的窍门，整理成清单或模板。"],"source":"知识体系训练营 · 11 迭代力（按课程要点改写）","after":[{"place":"10:10","who":"燕美","line":"付款流程里加上电子承兑，那两条重复的合成一条。"},{"place":"10:30","who":"旁白","line":"她还把自己“月底先核大额再核小额”的窍门写成了一条方法。"}],"quiz":[{"q":"知识体系的迭代包括？","options":["只增不减","只减不增","增和减","一次做好不用动"],"answer":2,"why":"增新场景、减重复和过时内容。"},{"q":"把自己做事的窍门写成清单或模板，是？","options":["把显性知识变成本能","删除知识","增加案例","把隐性经验写成方法"],"answer":3,"why":"隐性经验显性化，才能复用和分享。"}],"task":"打开你的一个知识框架或笔记，做一次“增”和一次“减”。","taskHint":"增：补一个新案例；减：合并两条重复的。10 分钟。","ep":"第 36 集"},"zs12":{"id":"zs12","title":"PBL 听懂了，怎么真的开始","courseLabel":"知识体系训练营 · 加餐1 如何实操 PBL","scenes":[{"place":"周日","who":"旁白","line":"燕美听完 PBL 的课，跃跃欲试，可坐在电脑前又不知道第一步做什么。"},{"place":"15:00","who":"燕美（心里）","line":"目标、六力、项目地图……先做哪个？"},{"place":"15:20","who":"旁白","line":"她想到自己最近只有晚上一小时，而且常常很累。"},{"place":"15:30","who":"燕美","line":"我得先算一下，自己到底有多少时间和力气。"}],"cliff":"PBL 道理都懂了，实际操作时第一步做什么？","teacher":["知识体系 = 要素（知识点）+ 要素之间的逻辑。PBL 就是在解决问题的过程中，把要素和逻辑一起搭起来。","PBL 工作流从规划力开始：以终为始，先想清楚——动机是什么、目标是什么。","再估算要投入多少时间、自己当下的精力状态如何。","评估完再定项目大小：时间少就把项目切小，宁可小步跑通，也不要贪大。"],"source":"知识体系训练营 · 加餐1 如何实操 PBL（按课程要点改写）","after":[{"place":"15:40","who":"燕美","line":"每周三个晚上、一次一小时。那就先只做一家银行。"},{"place":"15:50","who":"旁白","line":"她在项目文档开头加了一段：动机、目标、每周投入时间、当前精力。"}],"quiz":[{"q":"知识体系由什么构成？","options":["笔记 + 软件","书 + 课程","老师 + 同学","要素 + 要素之间的逻辑"],"answer":3,"why":"知识点和它们之间的逻辑。"},{"q":"PBL 工作流的第一步是？","options":["规
